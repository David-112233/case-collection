<style>
html {
  width: 100vw;
  height: 100vh;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

body {
  width: 100vw;
  height: 100vh;
  font-family: "Roboto", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  min-width: 320px;
  background: #000;
  perspective-origin: 50% 50%;
  perspective: 1000px;
}

.is-hidden {
  display: none !important;
}

.message {
  position: fixed;
  z-index: 1;
  color: #e6e6e6;
  opacity: .8;
  padding: 5px;
  bottom: 0;
  font-weight: 100;
  text-shadow: 1px 1px 1px #000;
  pointer-events: none;
  user-select: none;
}
@media (max-width: 768px) {
  .message {
    font-size: 11px;
    bottom: auto;
    top: 0;
  }
}

.room {
  position: relative;
  width: 50vw;
  height: 50vw;
  min-width: 320px;
  min-height: 320px;
  max-height: 60vh;
  transform: rotateX(-5deg) translateZ(250px) translateY(-40px);
  transform-style: preserve-3d;
  pointer-events: none;
  user-select: none;
}

@keyframes panRoom {
  0% {
    transform: rotateX(-5deg) rotateY(-15deg) translateZ(310px) translateY(-40px);
  }
  50% {
    transform: rotateX(-5deg) rotateY(15deg) translateZ(310px) translateY(-40px);
  }
  100% {
    transform: rotateX(-5deg) rotateY(-15deg) translateZ(310px) translateY(-40px);
  }
}
.wall {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #ccc;
  backface-visibility: hidden;
}
.wall.is-t {
  transform: rotateX(90deg) rotateY(180deg);
  transform-origin: 50% 0%;
  background: #635858;
  box-shadow: inset 0 0 0 25px rgba(255, 255, 255, 0.1);
}
.wall.is-n {
  background: #D9D9D9;
  background-color: #6d695c;
  background-image: repeating-linear-gradient(120deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.1) 1px, transparent 1px, transparent 60px), repeating-linear-gradient(60deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.1) 1px, transparent 1px, transparent 60px), linear-gradient(60deg, rgba(0, 0, 0, 0.1) 25%, transparent 25%, transparent 75%, rgba(0, 0, 0, 0.1) 75%, rgba(0, 0, 0, 0.1)), linear-gradient(120deg, rgba(0, 0, 0, 0.1) 25%, transparent 25%, transparent 75%, rgba(0, 0, 0, 0.1) 75%, rgba(0, 0, 0, 0.1));
  background-size: 70px 120px;
  box-shadow: inset 0 -7px 0 #3F1F00;
}
.wall.is-e {
  transform: rotateY(90deg) rotateX(180deg);
  transform-origin: 100% 50%;
  background-color: #6d695c;
  background-image: repeating-linear-gradient(120deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.1) 1px, transparent 1px, transparent 60px), repeating-linear-gradient(60deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.1) 1px, transparent 1px, transparent 60px), linear-gradient(60deg, rgba(0, 0, 0, 0.1) 25%, transparent 25%, transparent 75%, rgba(0, 0, 0, 0.1) 75%, rgba(0, 0, 0, 0.1)), linear-gradient(120deg, rgba(0, 0, 0, 0.1) 25%, transparent 25%, transparent 75%, rgba(0, 0, 0, 0.1) 75%, rgba(0, 0, 0, 0.1));
  background-size: 70px 120px;
  box-shadow: inset 0 7px 0 #3F1F00;
}
.wall.is-w {
  transform: rotateY(-90deg) rotateX(-180deg);
  transform-origin: 0% 50%;
  background-color: #6d695c;
  background-image: repeating-linear-gradient(120deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.1) 1px, transparent 1px, transparent 60px), repeating-linear-gradient(60deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.1) 1px, transparent 1px, transparent 60px), linear-gradient(60deg, rgba(0, 0, 0, 0.1) 25%, transparent 25%, transparent 75%, rgba(0, 0, 0, 0.1) 75%, rgba(0, 0, 0, 0.1)), linear-gradient(120deg, rgba(0, 0, 0, 0.1) 25%, transparent 25%, transparent 75%, rgba(0, 0, 0, 0.1) 75%, rgba(0, 0, 0, 0.1));
  background-size: 70px 120px;
  box-shadow: inset 0 7px 0 #3F1F00;
}
.wall.is-b {
  transform: rotateX(-90deg) rotateY(180deg);
  transform-origin: 50% 100%;
  background: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAkAAAAJCAYAAADgkQYQAAAAOUlEQVQoU2NcxsDwn4EAYCSkKIqBgQGvIpCCZYQUwVyB1SSYCTgVoSsAKSTocBRF2ExAsQ6fApBCAE6CFDGqFjHnAAAAAElFTkSuQmCC) repeat;
}
.wall.has-img {
  display: flex;
  justify-content: center;
  align-items: center;
  transform-style: preserve-3d;
}
.wall.has-img img {
  position: relative;
  pointer-events: auto;
  cursor: pointer;
  margin-right: 10%;
  margin-left: 10%;
  width: 50%;
  height: auto;
  transform: rotateZ(-180deg);
}

.shelf {
  position: absolute;
  bottom: 2%;
  left: 0;
  right: 0;
  width: 80%;
  height: 80%;
  margin: auto;
  display: flex;
  flex-flow: row wrap;
  justify-content: flex-start;
  background: #5F2F00;
  transform: translateZ(1px);
  transform-style: preserve-3d;
  box-shadow: 20px 0 40px rgba(0, 0, 0, 0.5), -20px 0 40px rgba(0, 0, 0, 0.5);
}
.shelf-side {
  position: absolute;
  top: 0;
  left: 0;
  flex: 0;
}
.shelf-side.is-t {
  width: 100%;
  height: 4vw;
  transform: rotateY(-90deg) rotateX(90deg) rotateZ(-90deg);
  transform-origin: 0% 0%;
  background: #703700;
}
.shelf-side.is-e {
  width: 4vw;
  height: 102%;
  left: auto;
  right: 0;
  transform: rotateY(90deg);
  transform-origin: 100% 0%;
  background: #422203;
  z-index: 1;
}
.shelf-side.is-w {
  width: 4vw;
  height: 102%;
  transform: rotateY(-90deg);
  transform-origin: 0% 0%;
  background: #422203;
}
.shelf-side.is-shadow {
  width: 100%;
  height: 4vw;
  top: auto;
  bottom: -2%;
  transform: rotateX(-90deg);
  transform-origin: 0% 100%;
  background: rgba(0, 0, 0, 0.3);
  box-shadow: 0 0 25px 5px rgba(0, 0, 0, 0.3);
}
.shelf-section {
  position: relative;
  height: 100%;
  width: 33.33%;
  transform-style: preserve-3d;
  display: flex;
  flex-flow: row wrap;
  justify-content: flex-start;
}
.shelf-section:after {
  content: '';
  display: block;
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 4vw;
  transform: rotateX(-90deg);
  transform-origin: 0% 100%;
  background: #A76321;
}
.shelf-section + .shelf-section:before {
  content: '';
  display: block;
  position: absolute;
  left: 0;
  top: 0;
  width: 4vw;
  height: 100%;
  transform: rotateY(-90deg);
  transform-origin: 0% 0%;
  background: #422203;
}
.shelf-board {
  position: relative;
  display: flex;
  flex-flow: row nowrap;
  justify-content: flex-start;
  width: 100%;
  max-height: 100%;
  padding-top: 1vw;
  transform: translateZ(4vw);
  transform-style: preserve-3d;
}
.shelf-board:before {
  content: '';
  display: block;
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 4vw;
  transform: rotateX(90deg);
  transform-origin: 0% 101%;
  background: #834F1D;
}
.shelf-board:after {
  content: '';
  display: block;
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 4vw;
  transform: rotateX(90deg);
  transform-origin: 0% 100%;
  background: #A76321;
}
.shelf-doors {
  position: absolute;
  display: flex;
  flex-flow: row nowrap;
  top: 0;
  left: 0;
  height: 100%;
  width: 100%;
  transform: translateZ(4vw);
  transform-style: preserve-3d;
}
.shelf-doors_item {
  position: relative;
  height: 100%;
  width: 50%;
  background: #703700;
  pointer-events: auto;
  transform-style: preserve-3d;
}
.shelf-doors_item:after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #703700;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px #4E2600, inset 0 0 0 6px #703700, inset 0 0 0 9px #4E2600, 0 0 1px rgba(0, 0, 0, 0.3);
  transform: translateZ(5px);
}

.book {
  position: relative;
  height: 100%;
  width: 1vw;
  margin: -1px 2px 0;
  cursor: pointer;
  background: #095605;
  transform-style: preserve-3d;
  transform: translateZ(-0.5vw);
  transition: all .3s;
  pointer-events: auto;
}
.book:before, .book:after {
  content: '';
  position: absolute;
  top: 0;
  left: 100%;
  width: calc(4vw - 1vw);
  height: 100%;
  transform-origin: 0% 0%;
  background: #063304;
  transform: rotateY(90deg);
}
.book:after {
  right: auto;
  left: 0;
}
.book:focus, .book:hover {
  background: #0e8608;
  transform: translateZ(1vw);
}
.book:focus:before, .book:focus:after, .book:hover:before, .book:hover:after {
  background: #094b06;
}
.book.is-opened {
  width: 1px;
  align-self: center;
  outline: none !important;
  transform: translateZ(10vw) rotateY(-180deg);
}
.book.is-opened:before, .book.is-opened:after {
  transform: rotateY(30deg);
}
.book.is-opened:after {
  transform: rotateY(160deg);
}

.pages {
  position: relative;
  left: 50%;
  width: calc(4vw - 1vw);
  height: 100%;
  pointer-events: none;
  transform-style: preserve-3d;
  transform-origin: 0% 50%;
  transform: rotateY(90deg) translateX(1px);
}
.book.is-opened .pages {
  transform: rotateY(31deg) translateX(1px);
}
.book.is-opened .pages .pages-item + .pages-item {
  transform: rotateY(129deg);
}
.pages-item {
  position: absolute;
  display: flex;
  justify-content: center;
  align-items: center;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  transform-origin: 0% 0%;
  background: #fff;
  transform: rotateY(0deg);
  user-select: none;
  transition: all .3s;
}

.sceleton {
  width: 100%;
  max-height: 100%;
  height: auto;
  align-self: flex-end;
  transform: translateZ(2vw);
}
</style>

  </head>

    <script id="rendered-js" type="module">
import Tweenmax from 'https://esm.sh/gsap@1.19.1';
import $ from 'https://esm.sh/jquery@3.5.1';

class App {

  constructor() {

    this.DOs = {
      $room: $('.js-room'),
      $doors: $('.js-door'),
      $books: $('.js-book'),
      $img: $('.js-img'),
      $imgWalls: $('.js-wall-4img') };


    this.cfg = {
      max_zoom: 20,
      min_zoom: -20,
      initialRoomZ: 0 };


    this.hasTouch = 'ontouchstart' in window ? true : false;

    this.state = {
      wWidth: window.innerWidth,
      wHeight: window.innerHeight,
      clickX: undefined,
      clickY: undefined,
      mousedown: false,
      zoom: 0 };


    this.initRotation(this.hasTouch);
    this.initZoom();
    this.initDoors();
    this.initBooks();
    this.initImg();
  }


  adjustPerspective(e) {
    let xDrag = e.originalEvent.clientX,
    yDrag = e.originalEvent.clientY,
    xStart = this.state.clickX,
    yStart = this.state.clickY,
    xDest = xDrag - xStart,
    yDest = yDrag - yStart;

    TweenMax.to(this.DOs.$room, .2, {
      rotationX: `+=${yDest / 100 * -1}`,
      rotationY: `+=${xDest / 100}` });

  }


  setZoom(zoomIn) {

    if (this.state.zoom < this.cfg.max_zoom && zoomIn) {
      this.state.zoom += 1;
    }
    if (this.state.zoom > this.cfg.min_zoom && !zoomIn) {
      this.state.zoom -= 1;
    }

    TweenMax.to(this.DOs.$room, .2, { z: this.cfg.initialRoomZ + 20 * this.state.zoom });
  }


  initZoom() {
    // init Tweenmax too get initial z value
    TweenMax.set(this.DOs.$room, { z: '+=0' });
    this.cfg.initialRoomZ = this.DOs.$room[0]._gsTransform.z;

    $(window).on('mousewheel', e => {
      this.setZoom(e.originalEvent.deltaY > 0);
    });
  }


  initRotation(isTouch) {
    if (!isTouch) {
      $(window).on('mousemove', e => {
        if (this.state.mousedown === true) {
          this.adjustPerspective(e);
        }
      });
      $(window).on('mousedown', e => {
        this.state.mousedown = true;
        this.state.clickX = e.originalEvent.clientX;
        this.state.clickY = e.originalEvent.clientY;
      });
      $(window).on('mouseup', () => {this.state.mousedown = false;});
    } else if (isTouch) {

      $(window).on('touchmove', e => {
        if (this.state.mousedown === true) {
          let _e = e.changedTouches[0];
          e.originalEvent.clientX = _e.pageX;
          e.originalEvent.clientY = _e.pageY;
          this.adjustPerspective(e);
        }
      });
      $(window).on('touchstart', e => {
        this.state.mousedown = true;
        let _e = e.changedTouches[0];
        this.state.clickX = _e.pageX - e.target.offsetLeft;
        this.state.clickY = _e.pageY - e.target.offsetTop;
      });
      $(window).on('touchend', e => {
        this.state.mousedown = false;
      });

    }

    $(window).on('resize', () => {
      this.state.wWidth = window.innerWidth;
      this.state.wHeight = window.innerHeight;
      this.state.clickX = undefined;
      this.state.clickY = undefined;
    });
  }


  initImg() {
    this.DOs.$img.on('click', () => {this.playImgAnimation();});
  }


  get roomWidth() {
    return this.DOs.$room.width();
  }


  get emptyWall() {
    return this.DOs.$imgWalls.filter((i, el) => {
      if ($(el).children().length === 0) {
        return el;
      }
    });
  }


  changeImgWall() {
    let $newWall = this.emptyWall,
    $detachedImg = this.DOs.$img.detach();
    $newWall.append($detachedImg);
  }


  playImgAnimation() {
    TweenMax.to(this.DOs.$img, .3, {
      z: this.roomWidth - 1,
      rotationY: 180,
      clearProps: "all",
      onComplete: () => {
        this.changeImgWall();
      } });

  }


  moveDoor(e) {

    if ($(e.target).index() === 2) {

      TweenMax.to($(e.target), 1, {
        x: e.target._gsTransform.xPercent === 0 ? '-100%' : '0%',
        z: e.target._gsTransform.xPercent === 0 ? '1%' : '0%' });


    } else {

      TweenMax.to($(e.target), 1, {
        x: e.target._gsTransform.xPercent === 0 ? '100%' : '0%',
        z: e.target._gsTransform.xPercent === 0 ? '1%' : '0%' });


    }
  }


  initDoors() {
    this.DOs.$doors.on('click', e => {this.moveDoor(e);});
    TweenMax.set(this.DOs.$doors, { x: '0%' });
  }


  closeBook(el) {
    $(el).removeClass('is-opened');
  }


  openBook(el) {
    $(el).addClass('is-opened');
  }


  initBooks() {
    this.DOs.$books.on('click', e => {
      e.stopPropagation();
      if ($(e.target).hasClass('is-opened')) {
        this.closeBook(e.target);
      } else {
        this.DOs.$books.removeClass('is-opened');
        this.openBook(e.target);
      }
    });
  }}



let app = new App();
