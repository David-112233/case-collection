  <title>Brutalism with some dots and border effects (CSS vars included)</title>

<style>
/**
 * Dot pattern
 */
.panel::before,
.input-container::before {
  content: "";
  position: absolute;
  top: var(--dot-offset, 1em);
  left: var(--dot-offset, 1em);
  right: var(--dot-offset-neg, -1em);
  bottom: var(--dot-offset-neg, -1em);
  background: transparent radial-gradient(circle, var(--dot-color, rgba(0, 0, 0, 0.75)), transparent 1px);
  background-size: 4px 4px;
}

/**
 * Panels
 */
.panel {
  position: relative;
  width: 400px;
  max-width: 100%;
  margin: 2em auto 3em;
}
.panel div {
  position: relative;
  z-index: 1;
}
.panel-header {
  padding: 16px;
  border: 1px solid #242a49;
  background-color: #eee5ff;
  font-family: "messina", sans-serif;
  font-weight: bold;
}
.panel-header h1 {
  color: var(--brandcolor);
  margin: 0;
  font-size: 1em;
}
.panel-content {
  padding: 16px;
  background-color: #ffffff;
  border: 1px solid #242a49;
  border-top-color: #242a49;
  border-top-style: solid;
  border-top-width: 1px;
  border-top: 0;
}

/**
 * Full section
 */
.full {
  padding: 16px;
  background: var(--brandcolor);
  text-align: center;
  color: white;
  font-weight: bold;
}
.full form {
  display: inline-flex;
  align-items: center;
}
.full label {
  margin-right: 8px;
}
.full input {
  position: relative;
  border: 0;
  padding: 1em;
}
.full .input-container {
  position: relative;
  margin-right: 1em;
  --dot-color: rgba(255,255,255,1);
  --dot-offset: .5em;
  --dot-offset-neg: -.5em;
}

button {
  --transition: all .275s;
  --border-color: white;
  --background: var(--brandcolor);
  position: relative;
  padding: 0;
  border: 0;
  background: var(--background);
  transition: var(--transition);
}
button span {
  position: relative;
  display: block;
  padding: 14px;
  border: 1px solid var(--border-color);
  background: var(--background);
  color: var(--border-color);
  font-weight: bold;
  z-index: 1;
  transition: var(--transition);
}
button::before, button::after {
  content: "";
  position: absolute;
  background: var(--background);
  border: 1px solid var(--border-color);
  transition: var(--transition);
}
button::after {
  top: 2px;
  left: 2px;
  right: -3px;
  bottom: -3px;
}
button::before {
  top: 5px;
  left: 5px;
  right: -6px;
  bottom: -6px;
}
button:hover, button:focus {
  transform: translateY(-2px) translateX(-2px);
}
button:hover::before, button:focus::before {
  transform: translateY(2px) translateX(2px);
}
button:hover::after, button:focus::after {
  transform: translateY(1px) translateX(1px);
}
button.reversed {
  --background: white;
  --border-color: var(--brandcolor);
}

* {
  box-sizing: border-box;
}

body, html {
  --brandcolor: #6600ff;
  background: #f3f2f1;
  line-height: 1.55;
}
</style>
