  <title>Penrose (Escher) triangle in CSS</title>

    <link rel="canonical" href="https://codepen.io/FWeinb/pen/kdxZyG">
  
  
  
  
<style>
html {
  background: #ffd3b2;
}

.penrose {
  position: relative;
  width: 100px;
  height: 140px;
  margin: 150px auto;
  border-top: 50px solid red;
  border-left: 50px solid red;
  transform: skew(-30deg) skewY(40deg);
}
.penrose:before {
  position: absolute;
  content: "";
  top: -116px;
  right: -70px;
  width: 90px;
  height: 150px;
  border-top: 50px solid #471C09;
  border-left: 50px solid #471C09;
  border-right: 50px solid transparent;
  transform: skewY(-40deg) skew(30deg) rotate(-90deg) skewY(30deg);
  z-index: 3;
}
.penrose:after {
  position: absolute;
  content: "";
  bottom: 75px;
  right: 2px;
  width: 80px;
  height: 150px;
  border-top: 50px solid #FFA500;
  border-left: 50px solid #FFA500;
  transform: skewY(-40deg) skew(30deg) rotate(148.5deg) skewY(31deg);
  z-index: 2;
}
</style>

  <script src="https://public.codepenassets.com/js/prefixfree-1.0.7.min.js"></script>

  
</head>

<body translate="no">
  <div class="penrose"></div>
  
  
  
</body>
