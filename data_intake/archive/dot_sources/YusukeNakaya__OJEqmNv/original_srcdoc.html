body {
  background: #000;
  height: 100vh;
  overflow: hidden;
  perspective: 9999px;
}

* {
  transform-style: preserve-3d;
}

.camera {
  position: absolute;
  width: 100%;
  height: 100vh;
  backface-visibility: hidden;
  transform-style: preserve-3d;
}
.camera.z {
  transform: rotateZ(-45deg);
}
.camera.y {
  transform: rotateX(45deg);
}

.building {
  position: relative;
  width: 100%;
  height: 100%;
  background: #444;
  backface-visibility: hidden;
  transform-style: preserve-3d;
}
.building::before {
  content: "";
  position: absolute;
  height: 100%;
  background: #222;
  transform-origin: 100% 50%;
  transform: translateX(-100%) rotateY(-90deg);
  backface-visibility: hidden;
}
.building::after {
  content: "";
  position: absolute;
  bottom: 0;
  width: 100%;
  background: #333;
  transform-origin: 50% 0;
  transform: translateY(100%) rotateX(-90deg);
  backface-visibility: hidden;
}

.city {

  height: 100vh;
  transform-style: preserve-3d;
  backface-visibility: hidden;
}
