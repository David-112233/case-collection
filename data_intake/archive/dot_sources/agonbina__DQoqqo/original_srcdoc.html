<style>
@charset "UTF-8";
*, *:after, *:before {
  -moz-box-sizing: border-box;
  -webkit-box-sizing: border-box;
  box-sizing: border-box;
}

body {
  position: relative;
  font-family: source-sans-pro, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.phone {
  position: relative;
  margin: 0 auto;
  min-width: 420px;
  width: 420px;
  background: whitesmoke;
  -moz-box-shadow: 2px 0 55px #666666;
  -webkit-box-shadow: 2px 0 55px #666666;
  box-shadow: 2px 0 55px #666666;
}
.phone header {
  position: relative;
  background: #3498db;
  height: 40px;
  text-align: center;
}
.phone header h1 {
  position: relative;
  top: 20%;
  color: white;
  font-weight: bold;
  font-size: 24px;
  text-transform: uppercase;
}
.phone header h1:before {
  position: relative;
  right: 30%;
  content: "";
  font-family: FontAwesome;
}
.phone header h1:after {
  position: relative;
  left: 30%;
  content: "";
  font-family: FontAwesome;
}

main {
  position: relative;
  height: 460px;
  background: whitesmoke;
  overflow: hidden;
}
main div {
  height: 20%;
}
main .message {
  padding: 5%;
  border-bottom: #d9dcde 2px solid;
}
main .message img {
  height: 100%;
  -moz-border-radius: 50%;
  -webkit-border-radius: 50%;
  border-radius: 50%;
}
main .message .details {
  width: 85%;
  float: right;
  font-weight: bold;
  line-height: 1.2;
}
main .message .details h1 {
  font-size: 1.5em;
}
main .message .details h2 {
  font-size: 1.2em;
  color: #292D39;
}
main .options {
  position: absolute;
  margin-left: -100%;
  width: 100%;
  -webkit-animation: slidein 1s 1s ease-in-out forwards;
}
main .options span {
  position: relative;
  float: left;
  width: 30%;
  height: 100%;
  color: white;
  text-align: center;
}
main .options span:after {
  font-size: 2em;
  position: relative;
  top: 30%;
}
main .options span:nth-of-type(1) {
  background: #43CCB5;
  -webkit-animation: click 0.2s 3s;
}
main .options span:nth-of-type(1):after {
  content: "";
  font-family: FontAwesome;
}
main .options span:nth-of-type(2) {
  background: #EA324D;
}
main .options span:nth-of-type(2):after {
  content: "";
  font-family: FontAwesome;
}
main .options span:nth-of-type(3) {
  background: #3B3F4C;
}
main .options span:nth-of-type(3):after {
  content: "";
  font-family: FontAwesome;
  font-size: 1em;
  top: 40%;
}
main .options span:nth-of-type(4) {
  width: 10%;
  background: #292D39;
}
main .options span:nth-of-type(4):after {
  content: "";
  font-family: FontAwesome;
}
main section {
  position: absolute;
  width: 100%;
  height: 100%;
  bottom: -100%;
  padding: 5%;
  color: white;
  font-weight: bold;
  opacity: 0;
}
main .reply-box {
  background: #3B3F4C;
  -webkit-animation: slideup 1s 3.3s ease-in-out forwards;
}
main .reply-box .box {
  margin-top: 5%;
  padding: 2.5%;
}
main .reply-box .text {
  height: 40%;
  border: 1px solid whitesmoke;
}
main .reply-box .send-button {
  height: 1.66667em;
  background: #EA324D;
  text-align: center;
  font-size: 2em;
  -webkit-animation: click-send 0.2s 5.3s ease-in-out;
}
main .confirm-overlay {
  background: rgba(67, 172, 106, 0.95);
  text-align: center;
  font-size: 3em;
  -webkit-animation: slideup 0.5s 5.6s ease-in-out forwards;
}
main .confirm-overlay p {
  position: relative;
  top: 35%;
}
main .confirm-overlay p:before {
  content: "";
  font-family: FontAwesome;
  margin-right: 10px;
}

@-webkit-keyframes slidein {
  100% {
    margin-left: 0%;
  }
}
@-webkit-keyframes slideup {
  50%,
  70% {
    opacity: .7;
    bottom: 5%;
  }
  100% {
    opacity: 1;
    bottom: 0;
  }
}
@-webkit-keyframes click {
  100% {
    background: #248575;
  }
}
@-webkit-keyframes click-send {
  100% {
    background: #a51127;
  }
}
@-webkit-keyframes pulse {
  100% {
    opacity: 1;
    font-size: 4em;
  }
}
</style>
