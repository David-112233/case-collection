.lens__rotate {

  height: 100%;
  background: linear-gradient(#000, white);
  transform-origin: center center;

  animation-duration: 20s;
  animation-iteration-count: infinite;
  animation-timing-function: linear;
  opacity: 0.05;

.lens__reflection {

  height: 9.4rem;

}

  width: 8rem;
  height: 8rem;
  opacity: 0.5;

}
.lens__reflection .reflection:nth-child(odd) {

}
.lens__reflection .reflection:nth-child(even) {
  transform: translate(-10%, -20%);
}

.lens__reflection2 {

  height: 14.4rem;
  overflow: hidden;
}
.lens__reflection2 .reflection {
  width: 14rem;
  height: 14rem;

}

  transform: translate(-90%, -80%);
}
.lens__reflection2 .reflection:nth-child(even) {
  transform: translate(-10%, -20%);
}

.lens__ray-wrapper {
  overflow: hidden;
  opacity: 0.07;
  width: 12rem;
  height: 12rem;
}
.lens__ray-wrapper:nth-child(odd) {
  width: 6.4rem;
  height: 6.4rem;
}

.lens__wide-ray2 {
  overflow: hidden;
  width: 15rem;
  height: 15rem;
  border-radius: 0;
  transform-origin: bottom right;
}
.lens__wide-ray2:nth-child(odd) {
  transform: translate(-100%, -100%) rotate(10deg) skew(50deg);
}
.lens__wide-ray2:nth-child(even) {
  transform: translate(-100%, -100%) rotate(55deg) skew(70deg);
}
.lens__wide-ray2 .ray1, .lens__wide-ray2 .ray2 {
  position: absolute;
  background: radial-gradient(transparent 35%, white 35%);
  width: 100%;
  height: 100%;
  transform: translate(50%, 50%) skew(-50deg);
}
.lens__wide-ray2 .ray2 {
  transform: translate(50%, 50%) skew(-70deg);
}

.lens__narrow-ray2 {

  width: 15rem;
  height: 15rem;
  border-radius: 0;
  transform-origin: bottom right;
