<style>
* {
  margin:0; padding:0;
  box-sizing:border-box;
}

:root {
    --bg: rgb(227, 247, 238);
    --grass: #a0c23a;
    --roadbg: linear-gradient(to top, transparent 50%, #333 50%) repeat center / 1px 25px, linear-gradient(to top, #ffe09f, #ffe09f) no-repeat center / 4px 100%, #333;
    --sidewalkbg: linear-gradient(to top, transparent 38px, #949494 38px) repeat-y center / 100% 39px, #ffe09f;
    --wood: #502916;
    --tower: #6f06f5;
}


html, body {
  background:var(--bg);
  overflow:hidden;
  height:100%;
}
#main-wrapper {
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100%;
  background: linear-gradient(to bottom, #ffecd2 0%, #fcb69f 100%);
}
#scene {
  backface-visibility: hidden;
  transform:rotateX(70deg) rotateZ(40deg);
  transform-style: preserve-3d;
}
.plan {
  position:absolute;
  top:0; left:0;
}
.item {
  --size:30px;
  --larg: 100px;
  --long: 40px;
  --duration:.3s;
  --offset:0px;
  position: relative;
  display:block;
  width: var(--larg);
  height: var(--long);
  background: var(--stairtop);
  transform: translateZ(calc(var(--size) + var(--offset)));
  transform-style: preserve-3d;
}
.item:after,
.item:before {
  content: '';
  position: absolute;
  top:0; left:0;
}
.item:after {
  height: var(--size);
  width: var(--larg);
  background-color:inherit;
  filter: brightness(.8);
  transform: rotateX(-90deg) translateY(var(--size)) translateZ(calc(-1 * var(--size) + var(--long)));
  transform-origin: 100% 100%;
  background:#212121;
}
.item:before {
  height: var(--long);
  width: var(--size);
  background-color:inherit;
  filter: brightness(.9);
  transform: rotateY(90deg) translateX(var(--size)) translateZ(calc(-1 * var(--size) + var(--larg)));
  transform-origin: 100% 0;
}

.water:after {
  transform: rotateX(-90deg) translateY(var(--size)) translateZ(calc(-1 * var(--size)));
}
.road .item {
  float:left;
}

.tower .item {
  box-shadow: inset 0px 0px 0px 10px white, inset 15px 17px 0px 10px rgba(0, 0, 0, 0.45),  inset 0px 85px 0px 0px rgba(0, 0, 0, 0.3);
}
.tower.main .item-wall:before,
.tower.main .item-wall:after {
  box-shadow:inset 0px 0px 0px 5px rgba(0, 0, 0, 0.33);
}

.tower .window {
  position: absolute;
  top: 0;
  right: 0;
  background:none;
}
.tower .window:before {
  --colorwindow:#FFF;
  background: none;
  width: 15px;
  height: 15px;
  transform: rotateY(90deg) translateX(5px) translateZ(74px);
  box-shadow: 
    25px 60px 0px 0 var(--colorwindow), 25px 35px 0px 0 var(--colorwindow), 25px 10px 0px 0 var(--colorwindow), 
    50px 60px 0px 0 var(--colorwindow), 50px 35px 0px 0 var(--colorwindow), 50px 10px 0px 0 var(--colorwindow), 
    75px 60px 0px 0 var(--colorwindow), 75px 35px 0px 0 var(--colorwindow), 75px 10px 0px 0 var(--colorwindow), 
    100px 60px 0px 0 var(--colorwindow), 100px 35px 0px 0 var(--colorwindow), 100px 10px 0px 0 var(--colorwindow), 
    125px 60px 0px 0 var(--colorwindow), 125px 35px 0px 0 var(--colorwindow), 125px 10px 0px 0 var(--colorwindow),

    148px 35px 0px 0 var(--colorwindow), 156px 35px 0px 0 var(--colorwindow);
}
.tower .window:after {
  --colorwindow:#FFF;
  background: none;
  width: 15px;
  height: 15px;
  transform:rotateY(90deg) rotateX(-90deg) translateX(5px) translateZ(75px) translateY(-56px);
  box-shadow: 
    25px 60px 0px 0 var(--colorwindow), 25px 35px 0px 0 var(--colorwindow), 25px 10px 0px 0 var(--colorwindow), 
    50px 60px 0px 0 var(--colorwindow), 50px 35px 0px 0 var(--colorwindow), 50px 10px 0px 0 var(--colorwindow), 
    75px 60px 0px 0 var(--colorwindow), 75px 35px 0px 0 var(--colorwindow), 75px 10px 0px 0 var(--colorwindow), 
    100px 60px 0px 0 var(--colorwindow), 100px 35px 0px 0 var(--colorwindow), 100px 10px 0px 0 var(--colorwindow), 
    125px 60px 0px 0 var(--colorwindow), 125px 35px 0px 0 var(--colorwindow), 125px 10px 0px 0 var(--colorwindow);
}

.roundtree {
  transform: rotateX(-80deg) translateY(-104px);
}
.roundtree-item {
  background:radial-gradient(circle at 54% 0%, #93ca30, #4e7023);
  border-radius:50%;
}

.fence .item:before {
  background:radial-gradient(ellipse at 16px 10px, white 12px, transparent 12px) repeat-y center / 100% 16px, linear-gradient(0deg, white, white) no-repeat center 11px / 3px 100%;
  transform:rotateY(90deg) translateX(var(--size)) translateZ(calc(-1 * var(--size)))
}
.fence .item:after {
  background:radial-gradient(ellipse at 10px 16px, white 7px, transparent 7px) repeat-x center / 16px 100%, linear-gradient(0deg, white, white) no-repeat center 11px / 100% 3px;
}

.building:before {
  background-color: white;
  background-image: 
    linear-gradient(90deg, #6f06f5 10px, transparent 10px, transparent calc(100% - 5px), #6f06f5 calc(100% - 5px)),
    linear-gradient(0deg, 
      #6f06f5 10px, transparent 10px,
      transparent calc(25% - 5px), #6f06f5 calc(25% - 5px),
      #6f06f5 calc(25% + 5px), transparent calc(25% + 5px),
      transparent calc(50% - 5px), #6f06f5 calc(50% - 5px),
      #6f06f5 calc(50% + 5px), transparent calc(50% + 5px),
      transparent calc(75% - 5px), #6f06f5 calc(75% - 5px),
      #6f06f5 calc(75% + 5px), transparent calc(75% + 5px),
      transparent calc(100% - 10px), #6f06f5 calc(100% - 10px)
    );
}
.triangletree .item {
  background: none !important;
  transform: translateZ(90px);
}
.triangletree .item:before {
  height: 0;
  width: 0;
  border-top: calc(var(--long) / 2) solid transparent;
  border-right: calc(var(--long) + 13px) solid #4e7023;
  border-left: none;
  border-bottom: calc(var(--long) / 2) solid transparent;
  /* box-sizing: border-box; */
  background: none;
  transform: rotateY(70deg) translateX(33px) translateZ(-30px);
  transform-origin: 100% 100%;
}
.triangletree .item:after {
  height: 0;
  width: 0;
  border-top: none;
  border-right: calc(var(--long) / 2) solid transparent;
  border-left: calc(var(--long) / 2) solid transparent;
  border-bottom: calc(var(--long) + 13px) solid #65bd4f;
  background: none;
  transform: rotateX(-68deg) translateX(17px) translateY(32px);
  transform-origin: 100% 100%;
}

.item.water {
    --size: 20px;
    --long: 150px;
    --larg: 150px;
    --offset: 8px;
    background: rgba(60, 200, 250, 0.8)!important;
}
</style>
