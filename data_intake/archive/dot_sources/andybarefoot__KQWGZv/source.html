  <title>CSS Grid Ribbon layout</title>

    <link rel="canonical" href="https://codepen.io/andybarefoot/pen/KQWGZv">
  <link href="https://fonts.googleapis.com/css?family=Bungee|Bungee+Inline" rel="stylesheet">
  <link rel="stylesheet" href="https://public.codepenassets.com/css/reset-2.0.min.css">

  
  
<style>
body {
  background-color: #33658A;
  color: #1A2830;
  font-family: 'Bungee', cursive;
}

h1{
  margin: auto;
  margin-top: 100px;
  display: grid;
  width: 300px;
  grid-auto-rows: 60px;
  font-size: 3em;
}

h1>span{
  background-color: #C60F0F;
  line-height: 60px;
  text-align: center;
  transform: skewY(11deg);
}

h1>span:nth-child(2n){
  background-color: #FE4E00;
  transform: skewY(-11deg);
  z-index: 1;
}
</style>

  </head>

<body translate="no">
  <h1 data-splitting>CSS Grid Ribbon Layout</h1>
  <script src='https://unpkg.com/splitting/dist/splitting.min.js'></script>
    <script id="rendered-js" >
const results = Splitting();
results[0].el.insertBefore(document.createElement("span"), results[0].el.children[0]);
results[0].el.appendChild(document.createElement("span"));
//# sourceURL=pen.js
  </script>

  
</body>
