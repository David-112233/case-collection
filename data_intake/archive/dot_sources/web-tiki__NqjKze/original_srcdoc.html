  <title>CSS Walking cycle</title>

    <link rel="canonical" href="https://codepen.io/web-tiki/pen/NqjKze">
  
  
  
  
<style>
* {
  margin: 0;
  padding: 0;
}

body {
  background: #123752;
  height: 100%;
}

#robot {
  position: relative;
  height: 78vh;
  width: 20vh;
  margin: 0 auto;
  animation: robot 1.8s infinite ease-in-out;
  z-index: 2;
}
#robot div {
  position: absolute;
  transform-origin: 50% 0;
}
#robot .r div {
  background: #29516D;
}
#robot .l div {
  background: #326384;
}
#robot .leg.r, #robot .arm.l {
  animation: trans 1.8s 0.9s infinite ease-in-out;
}
#robot .leg.l, #robot .arm.r {
  animation: trans 1.8s infinite ease-in-out;
}
#robot .head {
  top: 10vh;
  left: 5vh;
  width: 9vh;
  height: 10vh;
  margin: 0 auto;
  transform-origin: 20% 150%;
  animation: head 1.8s infinite ease-in-out;
  background: #326384;
}
#robot .arm {
  left: 5vh;
  top: 20.5vh;
  width: 8vh;
  height: 5.5vh;
}
#robot .arm div {
  top: 100%;
  left: 0;
  width: 100%;
  height: 10vh;
  box-sizing: border-box;
  transform: rotate(5deg);
  animation: arms 1.8s infinite ease-in-out;
}
#robot .arm.l div {
  animation-delay: -0.9s;
}
#robot .leg {
  top: 45vh;
  left: 5vh;
  width: 8vh;
  height: 4vh;
}
#robot .leg div {
  width: 100%;
  height: 15vh;
  top: 100%;
  animation: legs1 1.8s infinite ease-in-out;
}
#robot .leg div div {
  animation: legs2 1.8s infinite ease-in-out;
}
#robot .leg.r div {
  animation-delay: -0.9s;
}

.shadow {
  position: relative;
  width: 22vh;
  height: 3vh;
  margin: 0 auto;
  border-radius: 50%;
  background: #05314f;
  animation: shadow 1.8s infinite ease-in-out;
  z-index: 1;
}

/**************************************************************************************/
@keyframes robot {
  0%, 50%, 100% {
    transform: translateY(0vh) rotate(0.2deg);
  }
  15%, 65% {
    transform: translateY(0.15vh) rotate(-0.2deg);
  }
}
@keyframes trans {
  0%, 100% {
    transform: translateX(0vh);
  }
  50% {
    transform: translateX(1.2vh);
  }
}
@keyframes head {
  0%, 100% {
    transform: rotate(-1deg);
  }
  25%, 75% {
    transform: rotate(2deg);
  }
  50% {
    transform: rotate(0deg);
  }
}
@keyframes arms {
  0%, 100% {
    transform: rotate(2deg);
  }
  50% {
    transform: rotate(-10deg);
  }
}
@keyframes legs1 {
  0%, 100% {
    transform: rotate(10deg);
  }
  45% {
    transform: rotate(-15deg);
  }
}
@keyframes legs2 {
  0%, 100% {
    transform: rotate(2deg);
  }
  33% {
    transform: rotate(20deg);
  }
  50% {
    transform: rotate(0deg);
  }
}
@keyframes shadow {
  0%, 50%, 100% {
    transform: scale(1.02);
  }
  25%, 75% {
    transform: scale(0.98);
  }
}
a {
  color: #326384;
  font-family: sans-serif;
  text-transform: uppercase;
  display: block;
  text-align: center;
  margin: 5%;
  font-weight: bold;
}
</style>

  <script>
  window.console = window.console || function(t) {};
</script>

  
  
</head>

<body translate="no">
  <div id="robot">
  <div class="head"></div>
  <div class="arm l"><div><div></div></div></div>
  <div class="leg l"><div><div></div></div></div>
  <div class="leg r"><div><div></div></div></div>
  <div class="arm r"><div><div></div></div></div>
</div>
<div class="shadow"></div>
<a href="https://codepen.io/web-tiki/pen/gpWLbW" target="_blank">See me Running</a>
