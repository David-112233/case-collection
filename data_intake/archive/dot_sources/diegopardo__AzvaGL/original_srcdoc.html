  <title>CSS3 3D screen mock-up</title>

    <link rel="canonical" href="https://codepen.io/diegopardo/pen/AzvaGL">
  
  <link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">

  
  
<style>
/*
Experimental 3d screen mock-up for apps or responsive sites
Tested only in Chrome.
*/

*, *:after, *:before {
  box-sizing: border-box; 
}

html {
  background: #111;
}

.desk{
  perspective: 1000;
  margin: 100px auto;
}

/*this is it!*/
.device {
	position: relative;
	height: 480px;
	width: 320px;
  padding: 10px;
	border-radius: 15px;
	margin: 0 auto;
  background-color: #0a0a0a;
	box-shadow:
    -3px 3px 0 -1px #505050,
    -6px 7px 0 -2px #313131,
    -50px 80px 90px -12px rgba(0,0,0,0.6),
    -50px 80px 200px -6px rgba(0,0,0,0.3);	
  transform-style: preserve-3d;
  transform:
    translateX(0px)
    translateY(-105px)
    translateZ(-13px)
    rotateX(45deg)
    rotateY(-2deg)
    rotateZ(-38deg);
  transform-origin-x: 50%;
  transform-origin-y: 50%;
  transition: all 0.3s ease-in-out;
}

.device:hover{
  transform:
    translateX(0px)
    translateY(50px)
    translateZ(-13px)
    rotateX(0deg)
    rotateY(0deg)
    rotateZ(0deg);
}

.device:before, .device:after{
  position: absolute;
  content:'';
  border-radius: inherit;
  top:0;
  left:0;
}
/*
this is the texture
*/
.device:before{
  background: url(http://subtlepatterns.subtlepatterns.netdna-cdn.com/patterns/retina_wood_@2X.png);
	height: 800px;
	width: 800px;
  
  transform:
    translateX(-250px)
    translateY(-150px)
    translateZ(-80px);
}

/*
This should be used to add the reflection gradient.
*/
.device:after{
  background-image:
    linear-gradient(245deg, rgba(255,255,255,0.05),
    rgba(255,255,255,0.25) 35%, transparent 35%);
  background-size: 100%;
	height: 100%;
	width: 100%;
  border: 5px solid rgba(0,0,0,0.5);
  overflow:hidden;
  transform:
    translateX(0px)
    translateY(0px)
    translateZ(1px);
}

.screen{
  width:100%;
  height:100%;
  border-radius: 10px;
  overflow:hidden;
}
</style>

  <script>
  window.console = window.console || function(t) {};

  <script src="https://public.codepenassets.com/js/prefixfree-1.0.7.min.js"></script>

  
</head>

<body translate="no">
  <div class="desk">
  <div class="device">
    <div class="screen">
      <img src="http://placekitten.com/g/320/480" alt="">
    </div>
  </div>
</div>
