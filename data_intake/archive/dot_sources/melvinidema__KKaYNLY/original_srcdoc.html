<style>
body, html { height: 100%; }
body { margin: 0; display: grid; place-items: center; background: black;}

.room {
  --door-tile: 4;
  --wall-width: 15px;
  --wall-height: 175px;
  --block-size: 55px;
  
  --room-horizontal-rows: 6;
  --room-vertical-rows: 8;
  
  position: relative;
}

.door {
  position: relative;
  background: black;
  overflow: hidden;
  cursor: pointer;
}

.room .y-wall .door {
  top: calc(var(--door-tile) * var(--block-size));
  height: var(--block-size);
  width: 75%;
}

.room .y-wall .door:before {
  top: 25px;
  left: 78px;
  width: var(--block-size); height: var(--block-size);
  transform: skewY(-45deg);
}

.room .x-wall .door:before {
  bottom: 0;
  left: 28px;
  width: var(--block-size); height: var(--block-size);
  transform: skewX(-45deg);
}

.room .x-wall .door {
  left: calc(var(--tile) * var(--block-size));
  height: 75%;
  width: var(--block-size);
}

.door:hover:before {
  outline: 3px dashed white;
  outline-offset: -3px;
}

.door:before {
  content: '';
  position: absolute;
  background: #8F8B5D;
  outline: 1px solid #858255;
  outline-offset: -1px;
}

.room .y-wall {
  display: flex;
  justify-content: flex-end;
  
  position: absolute;
  right: 100%;
  
  height: 100%;
  width: var(--wall-height);
  background: #878892;
  
  transform: skewY(45deg) translateY(calc(var(--wall-height) / 2 * -1));
}

.room .y-wall:before {
  content: "";
  position: absolute;
  height: var(--wall-width);
  width: calc(100% + var(--wall-width));
  background: #ACB1C1;
  top: 100%;
  right: calc(var(--wall-width) / 2 * -1);
  transform: skewX(-45deg);
}

.room .y-wall:after {
  content: "";
  position: absolute;
  height: calc(100% + var(--wall-width));
  width: var(--wall-width);
  background: #66676F;
  right: 100%;
  bottom: calc(var(--wall-width) / 2 * -1);
  transform: skewY(-45deg);
}


.room .x-wall {
  display: flex;
  align-items: flex-end;
  
  position: absolute;
  height: var(--wall-height);
  bottom: 100%;
  width: 100%;
  background: #ACB1C1;
  transform: skewX(45deg) translateX(calc(var(--wall-height) / 2 * -1));
}

.room .x-wall:before {
  content: "";
  position: absolute;
  height: calc(100% + var(--wall-width));
  width: var(--wall-width);
  background: #878892;
  left: 100%;
  top: calc(var(--wall-width) / 2 * -1);
  transform: skewY(-45deg);
}

.room .x-wall:after {
  content: "";
  position: absolute;
  height: var(--wall-width);
  width: calc(100% + var(--wall-width));
  background: #66676F;
  bottom: 100%;
  left: calc(var(--wall-width) / 2 * -1);
  transform: skewX(-45deg);
}

.room .floor {
    display: grid;
    width: calc(var(--block-size) * var(--room-horizontal-rows));
    height: calc(var(--block-size) * var(--room-vertical-rows));

    grid-template-columns: repeat(auto-fill, var(--block-size));
    grid-template-rows: repeat(auto-fill, var(--block-size));
}

.isometric {
    transform: translateZ(3em) rotateX(60deg) rotateZ(45deg);
    transform-style: preserve-3d;
}

.block {
    --side-size: 15px;

    position: relative;
    background: #8F8B5D;
    outline: 1px solid #858255;
    outline-offset: -1px;

}

.block:hover {
    outline: 3px dashed white;
    outline-offset: -3px;
    cursor: pointer;
}

.block:after {
    content: "";
    position: absolute;
    top: 100%;
    width: 100%; height: var(--side-size);
    background: #6D6C47;
    transform: skewX(45deg) translateX(calc(var(--side-size) / 2));
}

.block:before {
    content: "";
    position: absolute;
    left: 100%;
    width: var(--side-size); height: 100%;
    background: #6D6C47;
    transform: skewY(45deg) translateY(calc(var(--side-size) / 2));
}

/** Avatar */
.avatar {
  position: absolute;
  transform: translate(-100%, -100%);
  width: 40px; height: 90px;
  z-index: 1;
}

.avatar::before {
  content: "";
  position: absolute;
  bottom: 0; left: calc(50% + 5px);
  transform: translateX(-50%);
  border-radius: 50%;
  background: rgba(0, 0, 0, .25);
  width: 100%;
  height: 20px;
}

.avatar img {
  position: absolute;
  transform: translate(-50%, -50%);
  top: calc(50% - 10px); left: 50%;
}
</style>

    <script id="rendered-js" >
/** Determine Avatar Position */
const tiles = document.querySelectorAll(".room .block");
const avatar = document.querySelector(".avatar");
const door = document.querySelector(".room .door");

avatarToPos({
  avatar: avatar,
  x: door.getBoundingClientRect().left - 30,
  y: door.getBoundingClientRect().top + 70 });


function avatarToPos({ avatar, x, y }) {
  avatar.style.top = y + 30 + "px";
  avatar.style.left = x + 55 + "px";
}

tiles.forEach(tile => {
  tile.addEventListener("click", e => {
    const tilePos = e.target.getBoundingClientRect();
    avatarToPos({
      avatar: avatar,
      x: tilePos.left,
      y: tilePos.top });

  });
});
