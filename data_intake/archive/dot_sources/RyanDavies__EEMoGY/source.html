    <script id="rendered-js" >
// Each building has a color scheme, consisting of a primary, secondary, and a tertiary value.
var buildings = {
  'dance': {
    'colors': {
      'primary': '#d97700',
      'secondary': '#2b2e45',
      'tertiary': '#6c492e' } },


  'film': {
    'colors': {
      'primary': '#ca3414',
      'secondary': '#282049',
      'tertiary': '#642835' } } };



var building, walls, wallSecondary, wallTertiary, roof;
var map = $('#map');


$('a[data-toggle="tab"]').on('click', function (e) {
  e.preventDefault();

  // To do: toggle this class if any tabs are open.
  map.toggleClass('is-active');
});

$('a[data-toggle="tab"]').on('mouseenter focusin', function () {
  if (!map.hasClass('is-active')) {
    building = $(this).attr('aria-controls');
    roof = '.' + building + ' .roof';
    walls = '.' + building + ' .wall';
    wallSecondary = '.' + building + ' .wall-secondary';
    wallTertiary = '.' + building + ' .wall-tertiary';
    roof = '.' + building + ' .roof';

    TweenMax.
    to([walls, roof], 0.75, {
      opacity: 1,
      y: 0,
      ease: Bounce.easeInOut });


    TweenMax.to([roof], 0.75, {
      fill: buildings[building]['colors']['primary'] });

    TweenMax.to([wallSecondary], 0.75, {
      fill: buildings[building]['colors']['secondary'] });

    TweenMax.to([wallTertiary], 0.5, {
      fill: buildings[building]['colors']['tertiary'] });

  }
});

$('a[data-toggle="tab"]').on('mouseleave focusout', function () {
  if (!map.hasClass('is-active')) {
    TweenMax.to('.building .wall, .building .roof', 0.75, {
      opacity: 0,
      y: 100,
      ease: Bounce.easeInOut });

  }
});

// Make Bootstrap tabs toggle-able...
$('#mapTabs a').click(function (e) {
  var tab = $(this);
  if (tab.parent('li').hasClass('active')) {
    window.setTimeout(function () {
      $('.tab-pane').removeClass('active');
      tab.parent('li').removeClass('active');
      tab.attr('aria-expanded', 'false');
    }, 1);
  }
});

  </script>
