  <title>3D Jelly Fish | Pure CSS</title>

<style>
:root {
  --dark: 0;
  --base-size: 20;
  --bg: #005b72;
  --green: #d6ff7f;
  --red: #f40076;
  --yellow: #efef00;
  --blue: hsla(220, 80%, 50%, 0.3);
  --jelly-blue: linear-gradient(
      to right,
      hsla(220, 80%, 100%, 1) 0%,
      hsla(220, 80%, 80%, 1) 10%,
      hsla(220, 80%, 50%, 1) 25%,
      hsla(220, 80%, 30%, 0)
    )
    100%;
  --anim-speed: 4;
  --anim-delay: 0;
}

.cuboid {
  width: 100%;
  height: 100%;
  position: relative;
}
.cuboid__side:nth-of-type(1) {
  height: calc(var(--thickness) * 1vmin);
  width: 100%;
  position: absolute;
  top: 0;
  transform: translate(0, -50%) rotateX(90deg);
}
.cuboid__side:nth-of-type(2) {
  height: 100%;
  width: calc(var(--thickness) * 1vmin);
  position: absolute;
  top: 50%;
  right: 0;
  transform: translate(50%, -50%) rotateY(90deg);
}
.cuboid__side:nth-of-type(3) {
  width: 100%;
  height: calc(var(--thickness) * 1vmin);
  position: absolute;
  bottom: 0;
  transform: translate(0, 50%) rotateX(90deg);
}
.cuboid__side:nth-of-type(4) {
  height: 100%;
  width: calc(var(--thickness) * 1vmin);
  position: absolute;
  left: 0;
  top: 50%;
  transform: translate(-50%, -50%) rotateY(90deg);
}
.cuboid__side:nth-of-type(5) {
  transform: translate3d(0, 0, calc(var(--thickness)));
  position: absolute;
  top: 0;
  left: 0;
}
.cuboid__side:nth-of-type(6) {
  transform: translate3d(0, 0, calc(var(--thickness)));
  position: absolute;
  top: 0;
  left: 0;
}

*,
*:after,
*:before {
  box-sizing: border-box;
  transform-style: preserve-3d;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: var(--bg);
  background: radial-gradient(circle, #2be4dc 0%, #243484 95%);
}

.scene {
  display: flex;
}

.jelly-fish {
  --thickness: calc(var(--base-size) * 0.3);
  transform: rotate3d(1, 1, 0, 45deg);
}
.jelly-fish__shift {
  display: flex;
}
.jelly-fish .jelly-body {
  margin: 1px;
}
.jelly-fish .jelly-body-shape {
  --thickness: calc(var(--base-size) * 0.4);
  height: 10vmin;
  width: 20vmin;
  animation-duration: calc(var(--anim-speed) * 1s);
  animation-name: jelly-body-swim;
  animation-direction: alternate;
  animation-iteration-count: infinite;
  animation-timing-function: ease-in-out;
}
.jelly-fish .tentacles {
  display: flex;
}
.jelly-fish .tentacles .tentacle {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  --thickness: calc(var(--base-size) * 0.1);
}
.jelly-fish .tentacles .tentacle-shape {
  height: 2vmin;
  width: 23vmin;
  animation-duration: calc(var(--anim-speed) * 1s);
  animation-name: jelly-tentacle-swim;
  animation-direction: alternate;
  animation-iteration-count: infinite;
  animation-timing-function: ease-in-out;
}
.jelly-fish .tentacles .tentacle-front {
  transform: translateZ(-3vmin);
}
.jelly-fish .tentacles .tentacle-back {
  transform: translateZ(3vmin) translateX(-100%);
}

@keyframes jelly-body-swim {
  from {
    width: 12vmin;
  }
  to {
    width: 23vmin;
  }
}
@keyframes jelly-tentacle-swim {
  from {
    width: 10vmin;
  }
  to {
    width: 27vmin;
  }
}
@keyframes jelly-pan {
  0% {
    transform: translate(400%, 0);
  }
  100% {
    transform: translate(-400%, 0);
  }
}
.blue {
  background: var(--blue);
}
</style>

<body translate="no">

      <div class="jelly-body">
        <div class="cuboid jelly-body-shape">
          <div class="cuboid__side blue"></div>
          <div class="cuboid__side blue"></div>
          <div class="cuboid__side blue"></div>
          <div class="cuboid__side blue"></div>
          <div class="cuboid__side blue"></div>
          <div class="cuboid__side blue"></div>
        </div>
      </div>
      <div class="tentacles">
        <div class="tentacle tentacle-front">
          <div class="cuboid tentacle-shape">
            <div class="cuboid__side blue"></div>
            <div class="cuboid__side blue"></div>
            <div class="cuboid__side blue"></div>
            <div class="cuboid__side blue"></div>
            <div class="cuboid__side blue"></div>
            <div class="cuboid__side blue"></div>
          </div>
          <div class="cuboid tentacle-shape">
            <div class="cuboid__side blue"></div>
            <div class="cuboid__side blue"></div>
            <div class="cuboid__side blue"></div>
            <div class="cuboid__side blue"></div>
            <div class="cuboid__side blue"></div>
            <div class="cuboid__side blue"></div>
          </div>
        </div>
        <div class="tentacle tentacle-back">
          <div class="cuboid tentacle-shape">
            <div class="cuboid__side blue"></div>
            <div class="cuboid__side blue"></div>
            <div class="cuboid__side blue"></div>
            <div class="cuboid__side blue"></div>
            <div class="cuboid__side blue"></div>
            <div class="cuboid__side blue"></div>
          </div>
          <div class="cuboid tentacle-shape">
            <div class="cuboid__side blue"></div>
            <div class="cuboid__side blue"></div>
            <div class="cuboid__side blue"></div>
            <div class="cuboid__side blue"></div>
            <div class="cuboid__side blue"></div>
            <div class="cuboid__side blue"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
