<style>
/* Global */
body {
  height: 100vh;
  margin: 0;
  background: #000000;
  overflow: hidden;
}

/* Box */
#box {
  position: relative;
  height: 100%;
  top: 50%;
  left: 50%;
  perspective: 9999px;
  transform-style: preserve-3d;
  transform: translate(-50%, -50%) rotateX(10deg);
  transition: 2s cubic-bezier(0.2, 0.9, 0.3, 1.3);
  cursor: pointer;
}

/* Layers */
.layer {
  position: absolute;
  width: 130%;
  height: 130%;
  top: 50%;
  left: 50%;
  background-repeat: no-repeat;
  background-position: center;
  background-size: cover;
  transition: ease 0.5s;
  animation: load 1.4s forwards;
  opacity: 0;
}

.layer:nth-child(1) {
  transform: translate(-50%, -50%) rotateZ(0deg) translateZ(20px);
  background-image: url("https://tobiasbogliolo.com/docs/codepen/assets/img/layer-1.png");
  animation-delay: 0.2s;
}

.layer:nth-child(2) {
  transform: translate(-50%, -50%) rotateZ(0deg) translateZ(40px);
  background-image: url("https://tobiasbogliolo.com/docs/codepen/assets/img/layer-2.png");
  animation-delay: 0.4s;
}

.layer:nth-child(3) {
  transform: translate(-50%, -50%) rotateZ(0deg) translateZ(60px);
  background-image: url("https://tobiasbogliolo.com/docs/codepen/assets/img/layer-3.png");
  animation-delay: 0.6s;
}

.layer:nth-child(4) {
  transform: translate(-50%, -50%) rotateZ(0deg) translateZ(80px);
  background-image: url("https://tobiasbogliolo.com/docs/codepen/assets/img/layer-4.png");
  animation-delay: 0.8s;
}

.layer:nth-child(5) {
  transform: translate(-50%, -50%) rotateZ(0deg) translateZ(100px);
  background-image: url("https://tobiasbogliolo.com/docs/codepen/assets/img/layer-5.png");
  animation-delay: 1s;
}

.layer:nth-child(6) {
  transform: translate(-50%, -50%) rotateZ(0deg) translateZ(120px);
  background-image: url("https://tobiasbogliolo.com/docs/codepen/assets/img/layer-6.png");
  animation-delay: 1.2s;
}

.layer:nth-child(7) {
  transform: translate(-50%, -50%) rotateZ(0deg) translateZ(140px);
  background-image: url("https://tobiasbogliolo.com/docs/codepen/assets/img/layer-7.png");
  animation-delay: 1.4s;
}

.layer:nth-child(8) {
  transform: translate(-50%, -50%) rotateZ(0deg) translateZ(160px);
  background-image: url("https://tobiasbogliolo.com/docs/codepen/assets/img/layer-8.png");
  animation-delay: 1.6s;
}

.layer:nth-child(9) {
  transform: translate(-50%, -50%) rotateZ(0deg) translateZ(180px);
  background-image: url("https://tobiasbogliolo.com/docs/codepen/assets/img/layer-9.png");
  animation-delay: 1.8s;
}

.layer-toggle {
  width: 80%;
  height: 80%;
}

/* Load layers */
@keyframes load {
  to {
    opacity: 1;
  }
}

//Throttle:
var throttleOn = false;
var actionLock = false;
var throttleTimer = 100;

function throttle(e) {
  if (throttleOn) {
    actionLock = true;
  };
  if (!actionLock) {
    throttleOn = true;
    setTimeout(function () {
      throttleOn = false;
    }, throttleTimer);
    translate(e);
  };
  actionLock = false;
};

//Tracking effect:
var threshold = 20;
var box = $("#box");

function translate(e) {
  var xOrigin = box.width() / 2;
  var yOrigin = box.height() / 2;
  var xPivot = (e.clientY - yOrigin) / yOrigin * -threshold;
  var yPivot = (e.clientX - xOrigin) / xOrigin * threshold;
  box.css({
    'transform': 'translate(-50%, -50%) rotateX(' + xPivot + 'deg) rotateY(' + yPivot + 'deg)' });

};

//Handler:
$(window).mousemove(function (e) {
  throttle(e);
});

//Toggle:
$(document).click(function () {
  $('.layer').toggleClass('layer-toggle');
});
