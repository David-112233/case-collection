<style>
@import url('https://fonts.googleapis.com/css?family=Open+Sans:300');

:root {
  --anime-duration: 4s;
  --block-size: 30px;
  --block-spacing: 3px;
  --color-hat-primary: #c70022;
  --color-hat-primary-face: #b80022;
  --color-hat-primary-side: #a60022;
  --color-hat-secondary: #eeeeee;
  --color-hat-secondary-face: #e0e0e0;
  --color-hat-secondary-side: #dddddd;
  --color-hair: #967570;
  --color-hair-face: #867570;
  --color-hair-side: #767570;
  --color-eye: #101f26;
  --color-eye-side: #001f26;
  --color-eye-face: #001010;
  --color-skin: #dfd3c5;
  --color-skin-face: #cfd3c5;
  --color-skin-side: #c0c3c5;
  --color-beard: #5f403e;
  --color-beard-face: #4f403e;
  --color-beard-side: #3f403e;
  --color-shirt: #be001f;
  --color-shirt-face: #ae001f;
  --color-shirt-side: #ae001f;
  --color-bib: #007bb7;
  --color-bib-face: #006bb7;
  --color-bib-side: #005ab7;
  --color-button: #f2e04f;
  --color-button-face: #e2e04f;
  --color-button-side: #c2e04f;
  --color-shoe: #a85426;
  --color-shoe-face: #a14226;
  --color-shoe-side: #a13226;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

body {
  display: flex;
  align-items: center;
  flex-direction: column;
  justify-content: center;
  min-height: 100vh;
  background-color: #10ae3f;
  font-family: 'Open Sans', sans-serif;
  letter-spacing: 2px;
}

h1 {
  top: 0;
  margin-bottom: 60px;
  color: #FFF;
  font-size: 48px;
  font-weight: 300;
  text-align: center;
  text-transform: uppercase;
}

h1 > span {
  font-size: 24px;
}

small {
  color: white;
}

.canvas {
  position: relative;
  width: calc(var(--block-size) * 11);
  transform: rotateX(35deg) rotateZ(40deg);
  transform-style: preserve-3d;
}

.row {
  display: flex;
  justify-content: center;
  transform-style: preserve-3d;
}

.block {
  position: relative;
  width: var(--block-size);
  height: var(--block-size);
  margin: var(--block-spacing);
  transform-style: preserve-3d;
  -webkit-animation-name: wave;
          animation-name: wave;
  -webkit-animation-delay: calc(var(--index, 1) * .03s );
          animation-delay: calc(var(--index, 1) * .03s );
  -webkit-animation-duration: var(--anime-duration);
          animation-duration: var(--anime-duration);
  -webkit-animation-iteration-count: infinite;
          animation-iteration-count: infinite;
  -webkit-animation-timing-function: cubic-bezier(1,-0.65,.18,1.52);
          animation-timing-function: cubic-bezier(1,-0.65,.18,1.52);
  will-change: transform;
}

@-webkit-keyframes wave {
  50% {
    transform: translateZ(60px);
  }
}

@keyframes wave {
  50% {
    transform: translateZ(60px);
  }
}

.block:before,
.block:after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  transform-origin: 100% 100%;
  background-color: inherit;
}

.block:before {
  transform: rotateX(90deg);
}

.block:after {
  transform: rotateY(-90deg);
}

.block--hat-primary {
  background-color: var(--color-hat-primary);
}
.block--hat-primary:before {
  background-color: var(--color-hat-primary-side);
}

.block--hat-primary:after {
  background-color: var(--color-hat-primary-face);
}

.block--hat-secondary {
  background-color: var(--color-hat-secondary);
}

.block--hat-secondary:before {
  background-color: var(--color-hat-secondary-side);
}

.block--hat-secondary:after {
  background-color: var(--color-hat-secondary-face);
}

.block--hair {
  background-color: var(--color-hair);
}

.block--hair:before {
  background-color: var(--color-hair-side);
}

.block--hair:after {
  background-color: var(--color-hair-face);
}

.block--skin {
  background-color: var(--color-skin);
}

.block--skin:before {
  background-color: var(--color-skin-side);
}

.block--skin:after {
  background-color: var(--color-skin-face);
}

.block--eye {
  background-color: var(--color-eye);
}

.block--eye:before {
  background-color: var(--color-eye-side);
}

.block--eye:after {
  background-color: var(--color-eye-face);
}

.block--beard {
  background-color: var(--color-beard);
}

.block--beard:before {
  background-color: var(--color-beard-side);
}

.block--beard:after {
  background-color: var(--color-beard-face);
}

.block--shirt {
  background-color: var(--color-shirt);
}

.block--shirt:before {
  background-color: var(--color-shirt-side);
}

.block--shirt:after {
  background-color: var(--color-shirt-face);
}

.block--bib {
  background-color: var(--color-bib);
}

.block--bib:before {
  background-color: var(--color-bib-side);
}

.block--bib:after {
  background-color: var(--color-bib-face);
}

.block--button {
  background-color: var(--color-button);
}

.block--button:before {

}

.block--button:after {

}

.block--shoe {

}

.block--shoe:before {
  background-color: var(--color-shoe-side);
}

.block--shoe:after {
  background-color: var(--color-shoe-face);
}
</style>
