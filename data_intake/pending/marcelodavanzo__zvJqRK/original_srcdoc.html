  <title>CSS 3D door</title>

    <link rel="canonical" href="https://codepen.io/marcelodavanzo/pen/zvJqRK">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<style>
/* -------------------------------- 
// GENERAL
-------------------------------- */
*,
*:before,
*:after {
  -webkit-box-sizing: border-box;
  -moz-box-sizing: border-box;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-overflow-scrolling: touch;
  -webkit-text-size-adjust: 100%;
}

body {
  display: flex;
  width: 300px;
  height: 100vh;
  margin: 0 auto;
  flex-direction: column;
  align-items: center;
  align-content: center;
  justify-content: center;
  background-color: #3d4043;
}

/* -------------------------------- 
// WRAPPER
-------------------------------- */
.wrapper {
  width: 300px;
  height: 300px;
  margin: 0 auto;
  position: relative;
  transform: perspective(600px);
  transform-style: preserve-3d;
}

/* -------------------------------- 
// BG
-------------------------------- */
.bg {
  width: 100%;
  height: 100%;
  border-radius: 4px;
  background-color: #fff;
  position: absolute;
  top: 0;
  left: 0;
  z-index: 1;
  box-shadow: 0 0 0 rgba(255, 255, 255, 0.8);
  transition: 150ms linear;
  transform: translate3d(0, 0, 0);
}

.open .bg {
  box-shadow: 0 0 80px rgba(255, 255, 255, 0.8);
}

/* -------------------------------- 
// DOOR
-------------------------------- */
.door {
  width: 100%;
  height: 100%;
  margin: auto;
  border-radius: 4px;
  background-color: #aaaaaa;
  position: absolute;
  top: 0;
  left: 0;
  z-index: 4;
  transition: 250ms linear;
  transform-style: preserve-3d;
  transform-origin: bottom center;
}

.back,
.door:before {
  content: "";
  width: 100%;
  height: 100%;
  background-color: #1e1e1e;
  position: absolute;
  top: 0;
  left: 0;
  z-index: 3;
  transition: 250ms linear;
  transform: translateZ(-12.5px);
}

.edge,
.door:after {
  content: "";
  width: 100%;
  height: 12.5px;
  background-color: #1e1e1e;
  position: absolute;
  top: 0;
  left: 0;
  z-index: 2;
  transition: 250ms linear;
  transform: rotateX(90deg) translateZ(12.5px);
  transform-origin: bottom center;
}

.open .door,
.open .door:before,
.open .door:after {
  transition-timing-function: cubic-bezier(0, 0, 0, 1);
}

.open .door {
  transform: rotateX(-90deg);
  background-color: #1e1e1e;
}

.back,
.open .door:before {
  background-color: gainsboro;
}

.edge,
.open .door:after {
  background-color: #aaaaaa;
}

/* -------------------------------- 
// BUTTONS
-------------------------------- */
.toggle {
  width: 100%;
  height: 50px;
  margin-bottom: 50px;
  padding: 10px;
  outline: 0;
  border: none;
  border-radius: 4px;
  background-color: #2283c3;
  font-size: 1.25em;
  color: #fff;
  cursor: pointer;
  transition: 150ms;
  transform: scale3d(1, 1, 1);
}

.toggle:active {
  background-color: #627684;
  transform: scale3d(0.9, 0.9, 1);
}
</style>

  <script>
  window.console = window.console || function(t) {};
</script>

  <script src="https://public.codepenassets.com/js/prefixfree-1.0.7.min.js"></script>

  
</head>

<body translate="no">
  <button class="toggle">Toggle</button>
<div class="wrapper">
  <div class="door"></div>
  <div class="bg"></div>
</div>
  <script src='//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script>
    <script id="rendered-js" >
var clickHandler = 'ontouchstart' in document.documentElement ? 'touchend' : 'click';

$(document).on(clickHandler, '.toggle', function () {
  $('.wrapper').toggleClass('open');
});
//# sourceURL=pen.js
  </script>

  
</body>
