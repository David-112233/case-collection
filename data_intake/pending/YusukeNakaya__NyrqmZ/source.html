body {
  background: radial-gradient(ellipse at center, white 15%, #aa9696 100%);
  height: 100vh;
  overflow: hidden;
  display: flex;
  font-family: "Anton", sans-serif;
  justify-content: center;
  align-items: center;
  perspective: 400px;
}

div {
  transform-style: preserve-3d;
  backface-visibility: hidden;
}

#pendulums {
  display: flex;
  transform: rotateX(0deg) rotateY(90deg) scale3d(0.7, 0.7, 0.7) translateX(300px);
}
#pendulums .pendulum {
  position: relative;
  width: 1px;
  height: 300px;
  margin: 0 12px;
  transform-origin: 50% 0;
}
#pendulums .pendulum::before {
  position: absolute;
  width: 100%;
  height: 100%;
  background: #282828;
  transform-origin: 50% 0;
  transform: rotateY(90deg);
}
#pendulums .pendulum::after {
  content: "";
  position: absolute;
  bottom: 5px;
  width: 200px;
  height: 50px;
  border: 5px solid #282828;
  transform-origin: 50% 0;
  transform: translate3d(-50%, 100%, 0px) rotateY(90deg);
  border-radius: 100px;
  box-sizing: border-box;
}
#pendulums .pendulum:nth-child(1) {
  animation: pend 5000ms -200ms ease-in-out infinite;
}
#pendulums .pendulum:nth-child(1)::after {
