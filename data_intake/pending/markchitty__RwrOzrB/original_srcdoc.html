  <title>SVG overlay with mask</title>

    <link rel="canonical" href="https://codepen.io/markchitty/pen/RwrOzrB">
  
  
  
  
<style>
svg .badge {
  fill: red;
}
svg .warning {
  fill: orange;
}
svg .badge, svg .badge-mask, svg .warning, svg .warning-mask {
  visibility: hidden;
}
svg.with-badge .badge, svg.with-badge .badge-mask {
  visibility: visible;
}
svg.with-warning .warning, svg.with-warning .warning-mask {
  visibility: visible;
}

svg {
  fill: currentColor;
}

.my-svg {
  width: 300px;
  height: 300px;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #dde;
  background: #404f5c url(https://source.unsplash.com/1600x900/?dark) center/cover no-repeat;
}
</style>

  <svg class="my-svg with-warning" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">

    <use class="warning" xlink:href="#warning-triangle"/>
