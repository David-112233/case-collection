/* Scripting for ustom Interaction Ends */

$(function () {
  /* SVG Pan Zoom Function */
  panZoomInstance = svgPanZoom('#floorMap', {
    zoomEnabled: true,
    controlIconsEnabled: true,
    fit: true,
    center: true,
    minZoom: 1,
    beforePan: beforePan,
    customEventsHandler: {
      // Halt all touch events
      haltEventListeners: ['touchstart', 'touchend', 'touchmove', 'touchleave', 'touchcancel'],
      init: function (options) {
        var instance = options.instance,
        initialScale = 1,
        pannedX = 0,
        pannedY = 0;

        // Init Hammer
        // Listen only for pointer and touch events
        this.hammer = Hammer(options.svgElement, {
          inputClass: Hammer.SUPPORT_POINTER_EVENTS ? Hammer.PointerEventInput : Hammer.TouchInput });


        // Enable pinch
        this.hammer.get('pinch').set({
          enable: true });


        // Handle double tap
        this.hammer.on('doubletap', function (ev) {
          instance.zoomIn();
        });

        // Handle pan
        this.hammer.on('panstart panmove', function (ev) {
          // On pan start reset panned variables
          if (ev.type === 'panstart') {
            pannedX = 0;
            pannedY = 0;
          }

          // Pan only the difference
          instance.panBy({
            x: ev.deltaX - pannedX,
            y: ev.deltaY - pannedY });

          pannedX = ev.deltaX;
          pannedY = ev.deltaY;
        });

        // Handle pinch
        this.hammer.on('pinchstart pinchmove', function (ev) {
          // On pinch start remember initial zoom
          if (ev.type === 'pinchstart') {
            initialScale = instance.getZoom();
            instance.zoomAtPoint(initialScale * ev.scale, {
              x: ev.center.x,
              y: ev.center.y });

          }
          instance.zoomAtPoint(initialScale * ev.scale, {
            x: ev.center.x,
            y: ev.center.y });

        });

        // Prevent moving the page on some devices when panning over SVG
        options.svgElement.addEventListener('touchmove', function (e) {
          e.preventDefault();
        });
      },
      destroy: function () {
        this.hammer.destroy();
      } },

    onZoom: function () {
      saveSettings(panZoomInstance);
    },
    onPan: function () {
      saveSettings(panZoomInstance);
    } });


  /* SVG Pan Zoom Settings */
  var settings = loadSettings();
  if (settings) {
    panZoomInstance.zoom(settings.zoom);
    panZoomInstance.pan(settings.pan);

/* Restrict Pan to remain element in viewport */
var beforePan;
beforePan = function (oldPan, newPan) {
  var stopHorizontal = false,
  stopVertical = false,
  gutterWidth = 200,
  gutterHeight = 200,
  sizes = this.getSizes(),
  leftLimit = -((sizes.viewBox.x + sizes.viewBox.width) * sizes.realZoom) + gutterWidth,
  rightLimit = sizes.width - gutterWidth - sizes.viewBox.x * sizes.realZoom,
  topLimit = -((sizes.viewBox.y + sizes.viewBox.height) * sizes.realZoom) + gutterHeight,
  bottomLimit = sizes.height - gutterHeight - sizes.viewBox.y * sizes.realZoom;

  customPan = {};
  customPan.x = Math.max(leftLimit, Math.min(rightLimit, newPan.x));
  customPan.y = Math.max(topLimit, Math.min(bottomLimit, newPan.y));

  return customPan;
};

/* Save Cookies */
function saveSettings(i) {
  var obj = {
    zoom: i.getZoom(),
    pan: i.getPan() };

  var d = new Date();
  d.setTime(d.getTime() + 24 * 60 * 60 * 1000);
  document.cookie = 'svgPanZoom=' + JSON.stringify(obj) + ';expires=' + d.toUTCString();
}

/* Load Cookies */
function loadSettings() {
  var match = document.cookie.match(/svgPanZoom\=([^;]+)/);
  try {
    if (match) {
      return JSON.parse(match[1]);
    }
  } catch (e) {}

  return null;
}
