<style>
* {
  box-sizing: border-box;
}

html,
body {
  background-color: #00172B;
}

.parallax {
  perspective: 100px;
  height: 100vh;
  overflow-x: hidden;
  overflow-y: auto;
  position: absolute;
  top: 0;
  left: 50%;
  right: 0;
  bottom: 0;
  margin-left: -1500px;
}

.parallax__layer {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  transition: transform 1s ease;
}
.parallax__layer img {
  display: block;
  position: absolute;
  bottom: 0;
}

.parallax__cover {
  background: #00172B;
  display: block;
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  height: 2000px;
  z-index: 2;
}

.parallax__layer__0 {
  transform: translateZ(-250px) scale(3.5);
}

.parallax__layer__1 {
  transform: translateZ(-200px) scale(3);
}

.parallax__layer__2 {
  transform: translateZ(-150px) scale(2.5);
}

.parallax__layer__3 {
  transform: translateZ(-100px) scale(2);
}

.parallax__layer__4 {
  transform: translateZ(-50px) scale(1.5);
}

.parallax__layer__5 {
  transform: translateZ(0px) scale(1);
}
</style>

  <script>
  window.console = window.console || function(t) {};
</script>

  
  
</head>

<body translate="no">
  <div class="parallax">
    <div class="parallax__layer parallax__layer__0">
        <img src="https://cee-r.github.io/etc/underwater/water_0.png" />
    </div>
    <div class="parallax__layer parallax__layer__1">
        <img src="https://cee-r.github.io/etc/underwater/water_1.png" />
    </div>
    <div class="parallax__layer parallax__layer__2">
        <img src="https://cee-r.github.io/etc/underwater/water_2.png" />
    </div>
    <div class="parallax__layer parallax__layer__3">
        <img src="https://cee-r.github.io/etc/underwater/water_3.png" />
    </div>
    <div class="parallax__layer parallax__layer__4">
        <img src="https://cee-r.github.io/etc/underwater/water_4.png" />
    </div>
    <div class="parallax__cover"></div>
</div>
 <div class="parallax__cover2"></div>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js'></script>
