  <title>CSS-only Interactive 3D cube with scrolling</title>

    <link rel="canonical" href="https://codepen.io/t_afif/pen/BaOyROR">
  
  
  
  
<style>
.gallery {
  --s: 250px; /* the size */
  
  position: fixed;
  display: grid;
  inset: calc(50% - var(--s)/2);
  aspect-ratio: 1;
  transform-style: preserve-3d;
  --_p: perspective(calc(2.5*var(--s)));
  animation: r 9s linear both;
  animation-timeline: scroll(root);
}
.gallery img {
  grid-area: 1/1;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: var(--_t,) translateZ(calc(var(--s)/2));
}
.gallery img:nth-child(2) {--_t: rotateX(-90deg)}
.gallery img:nth-child(3) {--_t: rotateY( 90deg)}
.gallery img:nth-child(4) {--_t: rotateX(180deg) rotate( 90deg)}
.gallery img:nth-child(5) {--_t: rotateX( 90deg)}
.gallery img:nth-child(6) {--_t: rotateY(-90deg)}

@keyframes r {
  0%   {transform: var(--_p) rotate3d(0, 0, 0, 0deg)}
  20%  {transform: var(--_p) rotate3d(-1, 1, 0, 180deg)}
  40%  {transform: var(--_p) rotate3d(0, -1, 0, 90deg)}
  60%  {transform: var(--_p) rotate3d(1, 0, 0, 90deg)}
  80%  {transform: var(--_p) rotate3d(1, 0, 0, -90deg)}
  100% {transform: var(--_p) rotate3d(0, 1, 0, 90deg)}
}


body {
  margin: 0;
  background: #774F38;
  animation: b 9s linear;
  animation-timeline: scroll(root);
}
body >div:not([class]) {
  height: 100vh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
}
html {
  scroll-snap-type: y mandatory;
}

@keyframes b {
  0%   {background: #774F38}
  20%  {background: #C5E0DC}
  40%  {background: #036564}
  60%  {background: #B38184}
  80%  {background: #424254}
  100% {background: #4DBCE9}
}


.notice {
  display: none;
}
@supports not (animation-timeline: scroll(root)) {
 .notice {
   display: block;
   position: fixed;
   inset: 20px 20px auto;
   background: #fff;
   padding: 20px;
   color: red;
   font-size: 20px;
   font-family: sans-serif;
   box-shadow: 0 2px 5ps #0005;
 } 
}
::-webkit-scrollbar {
  width: 16px;
}

::-webkit-scrollbar-track {
  background-color: #e4e4e4;
}

::-webkit-scrollbar-thumb {
  background-color: #d4aa70;
}
</style>

  </head>

<body translate="no">
  <div class="gallery">
  <img src="https://picsum.photos/id/174/600/600" alt="a hot air balloon">

  <img src="https://picsum.photos/id/28/600/600" alt="a forest">
</div>
