    <script id="rendered-js" >
const scene = document.querySelector(".scene");

const rot = e => {
  var x = e.pageX / window.innerWidth - 0.5;
  var y = e.pageY / window.innerHeight - 0.5;
  scene.style.transform = `
        rotateX(${y * 70 - 30}deg)
        rotateY(${-x * 360}deg)`;
};

document.body.addEventListener("pointermove", rot);
//# sourceURL=pen.js
  </script>
