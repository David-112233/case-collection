  <title>3D cube-plane intersection &amp; backdrop-filter test</title>

    <link rel="canonical" href="https://codepen.io/thebabydino/pen/bGxGOod">
  
  
  
  
<style>
html, body, div {
  display: grid;
}

html {
  height: 100%;
}

body {
  perspective: 25em;
}

div, ::before, ::after {
  grid-area: 1/1;
}

div {
  transform-style: preserve-3d;
}

.assembly {
  place-self: center;
  transform: rotatex(-25deg) rotatey(30deg);
}

@keyframes r {
  0% {
    transform: none;
  }
  100% {
    transform: rotatey(1turn);
  }
}
.face {
  --i: 0;
  --j: calc(1 - var(--i));
  transform: rotate3d(var(--i), var(--j), 0, calc(var(--m)*90deg)) translatez(7.5vmin);
}
.face:nth-child(n+5) {
  --i: 1 ;
}
.face:nth-child(1) {
  --m: 0 ;
}
.face:nth-child(2) {
  --m: 1 ;
}
.face:nth-child(3) {
  --m: 2 ;
}
.face:nth-child(4) {
  --m: 3 ;
}
.face:nth-child(5) {
  --m: -1 ;
}
.face:nth-child(6) {
  --m: 1 ;
}
.face::before, .face::after {
  --k: 0;
  box-sizing: border-box;
  border: solid 2px;
  width: 15vmin;
  aspect-ratio: 1;
  backface-visibility: hidden;
  transform: rotatey(calc(var(--k)*.5turn));
  backdrop-filter: blur(3px);
  background: hsla(var(--hue, 0), 100%, 50%, 0.5);
  content: "";
}
.face::after {
  --k: 1;
}

.int {
  transform: rotatex(-5deg) rotatey(-9deg) scale(2);
  --hue: 240 ;
}
</style>

  </head>

<body translate="no">
  <div class="assembly">
  <div class="cube">
    <div class="face"></div>
    <div class="face"></div>
    <div class="face"></div>
    <div class="face"></div>
    <div class="face"></div>
    <div class="face"></div>
  </div>
  <div class="face int"></div>
</div>
  
  
  
</body>
