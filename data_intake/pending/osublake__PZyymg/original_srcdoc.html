"use strict";
// Based on Israel Eisenberg's variable stroke width articles
// http://owl3d.com/svg/vsw/articles/
// Path simplification based on Simplify.js
// https://mourner.github.io/simplify-js/

// ========================================================================

        var y = p1y;

                y = p2y;

                y += dy * t;

        dy = py - y;

            pointY = points[i + 1];

                prevPointX = pointX;
                prevPointY = pointY;

                maxDistSq = distSq;

        points = simplifyDouglasPeucker(points, toleranceSq);

            return;

            var sameX = (points[0] === points[2]);
            var sameY = (points[1] === points[3]);

        for (var i = 0; i < size - 2; i += 2) {

            var y0 = i ? points[i - 1] : points[1];
            var x1 = points[i + 0];
            var y1 = points[i + 1];
            var x2 = points[i + 2];
            var y2 = points[i + 3];
            var x3 = i !== last ? points[i + 4] : x2;
            var y3 = i !== last ? points[i + 5] : y2;

                var xc1 = (x0 + x1) / 2;
                var yc1 = (y0 + y1) / 2;
                var xc2 = (x1 + x2) / 2;
                var yc2 = (y1 + y2) / 2;
                var xc3 = (x2 + x3) / 2;
                var yc3 = (y2 + y3) / 2;
                var len1 = Math.sqrt((x1 - x0) * (x1 - x0) + (y1 - y0) * (y1 - y0));
                var len2 = Math.sqrt((x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1));

                var cp2y = ym2 + (yc2 - ym2) * k + y2 - ym2;

// RIBBON PATH
// ========================================================================
class RibbonPath {
    constructor(ribbon, index) {
        this.ribbon = ribbon;
        this.index = index;
        this.group = document.querySelector("#layer-" + index);
        this.element = createSvg("path", {
            appendTo: this.group,
            class: "ribbon",
            d: ribbon.d
        });
        this.update();
    }
    destroy() {
        this.group.removeChild(this.element);
    }
    update() {
        var ribbon = this.ribbon;
        var progress = this.index / ribbon.width;
        var transform = lerpArray(progress, ribbon.start, ribbon.end);
        var color = lerpColor(progress, ribbon.color);
        var stroke = `rgb(${color[0] >> 0},${color[1] >> 0},${color[2] >> 0})`;
        TweenLite.set(this.element, {
            x: transform[0],
            y: transform[1],
            stroke
        });
    }
}
//
// RIBBON
// ========================================================================
class Ribbon {
    constructor(d, angle, width) {
        this.d = d;
        this._angle = 0;
        this._width = 0;
        this.color = colors.slice(0);
        this.dirty = false;
        this.paths = [];
        this.start = [];
        this.end = [];
        this.update(angle, width);
    }
    get angle() { return this._angle; }
    set angle(n) {
        if (n != null && n !== this._angle) {
            this.dirty = true;
            this._angle = n;
        }
    }
    get width() { return this._width; }
    set width(n) {
        if (n != null && n !== this._width) {
            this.dirty = true;
            this._width = n;
        }
    }
    destroy() {
        _.forEach(this.paths, path => path.destroy());
    }
    update(angle, width) {
        this.angle = angle;
        this.width = width;
        if (!this.dirty)
            return;
        if (this.paths.length > this.width) {
            var paths = this.paths.splice(this.width);
            _.forEach(paths, path => path.destroy());
        }
        var x = (cos(180 - this.angle) * this.width / 2);
        var y = (sin(180 - this.angle) * this.width / 2);
        this.start[0] = x;
        this.start[1] = -y;
        this.end[0] = -x;
        this.end[1] = y;
        for (var i = 0; i < this.width; i++) {
            var path = this.paths[i];
            if (path) {
                path.update();

// PENCIL
// ========================================================================
class Pencil {
    constructor(tolerance, distSq) {

        this.lastY = 0;

        this.point = document.querySelector("#pencil-point");

            bounds: "#svg",
            trigger: "#svg",

            onDrag: this.onDrag,
            onDragEnd: this.onDragEnd,
            callbackScope: this

    onPress(event) {

        var x = this.lastX = this.pencil.pointerX;
        var y = this.lastY = this.pencil.pointerY;
        TweenLite.set(this.point, { x, y });
        this.pencil.update();
        this.points.length = 0;
        this.points.push(x, y);

    onDrag(event) {
        var x = this.pencil.x;
        var y = this.pencil.y;
        var dx = (this.lastX - x) ** 2;
        var dy = (this.lastY - y) ** 2;

            this.lastX = this.pencil.x;
            this.lastY = this.pencil.y;
            this.points.push(x, y);
            this.line.setAttribute("points", this.points);

    }
    onDragEnd(event) {
        var x = this.pencil.x;
        var y = this.pencil.y;

            this.points.push(x + 1, y + 1);

        var path = catmullRom.solve(this.points, this.tolerance, false, false, 1);

        angleRange.dirty = false;

    if (widthRange.dirty) {
        width = widthRange.value;
        widthRange.dirty = false;

// RUN
// ========================================================================
console.clear();
const xmlns = "http://www.w3.org/2000/svg";

const rad = Math.PI / 180;
var angleConfig = {
    min: 0,
    max: 360,
    value: 70
};
var widthConfig = {
    min: 2,
    max: 40,
    value: 20
};
var renderFps = 1000 / 30;
var minDist = 10;
var tolerance = 10;
var colors = [[0, 0, 128], [100, 192, 255]];

var clear = document.querySelector("#clear");
