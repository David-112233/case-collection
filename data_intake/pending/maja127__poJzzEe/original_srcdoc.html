  <title>Cocktail glass with animated liquid, CSS only</title>

    <link rel="canonical" href="https://codepen.io/maja127/pen/poJzzEe">
  
  
  
  
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: #0c0c0c;
}

.head {
  position: relative;
  height: 100px;
  width: 200px;
  display: block;
  overflow: hidden;
  background-color: rgba(0,222,255, 0.3);
  border-bottom-left-radius: 100px;
  border-bottom-right-radius: 100px;
}
.stem {
  margin: 0 auto;
  height: 75px;
  width: 10px;
  background-color: rgba(0,222,255, 0.3);
  border-bottom: 2px solid rgb(0,155.4,178.5) ;
  border-radius: 0px 0px 5px 5px;
}
.base {
  margin: 0 auto;
  margin-top: -6px;
  width: 100px;
  height: 25px;
  border-radius: 50%;
  background-color: rgba(0,222,255, 0.3);
}
.head .liquid {
  position: absolute;
  top: -60px;
  left: 0;
  width: 200px;
  height: 220px;
  background-color: rgba(0,222,255, 0.3);
  box-shadow: inset 0 0 50px rgba(0, 0, 0, .5);
  transition: 1s;
}

.head .liquid::after,
.head .liquid::before {
  content: '';
  width: 200%;
  height: 200%;
  position: absolute;
  top: 0;
  left: 50%;
  transform: translate(-50%, -75%);
  background: #000;
    box-shadow: inset 0 0 6px rgba(202, 228, 225, 0.98),
    0 0 30px rgba(202, 228, 225, 0.42), inset 0 0 12px rgba(30, 132, 242, 0.58),
    inset 0 0 22px rgba(30, 132, 242, 0.84),
    inset 0 0 38px rgba(30, 132, 242, 0.88), 0 0 60px rgba(30, 132, 242, 1);
}

.head .liquid::before {
  
  border-radius: 45%;
  background: rgba(20, 20, 20, 1);
  animation: animate 5s linear infinite;
}

.head .liquid::after {
  
  border-radius: 40%;
  background: rgba(20, 20, 20, .5);
  animation: animate 10s linear infinite;
}

.head:hover .liquid{
  top: -120px;
}

@keyframes animate {
  0% {
    transform: translate(-50%, -75%) rotate(0deg);
  }
  100% {
    transform: translate(-50%, -75%) rotate(360deg);
  }
}
</style>

  <script>
  window.console = window.console || function(t) {};
</script>

  
  
</head>

<body translate="no">
  <div class="glass">
<div class="head">
  <div class="liquid"></div>
</div>
 <div class="stem"></div>
  <div class="base"></div>
</div>
  
  
  
</body>
