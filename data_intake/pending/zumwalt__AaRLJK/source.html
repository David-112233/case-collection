.vignette {

  left: 50%;
}

.vignette {
  background: #354A5E;
  height: 350px;
  overflow: hidden;
  position: relative;
  width: 350px;
  -moz-border-radius: 50%;
  -webkit-border-radius: 50%;
  border-radius: 50%;
}

.lead {

@-webkit-keyframes load {
