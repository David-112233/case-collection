html {

}

*, *:before, *:after {
  box-sizing: inherit;
}

body {
  margin: 0;
  padding: 0 10vmin;
}

@support (display: grid) {
  h1 {
    color: orange !important;
  }
}
.grid {
  display: grid;
  grid-template-columns: repeat(191, 2.722513089px);
  grid-template-rows: repeat(250, 2.722513089px);
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
}
@media (max-width: 640px) {
  .grid {
    grid-template-columns: repeat(191, 0.4188481675vmin);
    grid-template-rows: repeat(250, 0.4vmin);
  }
}
.grid:before, .grid:after {
  content: "";
  display: table;
}
.grid:before {
  float: left;
  padding-bottom: 100%;
}
.grid:after {
  clear: both;
}
.grid > div {
  -webkit-animation: animate 0.5s forwards;
          animation: animate 0.5s forwards;
  opacity: 0;
  transform: scale(0.1) rotate(-180deg);
  cursor: pointer;
  transition: all 0.3s;
  counter-increment: cellcount;
  position: relative;
}
.grid > div:not(:last-of-type) {
  background-color: #666;
}
.grid > div:hover {
  z-index: 1;
  background-color: #282828;
  background-color: #b90000;
}
.grid > div:hover:before {
  content: counter(cellcount);
  font-size: 9px;
  font-family: sans-serif;

  background-color: #b90000;
