    will-change: transform;
    transform: rotateX(90deg) translate3d(0vw, -6vw, calc(1vw + 20px));
  }
}

  from {
    will-change: unset;
    transform: rotateX(90deg) translate3d(0vw, 4.5vw, 1vw);
  }
  to {
    will-change: transform;
    transform: rotateX(90deg) translate3d(0vw, 4.5vw, calc(1vw + 20px));
  }
}

  from {

    width: 22.5vw;
    height: 22.5vw;

    filter: blur(2px);

    width: 23vw;
    height: 23vw;
    opacity: 0.12;
    filter: blur(2.5px);
    box-shadow: 0px 0px 44px 32px #2374c6;
  }
}
