    <script id="rendered-js" >
var doc = document.getElementById('flex');
var stars = SVG.adopt(document.getElementById('stars'));
var lrock = SVG.adopt(document.getElementById('lrock'));
var rrock = SVG.adopt(document.getElementById('rrock'));
var lrock_stop_0 = SVG('#lrock_color .stop-0');
var lrock_stop_1 = SVG('#lrock_color .stop-1');
var rrock_stop_0 = SVG('#rrock_color .stop-0');
var rrock_stop_1 = SVG('#rrock_color .stop-1');
var cloud1 = SVG.adopt(document.getElementById('cloud1'));
var cloud2 = SVG.adopt(document.getElementById('cloud2'));
var cloud3 = SVG.adopt(document.getElementById('cloud3'));
var cloud1_1 = SVG.adopt(document.getElementById('cloud1_1'));
var cloud2_1 = SVG.adopt(document.getElementById('cloud2_1'));
var cloud3_1 = SVG.adopt(document.getElementById('cloud3_1'));
var sun_path = SVG.adopt(document.getElementById('sun_path'));
var bg_color = SVG.adopt(document.getElementById('bg_color'));


var a_time = { duration: 350, ease: '<>' };

doc.onmouseenter = doc.onmouseleave = handler;
function handler(event) {
  if (event.type == 'mouseenter') {
    stars.animate(a_time).attr('fill-opacity', '0');
    cloud1.animate(a_time).move(-60, 0);
    cloud2.animate(a_time).move(70, 0);
    cloud3.animate(a_time).move(70, 0);
    lrock.animate(a_time).move(-20, 171);
    rrock.animate(a_time).move(130, 200);
    lrock_stop_0.animate(a_time).update('0%', '#D37F80');
    lrock_stop_1.animate(a_time).update('100%', '#966B80');
    rrock_stop_0.animate(a_time).update('0%', '#E18F90');
    rrock_stop_1.animate(a_time).update('100%', '#B08499');


    cloud1_1.animate(a_time).attr({ fill: '#fff', 'opacity': '1' });
    cloud2_1.animate(a_time).attr({ fill: '#fff', 'opacity': '1' });
    cloud3_1.animate(a_time).attr({ fill: '#fff', 'opacity': '1' });
    sun_path.animate(a_time).attr({ cx: "182", cy: "122" });
    bg_color.animate(a_time).attr({ fy: "40%", cy: "40%" });


  }
  if (event.type == 'mouseleave') {
    stars.animate(a_time).attr('fill-opacity', '1');
    cloud1.animate(a_time).move(0, 0);
    cloud2.animate(a_time).move(0, 0);
    cloud3.animate(a_time).move(0, 0);
    lrock.animate(a_time).move(0, 171);
    rrock.animate(a_time).move(150, 200);
    lrock_stop_0.animate(a_time).update('0%', '#85728F');
    lrock_stop_1.animate(a_time).update('100%', '#59517C');
    rrock_stop_0.animate(a_time).update('0%', '#A68893');
    rrock_stop_1.animate(a_time).update('100%', '#7C567C');
    cloud1_1.animate(a_time).attr({ fill: '#ECD9E5', 'opacity': '0.6' });
    cloud2_1.animate(a_time).attr({ fill: '#ECD9E5', 'opacity': '0.6' });
    cloud3_1.animate(a_time).attr({ fill: '#ECD9E5', 'opacity': '0.6' });
    sun_path.animate(a_time).attr({ cx: "182", cy: "254" });
    bg_color.animate(a_time).attr({ fy: "100%", cy: "100%" });
  }
}
