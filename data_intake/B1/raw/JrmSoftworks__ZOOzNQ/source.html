<style>
.container {
  display: inline-block;
  margin-left: 10px;
  width: 200px;
  height: 200px;
  position: relative;
  perspective: 800px;
  margin-top: 50px;
}

.container > div {
  float: left;
  width: 100%;
  height: 100%;
  position: absolute;
  transform-style: preserve-3d;
  transition: transform 1.5s;
  z-index: 0;
}

.front {
  display: block;
  width:100%;
  height: 100%;
  position: absolute;
  margin: 0;
  font-size: 175px;
  text-align: center;
  
  backface-visibility: hidden;
}

.front {
  background-color: red;
}

.flip-button {
  margin-top: 10px;
  position: absolute;
  bottom: -35px;
}

.card > div, .card > svg, .long-diamond > div, .long-diamond > svg {
	position: absolute;
}

.card .triangle,
.card .rect,
.card .corner-to-quad,
.card .long-diamond {
	width: 100%;
	height: 100%;
	transform-style: preserve-3d;
}

.triangle .moving-triangle,
.rect .moving-rect
.corner-to-quad .moving-corner-to-quad  {
	outline: 1px solid transparent;
}

.static-triangle {
	border-bottom: 200px solid red;
    border-left: 200px solid transparent;
    bottom: 0;
    height: 0;
    left: 0;
    position: absolute;
    transform-origin: center center 0;
    width: 0;
}

.moving-triangle {
	border-bottom: 141px solid transparent;
    border-right: 141px solid red;
    border-top: 141px solid transparent;
    bottom: 0;
    left: -70.24%;
    position: absolute;
    transform: rotateZ(45deg) rotateY(0deg);
    transform-origin: 100% 100% 0;
    transition: transform 1.5s ease 0s, border-right-color 1.5s ease 0s;
}

.card.animate .triangle .moving-triangle {
	transform: rotateZ(45deg) rotateY(179deg);
	border-right-color: #D20000;
}

.card .triangle.tr-to-bl {
	transform-origin: 50% 50% 0;
	transform: rotate(90deg);
}

.card .triangle.br-to-tl {
	transform-origin: 50% 50% 0;
	transform: rotate(180deg);
}

.card .triangle.bl-to-tr {
	transform-origin: 50% 50% 0;
	transform: rotate(-90deg);
}

.static-rect {
	background-color: red;
    bottom: 0;
    position: absolute;
    right: 0;
    top: 0;
    width: 50%;
}

.moving-rect {
  position: absolute;
  background-color: red;
  width: 50%;
  height: 100%;
  transform-origin: 100% 0% 0;
  transition: transform 1.5s ease 0s, background-color 1.5s ease 0s;
  transform: rotateY(0deg);
}

.card.animate .rect .moving-rect {
   background-color: #d20000;
   transform: rotateY(179deg);
   transition: transform 1.5s ease 0s, background-color 1.5s ease 0s;
}

.card .rect.r-to-l {
  transform: rotate(180deg);
}

.card .rect.t-to-b {
  transform: rotate(90deg);
}

.card .rect.b-to-t {
  transform: rotate(-90deg);
}

.static-corner-to-quad {
	
}

.static-corner-to-quad polygon {
	fill: red;
	stroke: red;
}

.moving-corner-to-quad {
	height: 109%;
    left: -16.2%;
    overflow: visible;
    position: absolute;
    top: -11.3%;
    transform: rotate(22.5deg);
    transform-origin: 50% 50% 0;
}

.moving-corner-to-quad polyline {
	fill: red;
    overflow: visible;
    transform: rotateY(0deg);
    transform-origin: 100% 0 0;
    transition: transform 1.5s ease 0s, fill 1.5s ease 0s;
}

.card.animate .moving-corner-to-quad > polyline {
	transform: rotateY(180deg);
	fill: #D20000;
}

.card .corner-to-quad.tr-to-q4,
.card .corner-to-quad.br-to-q1 {
	transform: rotate(90deg);
} 

.card .corner-to-quad.br-to-q3,
.card .corner-to-quad.bl-to-q4 {
	transform: rotate(180deg);
}

.card .corner-to-quad.bl-to-q2,
.card .corner-to-quad.tl-to-q3 {
	transform: rotate(-90deg);
}

.card .corner-to-quad.tr-to-q2 .static-corner-to-quad,
.card .corner-to-quad.br-to-q1 .static-corner-to-quad,
.card .corner-to-quad.bl-to-q4 .static-corner-to-quad,
.card .corner-to-quad.tl-to-q3 .static-corner-to-quad {
	right: -16.5%;
	left: auto;
	transform: rotateY(180deg);
}

.card .corner-to-quad.tr-to-q2 .moving-corner-to-quad,
.card .corner-to-quad.br-to-q1 .moving-corner-to-quad,
.card .corner-to-quad.bl-to-q4 .moving-corner-to-quad,
.card .corner-to-quad.tl-to-q3 .moving-corner-to-quad {

	right: -16.2% !important;
	left: auto;
	transform: rotateY(180deg) rotate(22.5deg);
}

.long-diamond > svg {
	fill: red;
}






/* EXPERIMENTAL */



#diamond-fold, #diamond-fold-blank {
	height: 109%;
    left: -16.5%;
    overflow: visible;
    position: absolute;
    top: -11.3%;
    transform: rotate(22.5deg);
    transform-origin: 50% 50% 0;
}

#diamond-fold-blank {
	fill: white;
	left: -16.75%;
    top: -11.75%;
}

#diamond-fold-blank > polyline {
	stroke: white;
}

#diamond-fold polyline {
	fill: red;
	overflow: visible;
    transform: rotateY(0deg);
    transform-origin: 100% 0 0;
	transition: transform 1.5s, fill 1.5s;
}

.card.animate #diamond-fold > polyline {
	transform: rotateY(180deg);
	fill: #D20000;
}

.card.diamond-tr-to-c,
.card.diamond.rs.br-to-c {
	transform: rotate(90deg);
}

.card.diamond-br-to-c,
.card.diamond.rs.bl-to-c {
	transform: rotate(180deg);
}

.card.diamond-bl-to-c,
.card.diamond.rs.tl-to-c {
	transform: rotate(270deg);
}


.card.diamond.rs #diamond-fold,
.card.diamond.rs #diamond-fold-blank {
	right: -16.5%;
	left: auto;
	transform: rotateY(180deg) rotate(22.5deg);
}

.card.diamond.rs #diamond-fold {
	right: -16.3% !important;
}



.card.compound {

}

.card.compound .background-layer,
.card.compound .static-layer,
.card.compound .moving-layer {
	height: 100%;
    width: 100%;
	position: absolute;
}

.card.compound .background-layer {

}

.card.compound .static-layer {
	
}

.card.compound .static-layer > .card {
	transition: none !important;
	height: 100%;
    position: absolute;
    width: 100%;
}

.card.compound .static-layer > .card > div {
    position: absolute;
}

.card.compound .moving-layer {

}

    <script id="rendered-js" >
function animate(foldType) {
  $(foldType + ' .up-triangle').animate({
    borderTopWidth: "0px" },
  { queue: false, duration: 500 });

  setTimeout(function () {
    $(foldType + ' .down-triangle').animate({
      borderTopWidth: "142px" },
    500);}, 325);
}

function animateReverse(foldType) {
  $(foldType + ' .down-triangle').animate({
    borderTopWidth: "0px" },
  { queue: false, duration: 500 });

  setTimeout(function () {
    $(foldType + ' .up-triangle').animate({
      borderTopWidth: "142px" },
    500);}, 350);
}
