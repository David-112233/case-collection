<style>
.paper-big {
  transform-style: preserve-3d;
  transform-origin: 50% 50%;
  animation: rotater 4s ease alternate infinite;
}
.paper-big .paper-fill {
  animation: paper-flash 8s ease forwards infinite;
}

.head {
  transform-origin: 50% 50%;
  animation: head-mover 4s ease alternate infinite;
}

.eyes {
  transform-origin: 50% 50%;
  animation: eye-mover 4s ease alternate infinite;
}

.arm--stage-left .shoulder-arm-elbow {
  transform-origin: 50% 50%;
  animation: shoulder-arm-elbow-left 4s alternate infinite;
}
.arm--stage-left .forearm {
  transform-origin: 50% 50%;
  animation: forearm-left 4s alternate infinite;
}

.hand--stage-left {
  transform-origin: 50% 50%;
  animation: hand-left 4s alternate infinite;
}

@keyframes rotater {
  0% {
    transform: perspective(1000px) rotateZ(0deg) translate3d(-20px, 10px, -20px) skew(0deg) scale(1);
  }
  100% {
    transform: perspective(1500px) rotateZ(-3deg) translate3d(0, 0, 0) skew(-4deg, 1deg) scale(1.1);
  }
}
@keyframes paper-flash {
  0% {
    opacity: 0.5;
    filter: brightness(5);
  }
  24% {
    opacity: 0.5;
    filter: brightness(5);
  }
  25% {
    opacity: 1;
    filter: brightness(5);
  }
  26% {
    filter: brightness(0.4);
  }
  27% {
    filter: brightness(3);
  }
  28% {
    opacity: 1;
    filter: brightness(1);
  }
  90% {
    opacity: 1;
    filter: brightness(1);
  }
  to {
    opacity: 0.5;
    filter: brightness(5);
  }
}
@keyframes head-mover {
  to {
    transform: translate(6px, -1px) skew(0.1deg, -0.6deg) rotateZ(-7deg);
  }
}
@keyframes eye-mover {
  to {
    transform: translate(-7px, -5px) skew(1deg, -0.6deg) rotateZ(7deg);
  }
}
@keyframes shoulder-arm-elbow-left {
  60%, 100% {
    transform: rotate(-8deg);
  }
}
@keyframes forearm-left {
  60%, 100% {
    transform: translateY(-1px) rotate(-5deg);
  }
}
@keyframes hand-left {
  44% {
    transform: translate(-3px, -8px) rotate(0);
  }
  45% {
    transform: translate(-2px, -16px) rotate(6deg);
  }
  52% {
    transform: translate(-3px, -8px) rotate(0);
  }
  100% {
    transform: translate(-3px, -8px) rotate(0);
  }
}
</style>
