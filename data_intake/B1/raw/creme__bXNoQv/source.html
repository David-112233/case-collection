<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  width: 100%;
  height: 100%;
}

body {
  width: 100%;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: #E5E5E5;
}

a {
  text-decoration: none;
}

.title {
  display: flex;
  flex-direction: column;
  margin-bottom: 6vmin;
}
.title > div {
  text-align: center;
}
@keyframes slide-in {
  0% {
    opacity: 0;
    transform: translateY(100px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}
.title .name {
  opacity: 0;
  animation: slide-in 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
}
.title .name a {
  display: block;
  font-family: "Raleway", sans-serif;
  font-size: 6vmin;
  color: #404040;
  transition: transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
.title .name a:hover {
  transform: rotate(-1deg) scale(1.05) translateZ(0);
}
.title .gamejam {
  opacity: 0;
  animation: slide-in 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.15s forwards;
}
.title .gamejam a {
  display: block;
  font-family: "Luckiest Guy", cursive;
  color: #277ECD;
  font-size: 10vmin;
  line-height: 1;
  transition: transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
.title .gamejam a:hover {
  transform: rotate(2deg) scale(1.05) translateZ(0);
}

.bottle {
  position: relative;
  width: 40vmin;
  height: 40vmin;
  background: #E8F4FA;
  border-bottom-right-radius: 50% 15%;
  border-bottom-left-radius: 50% 15%;
  border-top-right-radius: 40% 20%;
  border-top-left-radius: 40% 20%;
  box-shadow: inset 0 -10px 0 0 #bee0f1, inset -10px 0 0 0 #bee0f1;
  opacity: 0;
  animation: slide-in 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.2s forwards;
}
.bottle:before {
  content: "";
  position: absolute;
  margin: auto;
  width: 70%;
  padding-top: 8%;
  border-bottom-right-radius: 50% 20%;
  border-bottom-left-radius: 50% 20%;
  background: #E8F4FA;
  left: 0;
  right: 0;
  top: -1%;
  box-shadow: inset -5px 1px 0 0 #bee0f1, inset 0 -1px 0 0 #fff, inset 0 4px 0 0 #d3eaf5;
}
.bottle:after {
  content: "";
  position: absolute;
  margin: auto;
  width: 80%;
  padding-top: 8%;
  background: #E8F4FA;
  border-radius: 2vmin;
  left: 0;
  right: 0;
  top: -8%;
  box-shadow: inset -5px 0 0 #bee0f1;
}

.controller {
  position: absolute;
  margin: auto;
  left: 0;
  top: 15%;
  right: 0;
  bottom: 0;
  width: 12.6vmin;
  height: 6.3vmin;
  background: #999999;
  mix-blend-mode: overlay;
  animation: controller 8s ease-in-out infinite;
  transform-origin: 50% 50%;
}
@keyframes controller {
  0% {
    transform: translateY(-1vmin) rotate(-8deg);
  }
  50% {
    transform: translateY(3vmin) rotate(8deg);
  }
  100% {
    transform: translateY(-1vmin) rotate(-8deg);
  }
}
.controller:before {
  content: "";
  position: absolute;
  width: 1.4vmin;
  height: 1.4vmin;
  background: #666666;
  right: 1.4vmin;
  top: 1.4vmin;
  box-shadow: 0.7vmin 0 0 #000, -0.7vmin 0 0 #000, 0 0.7vmin 0 #000, 0 -0.7vmin 0 #000, -2.1vmin 2.1vmin 0 #666666, -2.8vmin 2.1vmin 0 #000, -1.4vmin 2.1vmin 0 #000, -2.1vmin 1.4vmin 0 #000, -2.1vmin 2.8vmin 0 #000;
}
.controller:after {
  content: "";
  position: absolute;
  width: 0.7vmin;
  height: 0.7vmin;
  top: -0.7vmin;
  left: 0.7vmin;
  background: #000;
  box-shadow: -0.7vmin 0.7vmin 0 #000, 0.7vmin 0 0 #000, 1.4vmin 0 0 #000, 2.1vmin 0 0 #000, 2.8vmin 0 0 #000, 3.5vmin 0 0 #000, 4.2vmin 0 0 #000, 4.9vmin 0 0 #000, 5.6vmin 0 0 #000, 6.3vmin 0 0 #000, 7vmin 0 0 #000, 7.7vmin 0 0 #000, 8.4vmin 0 0 #000, 9.1vmin 0 0 #000, 9.8vmin 0 0 #000, 10.5vmin 0 0 #000, 11.2vmin 0.7vmin 0 #000, 11.9vmin 1.4vmin 0 #000, 11.9vmin 2.1vmin 0 #000, 11.9vmin 2.8vmin 0 #000, 11.9vmin 3.5vmin 0 #000, 11.9vmin 4.2vmin 0 #000, 11.9vmin 4.9vmin 0 #000, 11.9vmin 5.6vmin 0 #000, 11.2vmin 6.3vmin 0 #000, 10.5vmin 7vmin 0 #000, 9.8vmin 7vmin 0 #000, 9.1vmin 7vmin 0 #000, 8.4vmin 7vmin 0 #000, 7.7vmin 7vmin 0 #000, 7vmin 7vmin 0 #000, 6.3vmin 7vmin 0 #000, 5.6vmin 7vmin 0 #000, 4.9vmin 7vmin 0 #000, 4.2vmin 7vmin 0 #000, 3.5vmin 7vmin 0 #000, 2.8vmin 7vmin 0 #000, 2.1vmin 7vmin 0 #000, 1.4vmin 7vmin 0 #000, 0.7vmin 7vmin 0 #000, 0 7vmin 0 #000, -0.7vmin 6.3vmin 0 #000, -1.4vmin 5.6vmin 0 #000, -1.4vmin 4.9vmin 0 #000, -1.4vmin 4.2vmin 0 #000, -1.4vmin 3.5vmin 0 #000, -1.4vmin 2.8vmin 0 #000, -1.4vmin 2.1vmin 0 #000, -1.4vmin 1.4vmin 0 #000, 4.9vmin -0.7vmin 0 #000, 4.9vmin -1.4vmin 0 #000, 4.9vmin -2.1vmin 0 #000, 5.6vmin -2.8vmin 0 #000, 6.3vmin -2.8vmin 0 #000, 7vmin -2.1vmin 0 #000, 2.1vmin 1.4vmin 0 #000, 2.8vmin 1.4vmin 0 #000, 2.8vmin 2.1vmin 0 #000, 2.8vmin 2.8vmin 0 #000, 3.5vmin 2.8vmin 0 #000, 4.2vmin 2.8vmin 0 #000, 4.2vmin 3.5vmin 0 #000, 4.2vmin 4.2vmin 0 #000, 3.5vmin 4.2vmin 0 #000, 2.8vmin 4.2vmin 0 #000, 2.8vmin 4.9vmin 0 #000, 2.8vmin 5.6vmin 0 #000, 2.1vmin 5.6vmin 0 #000, 1.4vmin 5.6vmin 0 #000, 1.4vmin 4.9vmin 0 #000, 1.4vmin 4.2vmin 0 #000, 0.7vmin 4.2vmin 0 #000, 0 4.2vmin 0 #000, 0 3.5vmin 0 #000, 0 2.8vmin 0 #000, 0.7vmin 2.8vmin 0 #000, 1.4vmin 2.8vmin 0 #000, 1.4vmin 2.1vmin 0 #000, 1.4vmin 1.4vmin 0 #000, 2.1vmin 2.1vmin 0 #666666, 2.1vmin 2.8vmin 0 #666666, 2.1vmin 3.5vmin 0 #666666, 2.8vmin 3.5vmin 0 #666666, 3.5vmin 3.5vmin 0 #666666, 1.4vmin 3.5vmin 0 #666666, 0.7vmin 3.5vmin 0 #666666, 2.1vmin 4.2vmin 0 #666666, 2.1vmin 4.9vmin 0 #666666;
}

.shine {
  position: relative;
  width: 100%;
  height: 100%;
}
.shine svg {
  position: absolute;
  margin: auto;
  width: 85%;
  height: 100%;
  z-index: 2;
  left: 0;
  right: 0;
  opacity: 0.6;
  bottom: -6%;
}

.jam {
  position: absolute;
  margin: auto;
  width: 90%;
  height: 70%;
  background: #EA5356;
  left: 0;
  right: 1%;
  bottom: 7%;
  border-bottom-right-radius: 50% 15%;
  border-bottom-left-radius: 50% 15%;
  border-top-right-radius: 20% 5%;
  border-top-left-radius: 40% 5%;
  overflow: hidden;
  animation: flow 1.4s ease-In-Out infinite alternate;
}
@keyframes flow {
  0% {
    height: 70%;
    border-top-right-radius: 20% 5%;
    border-top-left-radius: 40% 10%;
  }
  100% {
    height: 69%;
    border-top-right-radius: 40% 10%;
    border-top-left-radius: 40% 5%;
  }
}
.jam:before {
  content: "";
  position: absolute;
  margin: auto;
  width: 100%;
  height: 10%;
  left: 0;
  top: 0;
  background: #ed6a6c;
  border-bottom-right-radius: 20% 45%;
  border-bottom-left-radius: 20% 45%;
  animation: flow1 1.4s ease-In-Out infinite alternate;
  z-index: 1;
}
@keyframes flow1 {
  0% {
    height: 8%;
    border-bottom-right-radius: 20% 45%;
    border-bottom-left-radius: 10% 10%;
  }
  100% {
    height: 10%;
    border-bottom-right-radius: 20% 20%;
    border-bottom-left-radius: 60% 60%;
  }
}
.jam:after {
  content: "";
  position: absolute;
  right: 0;
  bottom: 2%;
  width: 98%;
  padding-top: 80%;
  background: #EA5356;
  z-index: 0;
  border-bottom-right-radius: 40% 30%;
  border-bottom-left-radius: 70% 50%;
  transform: rotate(-5deg);
  box-shadow: 0 5vmin 0 0 #e42629, -5vmin 5vmin 0 0 #e42629;
}

.bubble {
  background: #e42629;
  border-radius: 50%;
  position: absolute;
  z-index: 1;
  animation: bubble 1.4s ease-In-Out infinite alternate;
}
@keyframes bubble {
  0% {
    transform: translateY(0);
  }
  100% {
    transform: translateY(0.5vmin);
  }
}
.bubble--1 {
  width: 6%;
  padding-top: 6%;
  right: 5%;
  bottom: 20%;
  box-shadow: -31vmin -2vmin 0 0 #e42629, -28vmin -8vmin 0 0 #e42629, -2vmin -12vmin 0 0 #e42629, -8vmin 4vmin 0 0 #ed6a6c, -30vmin -16vmin 0 0 #ed6a6c;
  animation-direction: alternate-reverse;
}
.bubble--2 {
  width: 3%;
  padding-top: 3%;
  right: 3%;
  bottom: 40%;
  box-shadow: -6.5vmin 7vmin 0 0 #ed6a6c, -1vmin -10vmin 0 0 #ed6a6c, -30vmin 2vmin 0 0 #e42629;
}

.ice {
  position: fixed;
  right: 1rem;
  bottom: 0.5rem;
  width: 80px;
}
.ice svg {
  width: 100%;
  height: 100%;
}
