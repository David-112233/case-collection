<style>
* {
  box-sizing: border-box;
}

html {
  font-size: 100%;
}

body {
  background-color: #fff;
  font-size: 100%;
  position: relative;
  padding: 0;
  margin: 0;
  font-weight: normal;
  line-height: 1.5;
  color: #000;
  min-height: 150vh;
  overflow-y: scroll;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

@keyframes flip {
  0% {
    transform: rotateX(40deg);
  }
  50% {
    transform: rotateX(-90deg);
  }
  100% {
    transform: rotateX(40deg);
  }
}
@keyframes rotate {
  0% {
    transform: rotateX(-25deg) rotateY(0deg) rotateZ(-10deg);
  }
  50% {
    transform: rotateX(50deg) rotateY(180deg) rotateZ(10deg);
  }
  100% {
    transform: rotateX(-25deg) rotateY(360deg) rotateZ(-10deg);
  }
}
@keyframes shine {
  0%, 100% {
    margin-top: -198px;
  }
  50% {
    margin-top: 300px;
  }
}
#scene {
  perspective: 1400px;
  min-height: 100vh;
  z-index: 1;
  position: relative;
  padding-top: 100px;
}

.laptop {
  position: relative;
  display: block;
  margin: 0 auto;
  transform-style: preserve-3d;
  width: 600px;
  outline: 1px solid transparent;
  will-change: transform;
  transform-origin: 50% 100%;
  opacity: 1;
  font-family: "Mukta Malar", sans-serif;
  transform: rotateX(-20deg) rotateY(-13deg) rotateZ(0deg);
  animation: rotate 25s infinite both linear;
}
.laptop .lid {
  width: 600px;
  height: 390px;
  display: block;
  position: relative;
  margin: 0 auto;
  outline: 1px solid transparent;
  border: 1px solid #333;
  border-radius: 19.99998px;
  will-change: transform;
  transform-style: preserve-3d;
  transform-origin: 50% 100%;
  transform: rotateX(10deg);
  transition: transform 5s ease-in-out;
  animation: flip 25s 2.5s infinite both;
}
.laptop .lid .top {
  display: block;
  width: 600px;
  height: 390px;
  position: absolute;
  top: -1px;
  left: -1px;
  pointer-events: none;
  outline: 1px solid transparent;
  border-radius: 19.99998px;
  border: 1px solid #cfcfcf;
  transform: translateZ(-4px);
  box-shadow: 0 0 30px #e5e5e5 inset;
  background: #fff;
  background: linear-gradient(135deg, #fff 0%, #f3f3f3 50%, #ededed 51%, #fff 100%);
  filter: progid:DXImageTransform.Microsoft.gradient( startColorstr="#ffffff", endColorstr="#ffffff",GradientType=1 );
}
.laptop .lid .top #apple {
  display: block;
  position: absolute;
  width: 90px;
  height: 90px;
  top: 50%;
  left: 50%;
  outline: 1px solid transparent;
  transform: translate3d(-50%, -50%, 0) scaleX(-1);
  filter: drop-shadow(0 0 1px #e5e5e5);
}
.laptop .lid .inner {
  pointer-events: none;
  display: block;
  position: relative;
  border-radius: 19.99998px;
  backface-visibility: hidden;
  transform-style: preserve-3d;
  width: 100%;
  height: 100%;
  padding: 21px;
  background-color: #1a1a1a;
}
.laptop .lid .inner .screen {
  display: block;
  width: 100%;
  height: 100%;
  outline: 1px solid transparent;
  background-color: #e5e5e5;
  overflow: hidden;
  border-radius: 2px;
  border: 1px solid #1a1a1a;
}
.laptop .lid .inner .screen img {
  display: block;
  width: 100%;
  max-width: 100%;
}
.laptop .lid .inner .camera {
  display: block;
  position: absolute;
  outline: 1px solid transparent;
  width: 8px;
  height: 8px;
  left: calc(50% - 4px);
  top: 8px;
  backface-visibility: hidden;
  background-color: #333;
  border-radius: 50%;
}
.laptop .lid .facet,
.laptop .lid .corner {

}
.laptop .lid .facet:before, .laptop .lid .facet:after {

}
.laptop .lid .corner.ll {

.laptop .lid .corner.fl {

.laptop .lid .corner.rl {

.laptop .base .bottom {

  height: 36px;

.laptop .base .bottom .rubber-leg:after {

.laptop .base .bottom .rubber-leg.fl {

.laptop .base .bottom .rubber-leg.fr {

.laptop .base .bottom .rubber-leg.bl {

}

.laptop .screw.fmr {
