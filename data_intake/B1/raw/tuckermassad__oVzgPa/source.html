.fish {
  position: absolute;
  height: 725px;
  -webkit-animation: fish .8s ease-in-out infinite alternate;
          animation: fish .8s ease-in-out infinite alternate;
  font-size: 20px;
  -webkit-transform: translateX(-50%) translateY(-70%);
          transform: translateX(-50%) translateY(-70%);
  left: 50%;
  bottom: 10%;
  z-index: 1;
  transform: scale(0.5);
  animation: fish_lefttoright 24400ms  infinite linear;
}
.fish .body,
.fish .fins {
  height: 7em;
  position: absolute;
  -webkit-transform: translateX(-50%) translateY(-50%);
          transform: translateX(-50%) translateY(-50%);
  width: 12em;
}
.fish .body {
  background: #327576;
  border-radius: 50%;
  box-shadow: inset 0.3em -0.5em 0 0 shade(#1c4e4f, 10%);
}
.fish .body:before, .fish .body:after {
  border-radius: 35% / 50%;
  box-shadow: -0.1em 0.05em 0 0 shade(#1c4e4f, 30%), -0.1em 0.05em 0.1em 0 rgba(0, 0, 0, 0.1);
  content: "";
  height: 3em;
  left: 7.5em;
  position: absolute;
  top: 1.7em;
  -webkit-transform: rotate(-6deg);
          transform: rotate(-6deg);
  width: 1em;
}
.fish .body:after {
  height: 2.8em;
  left: 6.7em;
  top: 1.8em;
  -webkit-transform: rotate(-8deg);
          transform: rotate(-8deg);
}
.fish .fins div {
  position: absolute;
  z-index: -1;
}
.fish .fins .top {
  -webkit-animation: finTop 1.2s linear infinite alternate;
          animation: finTop 1.2s linear infinite alternate;
  border-radius: 0 100% 0 0;
  box-shadow: 2.5em 1em 1em 0 rgba(0, 0, 0, 0.1), 3em 0.5em 0 0 #143d56;
  height: 3em;
  left: 0;
  top: -2.25em;
  -webkit-transform: rotateZ(-5deg);
          transform: rotateZ(-5deg);
  -webkit-transform-origin: 7.5em bottom;
          transform-origin: 7.5em bottom;
  width: 5em;
}
.fish .fins .bottom {
  -webkit-animation: finBottom 1.2s linear infinite alternate;
          animation: finBottom 1.2s linear infinite alternate;
  border-radius: 0 0 100%;
  bottom: -1.4em;
  box-shadow: 2em -0.3em 0 0 rgba(0, 0, 0, 0.1), 2em -0.3em 0 0 #143d56;
  height: 2em;
  left: 2em;
  -webkit-transform: rotateZ(5deg);
          transform: rotateZ(5deg);
  -webkit-transform-origin: 5.5em top;
          transform-origin: 5.5em top;
  width: 3.5em;
}
.fish .fins .bottom + .bottom {
  bottom: -.4em;
  box-shadow: 2em -0.5em 0 0 rgba(0, 0, 0, 0.1), 2em -0.5em 0 0 #64a2a3;
  height: 1.5em;
  left: 0;
  -webkit-transform: rotateZ(10deg);
          transform: rotateZ(10deg);
  width: 2.5em;
}
.fish .tail {
  -webkit-animation: tailSlow 1.2s ease-in-out infinite alternate;
          animation: tailSlow 1.2s ease-in-out infinite alternate;
  border-radius: 50%;
  box-shadow: 2.5em 0.5em 1em -1em rgba(0, 0, 0, 0.1), 2.5em 0 0 0 #1e2442, 2.75em -0.15em 0 0.05em #327576, 2.8em 0.1em 0 0.1em #327576;
  height: 9em;
  left: -15.8em;
  position: absolute;
  top: -5.5em;
  -webkit-transform: skewX(7deg);
          transform: skewX(7deg);
  -webkit-transform-origin: 10em center;
          transform-origin: 10em center;
  -webkit-transform-style: preserve-3d;
          transform-style: preserve-3d;
  width: 7em;
}
.fish .side {
  -webkit-animation: sideFinSlow 3.2s linear infinite alternate;
          animation: sideFinSlow 3.2s linear infinite alternate;
  border-bottom: .4em solid transparent;
  border-left: 2em solid #143d56;
  border-top: .4em solid transparent;
  border-radius: .4em;
  box-shadow: inset -1.5em -0.5em 4em 0 rgba(0, 0, 0, 0.7);
  height: 2em;
  left: -2.5em;
  position: absolute;
  top: -1em;
  -webkit-transform: rotate(-8deg);
          transform: rotate(-8deg);
  -webkit-transform-origin: 2em center;
          transform-origin: 2em center;
  -webkit-transform-style: preserve-3d;
          transform-style: preserve-3d;
  width: 0;
}
.fish .side:before {
  background: shade(#143d56, 5%);
  border-radius: .4em 100% 0 .4em;
  box-shadow: -0.2em 0.2em 0.5em 0 rgba(0, 0, 0, 0.1);
  content: "";
  height: 1.1em;
  left: -1.7em;
  position: absolute;
  -webkit-transform: skewY(-10deg);
          transform: skewY(-10deg);
  width: 1.7em;
}
.fish .side:after {
  background: #143d56;
  border-radius: 50%;
  content: "";
  height: 1.2em;
  left: -.3em;
  position: absolute;
  width: .6em;
}
.fish .eye {
  -webkit-animation: eye 4s linear infinite;
          animation: eye 4s linear infinite;
  background: black;
  border-radius: 50%;
  box-shadow: inset .35em 0 0 .5em white;
  height: 2em;
  left: 2.5em;
  position: absolute;
  top: -1.5em;

.fish .bubbles .bubble {

  height: 2em;
  left: 5.8em;
  position: absolute;
  top: 0em;
  -webkit-transform: scale(0);
          transform: scale(0);
  -webkit-transform-origin: left center;
          transform-origin: left center;

.fish .bubbles .bubble:nth-child(4n-1) {
  -webkit-animation-name: bubbleTwo;
