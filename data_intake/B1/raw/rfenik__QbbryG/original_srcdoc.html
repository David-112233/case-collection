<style>
@import url(https://fonts.googleapis.com/css?family=Ubuntu);
body {
  background-image: -ms-radial-gradient(center, circle farthest-corner, #FFFFFF 50%, #DBDBDB 100%);
  background-image: -moz-radial-gradient(center, circle farthest-corner, #FFFFFF 50%, #DBDBDB 100%);
  background-image: -o-radial-gradient(center, circle farthest-corner, #FFFFFF 50%, #DBDBDB 100%);
  background-image: -webkit-gradient(radial, center center, 0, center center, 505, color-stop(.5, #FFFFFF), color-stop(1, #DBDBDB));
  background-image: -webkit-radial-gradient(center, circle farthest-corner, #FFFFFF 50%, #DBDBDB 100%);
  background-image: radial-gradient(circle farthest-corner at center, #FFFFFF 50%, #DBDBDB 100%);
  font-family: Ubuntu;
}

#layersContainer {
  position: relative;
}

.layer {
  position: absolute;
  left: 0px;
  top: 0px;
  width: 300px;
  height:140px;
  background-color: #fff;
  font-size: 100px;
  text-align:center; 
}

.mask {
  z-index: 9;
  background-color: rgba(0, 0, 0, 0);
  width: 100%;
  height: 100%;
  position: fixed;
  top: 0px;
  left: 0px;
  visibility: hidden;
}

#Layer-1 {
  z-index: 2;
}

#Layer-2 {
  z-index: 3;
}

#Layer-3 {
  z-index: 4;
}

#Layer-4 {
  z-index: 5;
}

#Layer-5 {
  z-index: 6;
}

#Layer-6 {
  z-index: 7;
}

#Layer-7 {
  z-index: 8;
}
</style>

  <script>
  window.console = window.console || function(t) {};
</script>

  
  
</head>

<body translate="no">
  Pick a card! 
<div id="layersContainer">
  <div class="layer" id="Layer-7">
    ♠
  </div>

  <div class="layer" id="Layer-6">
    ♣
  </div>

  <div class="layer" id="Layer-5">
    ♦
  </div>


  <div class="layer" id="Layer-4">
    ♥
  </div>


  <div class="layer" id="Layer-3">
    $
  </div>

  <div class="layer" id="Layer-2">
    ☻
  </div>


  <div class="layer" id="Layer-1">
    ♫
  </div>

</div>
  <script src='//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/gsap/1.15.0/TweenMax.min.js'></script>
    <script id="rendered-js" >
$(document).ready(function () {
  var layer = $(".layer");
  layersContainer = $("#layersContainer");
  heightBetweenLayers = 15;
  rotationYstart = 15;
  rotationXstart = 70;
  rotationZstart = 0;
  rotationZmid = 3;
  rotationXend = 0;
  rotationYend = 0;
  rotationZend = 0;
  startPerspective = 800;
  startTransformPerspective = 800;
  endPerspective = 1500;
  endTransformPerspective = 800;
  startXPercent = 20;
  startYPercent = 0;
  endXPercent = 60;
  endYPercent = 60;
  cardFlipDuration = .75;

  TweenMax.set(layer, {
    css: {
      transformPerspective: startTransformPerspective,
      perspective: startPerspective,
      transformStyle: "preserve-3d",
      rotationY: rotationYstart,
      rotationX: rotationXstart,
      rotationZ: rotationZend,
      boxShadow: "0px 12px 15px 0px #666",
      xPercent: startXPercent,
      yPercent: startYPercent },

    ease: Back.easeInOut });


  $(layer).each(function (index) {
    stag_y = index * heightBetweenLayers;
    TweenMax.set(this, {
      y: stag_y,
      className: "+=inactive" });


  });

  var tl = new TimelineMax({
    delay: 0.25 }).

  staggerFrom(layer, 1, {
    autoAlpha: 0,
    y: "-=80",
    ease: Back.easeInOut },
  .15).
  addPause("start").

  to("#Layer-7", cardFlipDuration, {
    xPercent: endXPercent,
    yPercent: endYPercent,
    rotationZ: -rotationZmid,
    transformPerspective: startTransformPerspective,
    perspective: startPerspective }).

  set("#Layer-7", {
    zIndex: 10 }).

  to("#Layer-7", cardFlipDuration, {
    xPercent: startXPercent,
    yPercent: startYPercent,
    rotationY: rotationYend,
    rotationZ: rotationZend,
    rotationX: rotationXend,
    transformPerspective: endTransformPerspective,
    perspective: endPerspective }).

  addPause("Layer7_open").
  to("#Layer-7", cardFlipDuration, {
    rotationY: rotationYstart,
    rotationX: rotationXstart,
    zIndex: 8 }).

  addPause("Layer7").

  to("#Layer-6", cardFlipDuration, {
    xPercent: endXPercent,
    yPercent: endYPercent,
    rotationZ: -rotationZmid,
    transformPerspective: endPerspective,
    perspective: endPerspective }).

  set("#Layer-6", {
    zIndex: 10 }).

  to("#Layer-6", cardFlipDuration, {
    xPercent: startXPercent,
    yPercent: startYPercent,
    rotationY: rotationYend,
    rotationZ: rotationZend,
    rotationX: rotationXend,
    transformPerspective: startPerspective,
    perspective: startPerspective }).

  addPause("Layer6_open").
  to("#Layer-6", cardFlipDuration, {
    rotationY: rotationYstart,
    rotationX: rotationXstart,
    zIndex: 7 }).

  addPause("Layer6").

  to("#Layer-5", cardFlipDuration, {
    xPercent: endXPercent,
    yPercent: endYPercent,
    rotationZ: -rotationZmid,
    transformPerspective: endPerspective,
    perspective: endPerspective }).

  set("#Layer-5", {
    zIndex: 10 }).

  to("#Layer-5", cardFlipDuration, {
    xPercent: startXPercent,
    yPercent: startYPercent,
    rotationY: rotationYend,
    rotationZ: rotationZend,
    rotationX: rotationXend,
    transformPerspective: startPerspective,
    perspective: startPerspective }).

  addPause("Layer5_open").
  to("#Layer-5", cardFlipDuration, {
    rotationY: rotationYstart,
    rotationX: rotationXstart,
    zIndex: 6 }).

  addPause("Layer5").

  to("#Layer-4", cardFlipDuration, {
    xPercent: endXPercent,
    yPercent: endYPercent,
    rotationZ: -rotationZmid,
    transformPerspective: endPerspective,
    perspective: endPerspective }).

  set("#Layer-4", {
    zIndex: 10 }).

  to("#Layer-4", cardFlipDuration, {
    xPercent: startXPercent,
    yPercent: startYPercent,
    rotationY: rotationYend,
    rotationZ: rotationZend,
    rotationX: rotationXend,
    transformPerspective: startPerspective,
    perspective: startPerspective }).

  addPause("Layer4_open").
  to("#Layer-4", cardFlipDuration, {
    rotationY: rotationYstart,
    rotationX: rotationXstart,
    zIndex: 5 }).

  addPause("Layer4").

  to("#Layer-3", cardFlipDuration, {
    xPercent: endXPercent,
    yPercent: endYPercent,
    rotationZ: -rotationZmid,
    transformPerspective: endPerspective,
    perspective: endPerspective }).

  set("#Layer-3", {
    zIndex: 10 }).

  to("#Layer-3", cardFlipDuration, {
    xPercent: startXPercent,
    yPercent: startYPercent,
    rotationY: rotationYend,
    rotationZ: rotationZend,
    rotationX: rotationXend,
    transformPerspective: startPerspective,
    perspective: startPerspective }).

  addPause("Layer3_open").
  to("#Layer-3", cardFlipDuration, {
    rotationY: rotationYstart,
    rotationX: rotationXstart,
    zIndex: 4 }).

  addPause("Layer3").

  to("#Layer-2", cardFlipDuration, {
    xPercent: endXPercent,
    yPercent: endYPercent,
    rotationZ: -rotationZmid,
    transformPerspective: endPerspective,
    perspective: endPerspective }).

  set("#Layer-2", {
    zIndex: 10 }).

  to("#Layer-2", cardFlipDuration, {
    xPercent: startXPercent,
    yPercent: startYPercent,
    rotationY: rotationYend,
    rotationZ: rotationZend,
    rotationX: rotationXend,
    transformPerspective: startPerspective,
    perspective: startPerspective }).

  addPause("Layer2_open").
  to("#Layer-2", cardFlipDuration, {
    rotationY: rotationYstart,
    rotationX: rotationXstart,
    zIndex: 3 }).

  addPause("Layer2").

  to("#Layer-1", cardFlipDuration, {
    xPercent: endXPercent,
    yPercent: endYPercent,
    rotationZ: -rotationZmid,
    transformPerspective: endPerspective,
    perspective: endPerspective }).

  set("#Layer-1", {
    zIndex: 10 }).

  to("#Layer-1", cardFlipDuration, {
    xPercent: startXPercent,
    yPercent: startYPercent,
    rotationY: rotationYend,
    rotationZ: rotationZend,
    rotationX: rotationXend,
    transformPerspective: startPerspective,
    perspective: startPerspective }).

  addPause("Layer1_open").
  to("#Layer-1", cardFlipDuration, {
    rotationY: rotationYstart,
    rotationX: rotationXstart,
    zIndex: 2 }).

  addPause("Layer1");

  $("#Layer-7").click(function () {
    if ($(this).is(".inactive")) {
      TweenMax.set(this, {
        className: "-=inactive" });

      tl.tweenFromTo("start", "Layer7_open");
    } else {
      tl.reverse();
      TweenMax.set(this, {
        className: "+=inactive" });

    }
  });

  $("#Layer-6").click(function () {
    if ($(this).is(".inactive")) {
      tl.seek("Layer7").play();
      TweenMax.set(this, {
        className: "-=inactive" });

    } else {
      tl.reverse();
      TweenMax.set(this, {
        className: "+=inactive" });

    }
  });

  $("#Layer-5").click(function () {
    if ($(this).is(".inactive")) {
      tl.seek("Layer6").play();
      TweenMax.set(this, {
        className: "-=inactive" });

    } else {
      tl.reverse();
      TweenMax.set(this, {
        className: "+=inactive" });

    }
  });

  $("#Layer-4").click(function () {
    if ($(this).is(".inactive")) {
      tl.seek("Layer5").play();
      TweenMax.set(this, {
        className: "-=inactive" });

    } else {
      tl.reverse();
      TweenMax.set(this, {
        className: "+=inactive" });

    }
  });

  $("#Layer-3").click(function () {
    if ($(this).is(".inactive")) {
      tl.seek("Layer4").play();
      TweenMax.set(this, {
        className: "-=inactive" });

    } else {
      tl.reverse();
      TweenMax.set(this, {
        className: "+=inactive" });

    }
  });

  $("#Layer-2").click(function () {
    if ($(this).is(".inactive")) {
      tl.seek("Layer3").play();
      TweenMax.set(this, {
        className: "-=inactive" });

    } else {
      tl.reverse();
      TweenMax.set(this, {
        className: "+=inactive" });

    }
  });

  $("#Layer-1").click(function () {
    if ($(this).is(".inactive")) {
      tl.seek("Layer2").play();
      TweenMax.set(this, {
        className: "-=inactive" });

    } else {
      tl.reverse();
      TweenMax.set(this, {
        className: "+=inactive" });

    }
  });

});

  </script>

  
</body>
