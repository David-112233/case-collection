  <title>Stairs Optical Illusion</title>

<style>
* {
	transform-style: preserve-3d;
}

body {
	margin: 0;
	height: 100vh;
	background: linear-gradient(147deg, #000000 0%, #2c3e50 74%);
	display: flex;
	justify-content: center;
	align-items: center;
}

.content {
	width: 90vmin;
	height: 60vmin;
	margin: 0 auto;
	justify-content: center;
	align-items: center;
	display: inline-flex;
	flex-wrap: wrap;
	align-content: center;
	perspective: 100vmin;
	perspective-origin: center;
	filter: drop-shadow(10vmin 22vmin 1.5vmin #0005);
	top: 0;
}

.stair {
	transform: rotateX(-40deg) rotateY(-49deg);
	transition: all 2s ease-in-out 0s;
	animation: move 2s ease-in-out 0.2s 2 alternate;
	position: relative;
	top: -10vmin;
}

@keyframes move {
	0% {
		transform: rotateX(-40deg) rotateY(-49deg);
	}
	100% {
		transform: rotateX(-44deg) rotateY(-110deg);
	}
}

.content:hover .stair {
	transform: rotateX(-44deg) rotateY(-110deg);
	transition: all 2s ease-in-out 0s;
}

.cube {
	height: calc(var(--height) * 1vmin);
	width: calc(var(--width) * 1vmin);
	--hue: 265;
	position: absolute;
}

.side {
	position: absolute;
	top: 50%;
	left: 50%;
	height: 100%;
	width: 100%;
}

.side:nth-of-type(1) {
	transform: translate3d(-50%, -50%, calc(var(--depth) * 0.5vmin));
	background: hsl(var(--hue), 60%, 50%);
}

.side:nth-of-type(2) {
	transform: translate3d(-50%, -50%, calc(var(--depth) * -0.5vmin))
		rotateY(180deg);
	background: hsl(var(--hue), 60%, 35%);
}

.side:nth-of-type(3) {
	width: calc(var(--depth) * 1vmin);
	transform: translate(-50%, -50%) rotateY(90deg)
		translate3d(0, 0, calc(var(--width) * 0.5vmin));
	background: hsl(var(--hue), 60%, 40%);
}

.side:nth-of-type(4) {
	width: calc(var(--depth) * 1vmin);
	transform: translate(-50%, -50%) rotateY(-90deg)
		translate3d(0, 0, calc(var(--width) * 0.5vmin));
	background: hsl(var(--hue), 60%, 60%);
}

.side:nth-of-type(5) {
	height: calc(var(--depth) * 1vmin);
	transform: translate(-50%, -50%) rotateX(90deg)
		translate3d(0, 0, calc(var(--height) * 0.5vmin));
	background: hsl(var(--hue), 60%, 70%);
}

.side:nth-of-type(6) {
	height: calc(var(--depth) * 1vmin);
	transform: translate(-50%, -50%) rotateX(-90deg)
		translate3d(0, 0, calc(var(--height) * 0.5vmin));
	background: hsl(var(--hue), 60%, 20%);
}

.cube:nth-of-type(1) .side:nth-of-type(2),
.cube:nth-of-type(3) .side:nth-of-type(1),
.cube:nth-of-type(3) .side:nth-of-type(2),
.cube:nth-of-type(4) .side:nth-of-type(1),
.cube:nth-of-type(4) .side:nth-of-type(2),
.cube:nth-of-type(5) .side:nth-of-type(2) {
	background: transparent;
}

.cube:nth-child(3) .side:nth-of-type(5):before,
.cube:nth-child(3) .side:nth-of-type(5):after,
.cube:nth-child(4) .side:nth-of-type(5):after {
	content: "";
	background: #ab85e0;
	width: 100%;
	height: 10px;
	position: absolute;
	top: -5px;
}

.cube:nth-child(3) .side:nth-of-type(5):after,
.cube:nth-child(4) .side:nth-of-type(5):after {
	top: calc(100% - 5px);
}

.cube:nth-child(2) .side:nth-of-type(5):after {
	content: "";
	background: #ab85e0;
	width: 10vmin;
	height: 10px;
	position: absolute;
	top: 95%;
	z-index: 2;
	right: 0;
}

.front {
	--height: 2;
	--width: 60;
	--depth: 10;
	transform: translate3d(-25vmin, 0, 25vmin);
}

.back {
	--height: 2;
	--width: 60;
	--depth: 10;
	transform: translate3d(-25vmin, 0vmin, -25vmin);
}

.left {
	--height: 2;
	--width: 10;
	--depth: 40;
	transform: translate3d(-25vmin, 0vmin, 0vmin);
}

.right {
	--height: 2;
	--width: 10;
	--depth: 40;
	transform: translate3d(25vmin, 0vmin, 0vmin);
}

.step1 {
	--height: 2;
	--width: 10;
	--depth: 4.25;
	--hue: 265;
	transform: translate3d(0vmin, 0vmin, -18vmin);
}

.step2 {
	--height: 2;
	--width: 10;
	--depth: 4;
	--hue: 265;
	transform: translate3d(0vmin, 2vmin, -14vmin);
}

.step3 {
	--height: 2;
	--width: 10;
	--depth: 4;
	--hue: 265;
	transform: translate3d(0vmin, 4vmin, -10vmin);
}

.step4 {
	--height: 2;
	--width: 10;
	--depth: 4;
	--hue: 265;
	transform: translate3d(0vmin, 6vmin, -6vmin);
}

.step5 {
	--height: 2;
	--width: 10;
	--depth: 4;
	--hue: 265;
	transform: translate3d(0vmin, 8vmin, -2vmin);
}

.step6 {
	--height: 2;
	--width: 10;
	--depth: 4;
	--hue: 265;
	transform: translate3d(0vmin, 10vmin, 2vmin);
}

.step7 {
	--height: 2;
	--width: 10;
	--depth: 4;
	--hue: 265;
	transform: translate3d(0vmin, 12vmin, 6vmin);
}

.step8 {
	--height: 2;
	--width: 10;
	--depth: 4;
	--hue: 265;
	transform: translate3d(0vmin, 14vmin, 10vmin);
}
</style>

  </head>

		<div class="cube step4">

		<div class="cube step8">
