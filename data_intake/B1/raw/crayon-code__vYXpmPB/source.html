<style>
@import url("https://fonts.googleapis.com/css2?family=Lato:wght@100;300;400&display=swap");
body {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  flex-direction: column;
  min-height: 100vh;
  margin: 0;
  font-family: "Lato";
  font-weight: 300;
  font-size: 24px;
  background: #2b2b2b;
  background-position: center center;
  background-size: 200%;
  background-image: url(https://images.unsplash.com/photo-1457062673746-3c8d0b60aa44?ixid=MXwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHw%3D&ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80);
  background-blend-mode: multiply;
}

h2, small {
  display: block;
  color: white;
  font-weight: 300;
  margin-right: 2rem;
}

.samples {
  display: flex;
  flex-wrap: wrap;
  max-width: 480px;
}

.sample {
  border: 1px solid rgba(255, 255, 255, 0.2);
  width: 128px;
  height: 96px;
  position: relative;
  backdrop-filter: blur(4px);
  background: rgba(255, 255, 255, 0.2);
  box-shadow: 0px 0px 8px 2px rgba(0, 0, 0, 0.2);
  margin-right: 1rem;
  margin-bottom: 1rem;
}

.ribbon {
  position: absolute;
  right: var(--right, 10px);
  top: var(--top, -3px);
  filter: drop-shadow(2px 3px 2px rgba(0, 0, 0, 0.5));
}
.ribbon > .content {
  color: white;
  font-size: 1.25rem;
  text-align: center;
  font-weight: 400;
  background: var(--color, #2ca7d8) linear-gradient(45deg, rgba(0, 0, 0, 0) 0%, rgba(255, 255, 255, 0.25) 100%);
  padding: 8px 2px 4px;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 100%, 0 100%);
  width: var(--width, 32px);
  min-height: var(--height, 36px);
  transition: clip-path 1s, padding 1s, background 1s;
}
.ribbon.slant-up > .content {
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), 50% calc(100% - 6px), 0 100%);
}
.ribbon.slant-down > .content {
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - 6px), 0 calc(100% - 12px));
}
.ribbon.down > .content {
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), 50% 100%, 0 calc(100% - 8px));
}
.ribbon.up > .content {
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - 8px), 0 100%);
}
.ribbon.check > .content {
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), 40% 100%, 0 calc(100% - 12px));
}
</style>

  </head>

<small>Click the ribbons!</small>
  
    <script id="rendered-js" >
const ribbons = document.querySelectorAll(".ribbon");
ribbons.forEach(ribbon => {
  ribbon.addEventListener('click', e => {
    let target = e.target;
    while (target !== ribbon) {if (window.CP.shouldStopExecution(0)) break;
      target = target.parentNode;
    }window.CP.exitedLoop(0);
    const types = ['', 'slant-up', 'slant-down', 'up', 'down', 'check'];
    const type = types[Math.floor(Math.random() * types.length)];
    target.className = `ribbon ${type}`;
  });
});

  </script>
