  <title>css3 ribbon with animation</title>

    <link rel="canonical" href="https://codepen.io/greynor/pen/WNLPJE">
  
  
  
  
<style>
body {
  background: #def;
  font-family: Verdana;
}
.box {
  position: absolute;
  left: 50%;
  top: 50%;
  height: 200px;
  width: 400px;
  transform: translate(-50%, -50%);
  background: #eee;
  perspective: 50px;
  box-shadow: 0 0 4px rgba(0,0,0,.1);
}
.ribbon {
  position: absolute;
  right: 0px;
  bottom: 10px;
  height: 60px;
  transform-style: preserve-3d;
}
.ribbon i {
  position: absolute;
  display: block;
  bottom: 0px;
  transition: all .2s ease-in;
}
i.back {
  background: #b8153d;
  width: 0px;
  height: 40px;
  left: 100%;
  transform: skewY(-30deg);
  transform-origin: 0% 100%;
  transition-delay: .45s;
}
i.front {
  width: 0px;
  background: #db0a41;
  height: 40px;
  right: -20px;
  bottom: 11px;
  transition-delay: .35s;
}
i.fold {
  background: #b8153d;
  right: 180px;
  height: 40px;
  width: 0px;
  bottom: 11px;
  transform: rotateY(-45deg) skewY(-40deg);
  transform-origin: 100% 0%;
  transition-delay: .15s;
}
i.foldback {
  width: 0px;
  background: #db0a41;
  height: 29px;
  right: 200px;
  bottom: 16px;
  transition-delay: 0s;
}
i span {
  position: absolute;
  opacity: 0;
  color: #fff;
  text-align: center;
  padding: 7px 12px;
  font-size: 1.3em;
  transition: all .4s ease-out;
  font-style: normal;
}


.box:hover i.back { width: 20px; transition-delay: 0s; }
.box:hover i.front { width: 200px; transition-delay: .15s;}
.box:hover i.fold { width: 30px; transition-delay: .3s;}
.box:hover i.foldback { width: 10px; transition-delay: .45s;}
.box:hover i span { opacity: 1; transition-delay: .7s; }
</style>

  </head>

<body translate="no">
  Hover the box
<div class="box">
  <div class="ribbon">
    <i class="back"></i>
    <i class="front">
      <span>HELLO WORLD</span>
    </i>    
    <i class="foldback"></i>
    <i class="fold"></i>
  </div>
</div>
<div class="box-svg">
  <svg id="ribbon" class="ribbon-svg" width="300" height="60"></svg>
</div>
  <script src='//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script>
  
  
</body>
