body

  background-color: #000;
}
.iw-logo {
  width: 100%;
  /*border: 1px solid #ccc;*/
 }
.gears{
  width: 30%;
  float: left;
}
.text{
  width: 70%;
display:inline-block;
}
.gearbox  { 
  display: inline-block;
	position: relative;
	width: 100%;
	padding-bottom: 100%; 
	vertical-align: middle; 
	overflow: hidden;
  }

#gear_1
{
    fill: #fff;
display: inline-block;
	position: absolute;
	top: 0;
	left: 40%;
  width: 40%;
  }

#gear_2
{
    fill: #6f7d84;
    display: inline-block;
	position: absolute;
	top: 17%;
	left: 1%;
  width: 50%;
}

#gear_3
{
    fill: #00adee;
    display: inline-block;
	position: absolute;
	top: 39%;
	left: 36%;
  width: 63%;
}

.gears-clockwise 
{
  /* To edit the speed change the */
  animation: spinner 6s linear infinite;
}

@keyframes spinner
{ 
  100% {-webkit-transform: rotate(360deg)}
}

.gears-counter 
{
  /* To edit the speed change the */
  animation: spinner-2 6s linear infinite;
}

@keyframes spinner-2
{ 
  100% {-webkit-transform: rotate(-360deg)}
}
</style>
