.rotate {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 100%;

    animation-name: x-spin;
    animation-duration: var(--ring-rotation);
    animation-iteration-count: infinite;
    animation-timing-function: linear;
    transform-origin: top left;
}

    0% {

    50% {

    }
    100% {

    }
