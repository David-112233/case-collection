@charset "UTF-8";
body {
  margin: 0;
  height: 100vh;
  display: grid;
  background: #000;
  font-size: 0.7vh;
}

:where(body *) {
  transform-style: preserve-3d;
}

.strip, .strip div {
  position: absolute;
}

.container {
  height: 100em;
  width: 90vw;
  place-self: center;
  display: flex;
  justify-content: center;
  position: relative;
}

.scene {
  position: relative;
  display: grid;
  perspective: 100em;
}

@property --a {
  syntax: "<angle>";
  inherits: false;
  initial-value: -360deg;
}
.strip {
  height: 100em;
  aspect-ratio: 0.2;
  left: 50%;
  position: relative;
  --angle: calc(var(--a)/var(--segs)*var(--twist));
  /* the angle of each segment is turned in relation to the previous: 360deg/36 = 10deg */
  --rNgon: 20;
  /* radius of the 36gonal cross-section */
  --h: calc(100/var(--segs));
  /*the height of the rectangular top-view of the ribbon's segment*/
  transform-origin: 0 50%;
}
.strip div {
  padding: 1px;
}

@keyframes spin {
  100% {
    rotate: y 360deg;
  }
}
@keyframes twist {
  0% {
    --a: -360deg;
  }
  100% {
    --a: 360deg;
  }
}
.flat {
  width: calc(1em*var(--rNgon));
  height: calc(1em*var(--h));
  background: hsl(calc(var(--step)*var(--angle)), 100%, 50%);
  bottom: calc(var(--h)*1%*var(--step));
  clip-path: polygon(0 0, 0 100%, 100% 100%);
  transform-origin: 0 0;
  rotate: y calc(var(--step)*var(--angle));
}

.angled {
  --diagAngle: calc(atan(var(--h)/var(--rNgon)));
  --diagonal: calc(var(--rNgon)/cos(var(--diagAngle)));
  /* 50/cos(atan(25/50)) = 50/0.894427191 = 55.9016994375; */
  --a36gon: calc(2*var(--rNgon)*sin(var(--angle)/2));
  /* the length of the 36gon's each edge: 2*50*sin(5deg) = 100*.08715574274 = 8.715574274 */
  --topY: calc(var(--rNgon)*sin(var(--angle)));
  /* 50*sin(10deg) = 50*0.17364817766 = 8.68240888335 */
  --topX: calc(var(--rNgon)*(1 - cos(var(--angle))));
  /* the distance of the top right corner from the closest vertical axis: 50 - 49.2403876506 = 0.7596123494 */
  --rhomba: calc(var(--h)/cos(atan(var(--topX)/var(--h))));
  /* *25/cos(atan(0.7596123494/25)) = 25/cos(1.74036782) = 25.0115375561*/
  --aAngled: calc(var(--rhomba)/cos(atan(var(--topY)/var(--rhomba))));
  /* 25.0115375561/cos(atan(8.68240888335/25.0115375561)) = 26.4756725115 */
  --angleA: calc(acos(
    (var(--rNgon)*var(--rNgon) + var(--diagonal)*var(--diagonal) - var(--aAngled)*var(--aAngled))
    /
    (2*var(--rNgon)*var(--diagonal))
  ));
  /*acos((b^2 + c^2 - a^2 )/ 2*b*c = (50^2 + 55.9016994375^2 - 26.4756725076^2) / (2 * 50 * 55.9016994375)) = acos(0.88083883223) = 28.2562826deg */
  --insideH: calc(var(--rNgon)*sin(var(--angleA)));
  /* 50*sin(28.2562826deg) = 23.6708128101deg */
  --insideRatio: calc((var(--rNgon)*cos(var(--angleA)))/var(--diagonal));
  /* 44.0419416218/55.9016994375 = 0.78784620261 */
  --inclinAngle: calc(asin(var(--topY)/var(--insideH)));
  /* asin(8.68240888335/23.6708128101) = 21.5182821 deg */
  width: calc(var(--diagonal)*1em);
  height: calc(var(--insideH)*1em);
  background: hsl(calc((.5 + var(--step))*var(--angle)), 100%, 50%);
  clip-path: polygon(0 100%, calc(var(--insideRatio)*100%) 0, 100% 100%);
  transform-origin: 0 100%;
  transform: rotateY(calc(var(--step)*var(--angle))) rotate(var(--diagAngle)) rotateX(var(--inclinAngle));
  bottom: calc(var(--h)*1em*(var(--step) + 1));
}

:nth-child(2 of .flat), :nth-child(2 of .angled) {

nav > div {

  justify-items: center;

  letter-spacing: 2px;
}
nav > div::after {
  content: "";

  inset: 0;
  background: linear-gradient(90deg, fuchsia, #08f, yellow, red, yellow, cyan, fuchsia);
  background-size: 200% 100%;
  transition: background-position-x 0.5s ease-in-out;
  background-position-x: 0%;
  mix-blend-mode: multiply;
  pointer-events: none;

nav > div * {
  font-weight: bolder;
  color: white;
  transform-style: flat;

nav, .scene {
  position: relative;
  inset-block: 0;
  width: 40vmin;

.multiChoice {
  justify-self: center;
  display: grid;
  grid-template-columns: 2ch 5ch 2ch;
  text-align: center;
  margin-block: 0.5em;

#anims {
  perspective: 5em;
}
#anims label {
  margin-block: 0.25em;
  text-transform: uppercase;
}
#anims label span {
  display: inline-block;
  transition: all 0.5s ease-in-out;
  transition-delay: calc(.05s*var(--sStep));
  rotate: var(--axis) 180deg;
}
#anims label span:nth-child(1) {
  --sStep: 0;
}
#anims label span:nth-child(2) {
  --sStep: 1;
}
#anims label span:nth-child(3) {
  --sStep: 2;
}
#anims label span:nth-child(4) {
  --sStep: 3;
}
#anims label span:nth-child(5) {
  --sStep: 4;
}
#anims label:nth-child(1):hover span {
  --axis: x;
}
#anims label:nth-child(2):hover span {
  --axis: y;
}

.prev label:after {
  content: "◀";
}

.next label:after {
  content: "▶";
}

#spin:checked ~ .container .strip {
  --a: 360deg;
  animation: spin 6s linear infinite;
}

#twist:checked ~ .container .strip {
  animation: twist calc(12s*var(--twist)) ease-in-out alternate infinite;
}

.playBtn {
  width: 100px;
  aspect-ratio: 1;
}
.playBtn::after {
  content: "";
  position: absolute;
  transition: all 0.5s ease-in-out;
  inset: 0;
  background-image: radial-gradient(at 100% 100%, red, yellow, #08f, fuchsia);
  pointer-events: none;
  clip-path: path("M 37.5 100 C 25,100 12.5,100 0,100 0,66.66 0,33.33 0,0 H 37.5 C 37.5,33.33 37.5,66.66 37.5,100 45.88,100 54.16,100 100,100 100,66.66 100,33.33 100,0 H 62.5 C 62.5,33.33 62.5,66.66 62.5,100 87.5,100 75,100 62.5,100 z");
}
.playBtn:hover::after {
  clip-path: path("M 37.5 100 C 25,100 12.5,100 0,100 0,66.66 37.5,33.33 37.5,0 H 0 C 0,33.33 37.5,66.66 37.5,100 45.88,100 54.16,100 62.5,100 62.5,66.66 100,33.33 100,0 H 62.5 C 62.5,33.33 100,66.66 100,100 87.5,100 75,100 62.5,100 z");
}

#playPause:checked ~ .container nav > div:after {
  background-position-x: 100%;
}
#playPause:checked ~ .container .strip {
  animation-play-state: paused;
}
#playPause:checked ~ .container .playBtn::after {
  rotate: 90deg;
  clip-path: path("M 50 100 C 33.33,100 16.66,100 0,100 16.66,66.66 33.33,33.33 50,0 H 50 C 50,0 50,0 50,100 50,100 50,100 50,100 50,66.66 50,33.33 50,0 H 50 C 66.66,33.33 83.33,66.66 100,100 83.33,100 66.66,100 50,100 z");

}

}

@media (orientation: portrait) {
