<style>
body {
  background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  font-family: "Lato", sans-serif;
  align-items: center;
  perspective: 1000px;
}

div {
  transform-style: preserve-3d;
  backface-visibility: hidden;
}

.input {
  display: none;
}
.input.wireframe:checked + .wireframe {
  background: rgba(255, 255, 255, 0.6);
}
.input.wireframe:checked ~ .diorama .box_panel {
  display: block !important;
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.input.camera_h:checked + .camera_h {
  background: rgba(255, 255, 255, 0.6);
}
.input.camera_h:checked ~ .diorama .diorama_z {
  animation: cameraZ 5000ms ease-in-out infinite alternate;
}
.input.camera_v:checked + .camera_v {
  background: rgba(255, 255, 255, 0.6);
}
.input.camera_v:checked ~ .diorama .diorama_x {
  animation: cameraX 9000ms ease-in-out infinite alternate;
}

.label {
  display: flex;
  justify-content: center;
  align-items: center;
  position: absolute;
  top: 0;
  left: 20px;
  width: 200px;
  height: 40px;
  background: rgba(255, 255, 255, 0.15);
  font-size: 14px;
  border-radius: 5px;
  transition: 400ms;
  cursor: pointer;
}
.label:hover {
  background: rgba(255, 255, 255, 0.3);
}
.label.wireframe {
  transform: translateY(20px);
}
.label.camera_h {
  transform: translateY(70px);
}
.label.camera_v {
  transform: translateY(120px);
}

.diorama {
  position: relative;
  transform: rotateX(60deg) translateZ(140px);
}
.diorama_x {
  transition: 1000ms cubic-bezier(0.17, 0.935, 0.305, 1);
}
.diorama_z {
  transition: 1000ms cubic-bezier(0.17, 0.935, 0.305, 1);
}

.base {
  position: absolute;
  width: 360px;
  height: 360px;
  transform: translate(-50%, -50%) translateZ(-340px);
}
.base_panel {
  position: absolute;
  background: linear-gradient(45deg, #232226 0%, #000000 100%);
}
.base_panel.o-top {
  width: 360px;
  height: 360px;
}
.base_panel.o-top::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.1);
  transform: translateZ(-60px) scale(1.1);
}
.base_panel.o-front {
  bottom: 0;
  width: 400px;
  height: 30px;
  font-size: 7px;
  line-height: 1;
  color: #666;
  text-align: center;
  transform-origin: 0 100%;
  transform: rotateX(-60deg) translateX(-20px) translateY(30px);
  clip-path: polygon(20px 0, 380px 0, 395.2px 30px, 4.8px 30px);
  filter: brightness(80%);
}
.base_panel.o-back {
  width: 400px;
  height: 30px;
  transform-origin: 0 0;
  transform: rotateX(60deg) translateX(-20px) translateY(-30px);
  clip-path: polygon(20px 30px, 380px 30px, 395.2px 0, 4.8px 0);
  filter: brightness(40%);
}
.base_panel.o-left {
  width: 30px;
  height: 400px;
  transform-origin: 0 0;
  transform: rotateY(-60deg) translateX(-30px) translateY(-20px);
  clip-path: polygon(0 4.8px, 30px 20px, 30px 380px, 0 395.2px);
  filter: brightness(60%);
}
.base_panel.o-right {
  right: 0;
  width: 30px;
  height: 400px;
  transform-origin: 100% 100%;
  transform: rotateY(60deg) translateX(30px) translateY(-20px);
  clip-path: polygon(0 20px, 30px 4.8px, 30px 395.2px, 0 380px);
  filter: brightness(60%);
}

@keyframes cameraZ {
  0% {
    transform: rotateZ(-60deg);
  }
  100% {
    transform: rotateZ(60deg);
  }
}
@keyframes cameraX {
  0% {
    transform: rotateX(-20deg);
  }
  100% {
    transform: rotateX(20deg);
  }
}
.layer {
  position: absolute;
  top: -140px;
  left: -140px;
  display: grid;
  grid-template: auto/repeat(7, 1fr);
  width: 280px;
  height: 280px;
}
.layer:nth-child(1) {
  transform: translateZ(-40px);
}
.layer:nth-child(2) {
  transform: translateZ(-80px);
}
.layer:nth-child(3) {
  transform: translateZ(-120px);
}
.layer:nth-child(4) {
  transform: translateZ(-160px);
}
.layer:nth-child(5) {
  transform: translateZ(-200px);
}
.layer:nth-child(6) {
  transform: translateZ(-240px);
}
.layer:nth-child(7) {
  transform: translateZ(-280px);
}
.layer:nth-child(8) {
  transform: translateZ(-320px);
}
.layer:nth-child(9) {
  transform: translateZ(-360px);
}
.layer:nth-child(10) {
  transform: translateZ(-400px);
}

.box {
  position: relative;
}
.box_inner {
  position: relative;
}
.box_panel {
  position: absolute;
  width: 40px;
  height: 40px;
  background: rgba(255, 0, 0, 0.1);
}
.box_panel.o-front {
  filter: brightness(80%);
  transform: rotateX(-90deg) translateZ(20px);
}
.box_panel.o-back {
  filter: brightness(40%);
  transform: rotateX(90deg) translateZ(20px);
}
.box_panel.o-right {
  filter: brightness(60%);
  transform: rotateY(90deg) translateZ(20px);
}
.box_panel.o-left {
  filter: brightness(60%);
  transform: rotateY(-90deg) translateZ(20px);
}
.box_panel.o-top {
  transform: rotateX(0deg) translateZ(20px);
}

.controller {
  position: absolute;
  width: 20%;
  height: 100%;
}
.controller.o-1 {
  left: 0%;
}
.controller.o-1:hover ~ .diorama .diorama_z {
  transform: rotateZ(140deg);
}
.controller.o-2 {
  left: 20%;
}
.controller.o-2:hover ~ .diorama .diorama_z {
  transform: rotateZ(70deg);
}
.controller.o-3 {
  left: 40%;
}
.controller.o-3:hover ~ .diorama .diorama_z {
  transform: rotateZ(0deg);
}
.controller.o-4 {
  left: 60%;
}
.controller.o-4:hover ~ .diorama .diorama_z {
  transform: rotateZ(-70deg);
}
.controller.o-5 {
  left: 80%;
}
.controller.o-5:hover ~ .diorama .diorama_z {
  transform: rotateZ(-140deg);
}
</style>
