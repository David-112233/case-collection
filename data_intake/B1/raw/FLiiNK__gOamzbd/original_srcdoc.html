    <script id="rendered-js" >
const myPics = document.getElementById("app");
const room = document.getElementById("screen");
const room2 = document.getElementById("room");
const browserWall = document.getElementById("browser");


const screenWidth = window.innerWidth;

let isActive = false;
window.addEventListener("mousedown", e => {
  isActive = true;
});


// event.offsetX, event.offsetY gives the (x,y) offset from the edge of the canvas.
var timeout;
window.addEventListener("mousemove", e => {
  if (timeout) {
    window.cancelAnimationFrame(timeout);
  }
  timeout = window.requestAnimationFrame(function () {
    if (!isActive) return;
    x = e.x;
    y = e.y;
    let dir = "none";
    if (x / screenWidth < 0.25) {
      dir = "left";
    } else if (x / screenWidth > 0.75) {
      dir = "right";
    }

    const rotation = x / screenWidth * 720;
    const thing = room.style;
    mouse.deltaX = e.x - (mouse.left || 0);
    mouse.deltaY = e.y - (mouse.top || 0);

    mouse.top = e.y;
    mouse.left = e.x;
    //room.style.transform = "rotatey(" + rotation + "deg) translatez(1800px)";
  });
});

window.addEventListener("mouseleave", e => {
  mouse.deltaX = 0;
});


const keys = {
  KeyW: false };


const position = {
  x: 0,
  y: 0,
  z: 900 };


const camera = {
  x: 0,
  y: 0 };


const mouse = {
  top: 0,
  left: 0,
  deltaX: 0,
  deltaY: 0 };


function run() {
  update();
  draw();
  setTimeout(run, 20);
  clean();
}

function update() {
  camera.y = (camera.y - mouse.deltaY) % 360;
  if (camera.y > 90) {
    camera.y = 90;
  }
  if (camera.y < -90) {
    camera.y = -90;
  }
  camera.x = (camera.x + mouse.deltaX) % 360;

  const speed = keys.ShiftLeft ? 35 : 15;
  const x = Math.sin(camera.x / 56) * speed;
  const z = Math.cos(camera.x / 56) * speed;
  if (keys.ControlLeft) {
    browserWall.style.pointerEvents = 'all';
  } else {
    browserWall.style.pointerEvents = 'none';
  }
  if (keys.KeyW) {
    position.z += z;
    position.x -= x;
  }
  if (keys.KeyS) {
    position.z -= z;
    position.x += x;
  }
  if (keys.KeyD) {
    position.z -= x;
    position.x -= z;
  }
  if (keys.KeyA) {
    position.x += z;
    position.z += x;
  }

  if (position.z > 1750) {
    position.z = 1750;
  }

  if (position.z < 50) {
    position.z = 50;
  }

  if (position.x < -screenWidth / 2 + 50) {
    position.x = -screenWidth / 2 + 50;
  }

  if (position.x > screenWidth / 2 - 50) {
    position.x = screenWidth / 2 - 50;
  }

}

function clean() {
  mouse.deltaX = 0;
  mouse.deltaY = 0;
}

function draw() {
  log(JSON.stringify({ mouse, keys, position }));
  room.style.transform = "translate3d(0px, 0px, 900px) rotateX(" + camera.y + "deg) rotatey(" + camera.x + "deg) rotatez(0deg)";
  room2.style.transform = 'translatez(' + position.z + 'px) translatex(' + position.x + 'px) translatey(-100px)';
}

window.addEventListener("keydown", e => {
  keys[e.code] = true;
});

window.addEventListener("keyup", e => {
  keys[e.code] = false;
});


function log(text) {
  const cons = document.getElementById("console");
  cons.innerHTML = text;
}

run();
