  <title>CSS 3D animation of paper plane around planet</title>

    <link rel="canonical" href="https://codepen.io/manonsmnn/pen/JjLbmge">
  
  
  
  
<style>
.space {
    transform-style: preserve-3d;
    position: relative;
    margin: auto;
    width: 300px;
}
.plane {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
  margin: auto;
  width: 100px;
  height: 100px;
  transform: perspective(1000px) rotateY(-360deg) translateX(-135px) translateY(50%) translateZ(240px);
  transform-style: preserve-3d;
  transition: 0.5s;
  z-index: -1;
  animation: fly 5s ease-out infinite;
  @media (min-width: $medium){
    transform: perspective(1000px) rotateY(-360deg) translateX(-135px) translateY(50%) translateZ(150px);
  }

}

.planet {
    width: 250px;
    height: 250px;
    margin: auto;
    background: transparent linear-gradient(145deg, #5C6AF1 0%, #093AFF 100%) 0% 0% no-repeat;
    border-radius: 50%;
    overflow:hidden;

}

#lside {
  border-top: 50px solid transparent;
  border-right: 100px solid #ececec;
  transform: rotate(-5deg) rotateY(0deg) rotateX(-10deg);
  transform-origin: bottom;
}
#rside {
  margin-top: -50px;
  border-top: 50px solid transparent;
  border-right: 100px solid #ececec;
  transform: rotate(-5deg) rotateY(0deg) rotateX(10deg);
  transform-origin: bottom;
}
#lwing {
  margin-top: -50px;
  border-bottom: 50px solid #f5f5f5;
  border-right: 60px solid transparent;
  border-left: 100px solid transparent;
  transform: rotate(-22deg) rotateX(55deg) rotateY(-10deg) rotateZ(25deg);
  transform-origin: top;
}
#rwing {
  margin-top: -50px;
  border-bottom: 50px solid #f5f5f5;
  border-right: 60px solid transparent;
  border-left: 100px solid transparent;
  transform: rotate(-22deg) rotateX(-55deg) rotateY(10deg) rotateZ(25deg);
  transform-origin: top;
}

@keyframes fly {
    0% {
      transform: perspective(1000px) rotateY(0deg) translateX(-270px) translateY(-50%)
        translateZ(150px);
    }
    100% {
      transform: perspective(1000px) rotateY(-360deg) translateX(-135px) translateY(50%) translateZ(150px);
    }
  }

body {
  background: black;
  height: 100vh;
  width: 100vw;
  display: flex;
  justify-content: center;
  align-items: center;
}
</style>

  </head>

<body translate="no">
  <body>
   <div class="space">
    <div class="planet"></div>
    <div class="plane">
      <div id="lside"></div>
      <div id="rside"></div>
      <div id="lwing"></div>
      <div id="rwing"></div>
    </div>
  </div>
</body>
  
  
  
</body>
