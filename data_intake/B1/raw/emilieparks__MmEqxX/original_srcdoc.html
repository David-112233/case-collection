<style>
body {
  background: #333; 
  font-size: 24px;
  letter-spacing: 0.5px;
  font-family: 'EB Garamond', serif;
  line-height: 1.4;
  padding: 10px;
}
main {
  display: flex;
  width: 1120px;
  margin: 0 auto;
}
 .plant-drawer {
  width: 0;
  background: #DCEDC8;
  margin-right: 0;
  display: flex; 
  flex-wrap: wrap; 
  left: -100%; 
  transition: 2s all;
}
.plant-drawer.open {
  left: 0;
  width: 30%;
  margin-right: 10px;
  padding: 8px;
}
.plant-drawer div {
  text-align: center; 
  width: 40%; 
  background: url(https://s3-us-west-2.amazonaws.com/s.cdpn.io/160607/circle.svg) no-repeat;
  background-position: bottom;
  min-height: 120px;
  position: relative;
  margin: 2px;
}
.plant-drawer.open p{
  z-index: 3;
}
.original{
  opacity: .9;
}
.succulent {
  max-height: 80%;
  max-width: 90%;
  position: absolute;
  bottom: 4px;
  transform: translateX(-50%);
}
.original:hover{
  opacity: 1;
  cursor: grab;
}
.succulent.planted {
  opacity: 1;
  transform: scale(0.6);
}

/*terrarium*/
.terrarium-chooser{
  width: 100%;
  background: #fff;
  position: relative;
  min-height: 100vh;
  padding: 5px;
}
.terrarium-chooser.shrink {
  width: 68%;
}
.terr-wrap {
  position: relative;
  width: 22%;
  height: 22%;
  transition: 1s all;
}
.start .soil,
.start .frame {
  width: 100%;
  opacity: 0.8;
  pointer-events: none;
}
.frame {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 100;
  pointer-events: none;
}
.just-terr{
  display: flex;
  position: relative;
  top: 12%;
}
.terr-wrap:hover {
  width: 33%;
  cursor: grab;
}
.start:hover img {
  opacity: 1;
}
.terrarium-chooser p {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
}
.shrink .terr-wrap {
  width: 100%;
  height: 100%;
  bottom: initial;
  top: 250px;
  left: 50%;
  transform: translateX(-50%) translateY(-50%);
}
.shrink .terr-wrap {
  opacity: 1; 
}
.selected{
  opacity: 1;
}


/*context menu*/
.context-menu{
  position: absolute;
  right: 10px;
  top: 5px;
  display:none;
}
.thumb {
  width: 80px;
  height: 80px;
  position: absolute;
  right: 0;
  opacity:0.4;
}
.btn {
  color: #555555;
}
.glyphicon {
  padding: 3px;
  color: #555555;
}
.glyphicon:hover {
  color: rgba(0,0,0,1);
  cursor: pointer;
}
.button-wrap{
  padding-top: 5px;
  position: absolute;
  bottom: 20px;
  left: 10px;
  display:none;
}
.shrink .context-menu,
.shrink .button-wrap {
  display: block;
}



/*UI styling cause I hated how big the tooltip looked*/
.ui-tooltip, .arrow:after {
    background: black;
  }
.ui-tooltip {
    padding: 10px 20px;
    color: white;
    font: bold 14px "Helvetica Neue", Sans-Serif;
    box-shadow: 0 0 0;
  }
</style>

    <script id="rendered-js" >
$(document).ready(function () {
  $('[data-toggle="tooltip"]').tooltip({ placement: "bottom" });
});
$('.terr-wrap.start').on('click', function () {
  $(this).removeClass('start').addClass('selected');
  $('.terr-wrap.start').fadeOut();
  $('.terrarium-chooser p').fadeOut();
  $('.terrarium-chooser').addClass('shrink');
  $('.plant-drawer').addClass('open');
  $(this).droppable({
    drop: function (e, ui) {
      if ($(ui.helper).clone().hasClass('original')) {
        $(this).append($(ui.helper).clone());
        $(this).find('succulent').removeClass('original').addClass('planted');
        $(this).find('succulent').draggable();
      }
      //also want to delete original
    } });

});
//clean up classes once succulents are dragged into terrarium
$('terr-wrap').on('click', '.succulent', function () {
  $('terr-wrap .succulent').removeClass('edit');
  $(this).addClass('edit');
  var bg = $(this).attr('src');
  $('thumb').css({
    "background": "url(" + bg + ") no-repeat",
    "background-size": "contain",
    "background-position": "50% 50%" });

});
function getScale() {
  var div = $('edit').css('transform');
  var values = div.split('(')[1];
  values = values.split('(')[0];
  values = values.split('(');
  var a = values[0];
  var b = values[1];
  return Math.sqrt(a * a + b * b);
}
$('.plus').on('click', function () {
  $('.edit').css('transform', 'scale(' + (getScale() + 0.05) + ')');
});
//experimenting. may not need this later
$('.original').draggable({
  appendTo: ".terr-wrap.selected",
  helper: "clone" });

$('.planted').draggable();
$('.terr-wrap.selected').droppable({});
//# sourceURL=pen.js
