/* Folding layout 3D · from the Enrichr Library: https://enrichr.dev/elements/folding-layout-3d.html */
html, body { margin: 0; min-height: 100%; background: #0c1e18; }
#enrichr-root { min-height: 100vh; }
#enrichr-root > * { min-height: 100vh; }
/* This demo follows the page scroll, so the page gets room to scroll above and below it. */
.enrichr-scroll-hint { box-sizing: border-box; height: 55vh; margin: 0; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 2rem; color: #fbf8f1; opacity: .75; font: 600 .95rem/1 'Parkinsans', system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase; }
.enrichr-scroll-hint::after { content: "\2193"; margin-left: .5em; }
.enrichr-scroll-end { height: 100vh; }

/* Enrichr Library · https://enrichr.dev */
.ef-fold { overflow: hidden; container-type: inline-size; width: 100%; padding: 1.2rem 1rem 1rem; box-sizing: border-box; font-family: "Helvetica Neue", Arial, "Segoe UI", system-ui, sans-serif; background: var(--ef-fold-bg, #0c1e18); color: #fbf8f1; }
.ef-fold__view { position: relative; height: var(--ef-fh, 20rem); perspective: 1100px; perspective-origin: 50% 40%; }
.ef-fold__stack { position: relative; width: 100%; height: var(--ef-ph, 5rem); transform-style: preserve-3d; will-change: transform; }
.ef-fold__p { position: relative; width: 100%; height: var(--ef-ph, 5rem); transform-origin: 50% 0; transform-style: preserve-3d; will-change: transform; }
.ef-fold__p > .ef-fold__p { position: absolute; left: 0; top: 100%; }
.ef-fold__face { position: absolute; inset: 0; overflow: hidden; backface-visibility: hidden; background: var(--ef-fold-a, #005236); }
.ef-fold__art { position: absolute; left: 0; width: 100%; height: calc(var(--ef-ph, 5rem) * var(--ef-n, 4)); background: radial-gradient(circle at 78% 30%, var(--ef-fold-b, #e6ff55) 0 14%, transparent 14.5%), radial-gradient(circle at 20% 90%, rgba(255, 255, 255, 0.18) 0 28%, transparent 28.5%), linear-gradient(160deg, var(--ef-fold-a, #005236), #0c1e18 95%); }
.ef-fold__word { position: absolute; left: 6%; bottom: 8%; right: 6%; font-size: clamp(2rem, 17cqw, 7rem); font-weight: 900; line-height: 0.9; letter-spacing: -0.04em; text-transform: uppercase; color: #fbf8f1; }
.ef-fold__word em { font-style: normal; color: var(--ef-fold-b, #e6ff55); }

.ef-fold__p[data-up] .ef-fold__shade { background: #fff; }
.ef-fold__ctl { display: flex; align-items: center; gap: 0.8rem; margin-top: 0.9rem; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; }
.ef-fold__rng { flex: 1; min-width: 0; accent-color: var(--ef-fold-b, #e6ff55); height: 1.6rem; }
.ef-fold__rng:focus-visible { outline: 2px solid var(--ef-fold-b, #e6ff55); outline-offset: 3px; }
.ef-fold__sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  "panels": 4,
  "foldAngle": 70,
  "height": 320,
  "word": "Fold out",
  "manual": 0,
  "colorA": "#005236",
