<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fast Dial inside a drawer</title><link rel="stylesheet" href="style.css">
<h2 style="grid-area: title1;">Open/close on hover</h2>
<h2 style="grid-area: title2;">Auto open/close when the other is selected</h2>
<h2 style="grid-area: title3;">Open/close on click, no autoclose</h2>
<div style="grid-area: spacer1; height: 20vh;"></div>
<div style="grid-area: spacer2; height: 10vh;"></div>
<div class="drawers-hover-group" style="grid-area: drawer1">
  <div class="drawer" green>
    <div class="drawer-controller">
      <div class="drawer-faces">
        <div class="face face--front">
          <div class="handler"></div>
          <div class="label">PLANTS</div>
        </div>
        <div class="face face--right"></div>
        <div class="face face--back"></div>
        <div class="face face--left"></div>
        <div class="face face--bottom"></div>
        <div class="drawer-content">
          <div class="items">
            <div class="drawer-content-item">☘️</div>
            <div class="drawer-content-item">🌵</div>
            <div class="drawer-content-item">🌺</div>
            <div class="drawer-content-item">🌻</div>
            </items>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- ---- autoclose ------- -->
<fieldset class="drawers-autoclose-group" style="--width: 120; --height: 56; grid-area: drawer2;">

  </label>

  <label class="drawer" red>
    <input type="radio" name="drawer" />
    <div class="drawer-controller">
      <div class="drawer-faces">
        <div class="face face--front">
          <div class="handler"></div>
          <div class="label">BEARS</div>
        </div>

        <div class="face face--right"></div>
        <div class="face face--back"></div>
        <div class="face face--left"></div>
        <div class="face face--bottom"></div>
        <div class="drawer-content">
          <div class="items">
            <div class="drawer-content-item">🐻</div>

            <div class="drawer-content-item">🐼</div>

            <div class="drawer-content-item">🧸</div>
            </items>
          </div>
        </div>
      </div>
    </div>

  </label>

  <label class="drawer" yellow>
    <input type="radio" name="drawer" checked />
    <div class="drawer-controller">
      <div class="drawer-faces">
        <div class="face face--front">
          <div class="handler"></div>
          <div class="label">FOODS</div>
        </div>

        <div class="face face--right"></div>
        <div class="face face--back"></div>
        <div class="face face--left"></div>
        <div class="face face--bottom"></div>
        <div class="drawer-content">
          <div class="items">
            <div class="drawer-content-item">🥤</div>
            <div class="drawer-content-item">🥗</div>
            <div class="drawer-content-item">🍔</div>
            <div class="drawer-content-item">🍗</div>
            <div class="drawer-content-item">🍟</div>
            </items>
          </div>
        </div>
      </div>
    </div>
  </label>
</fieldset>

<!-- ---- CLICKTOCLOSE ------- -->
<fieldset class="drawers-clicktoclose-group" style="--width: 60; --height: 80; grid-area: drawer3;">

  <label class="drawer">
    <input type="checkbox" name="drawer" checked />
    <div class="drawer-controller">
      <div class="drawer-faces">
        <div class="face face--front">
          <div class="handler"></div>
          <div class="label">EMOJIS</div>
        </div>
        <div class="face face--right"></div>
        <div class="face face--back"></div>
        <div class="face face--left"></div>
        <div class="face face--bottom"></div>
        <div class="drawer-content">
          <div class="items">
            <div class="drawer-content-item">😎</div>
            <div class="drawer-content-item">😇</div>
            <div class="drawer-content-item">🤨</div>
            <div class="drawer-content-item">😱</div>
            </items>
          </div>
        </div>
      </div>
    </div>
  </label>

  <label class="drawer" blue>
    <input type="checkbox" name="drawer" />
    <div class="drawer-controller">
      <div class="drawer-faces">
        <div class="face face--front">
          <div class="handler"></div>
          <div class="label">FRUITS</div>
        </div>

        <div class="face face--right"></div>
        <div class="face face--back"></div>
        <div class="face face--left"></div>
        <div class="face face--bottom"></div>
        <div class="drawer-content">
          <div class="items">
            <div class="drawer-content-item">🍍</div>
            <div class="drawer-content-item">🍎</div>
            <div class="drawer-content-item">🍓</div>
            <div class="drawer-content-item">🍇</div>
            </items>
          </div>
        </div>
      </div>
    </div>
  </label>

</fieldset>
</html>
