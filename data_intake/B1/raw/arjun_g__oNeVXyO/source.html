  <title>Isometric</title>

    <link rel="canonical" href="https://codepen.io/arjun_g/pen/oNeVXyO">
  
  
  
  
<style>
body{
	background: #0B384B;
	overflow: hidden;
}

*{
	transform-style: preserve-3d;
}

.room{
	transform: rotateX(60deg) rotateY(0deg) rotateZ(-45deg);
	position: relative;
	top: 25%;
	left: 25%;
}

.floor{
	height: 400px;
	width: 400px;
	background: #ED6766;
}
.wall{
	height: 300px;
	width: 400px;
	top: 0;
	left: 0;
	background: #219296;
	position: absolute;
	transform-origin: 0 100%;
	transform: rotate3d(1, 0, 0, 90deg) translate3d(0, 300px, 300px);
}
.wall:after{
	content: '';
	positon: absolute;
	background: red;
}
.wall.right{
	transform: rotateX(90deg) rotateY(90deg) translate3d(-300px, 300px, 400px);
	background: #27A7A6;
}
</style>

  </head>

<body translate="no">
  <div class="room">
	<div class="wall left">
	</div>
	<div class="floor">
	</div>
	<div class="wall right">
	</div>
</div>
  
  
  
</body>
