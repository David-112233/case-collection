body {
  font-family: "Montserrat", sans-serif;
  margin: 0;
}

.container {
  align-items: center;
  aspect-ratio: 960/1280;
  display: flex;
  justify-content: center;
  min-height: 130vmax;
  width: 100vw;
}

.menu {
  align-items: center;
  display: flex;
  height: 90px;
  left: 0;
  position: fixed;
  top: 0;
  width: 100%;
}
.menu .nav {
  display: flex;
  transition: opacity 0.2s ease;
}
.menu .nav li {
  list-style: none;
  margin-right: 30px;
  transition: transform 0.2s ease;
}
.menu .nav li:hover {
  transform: translateX(5px);
}
.menu .nav li a {
  color: #fff;
  text-decoration: none;
}
.menu .nav .search {
  border: 2px solid #fff;
  border-radius: 50%;
  display: inline-block;
  height: 10px;
  position: relative;
  width: 10px;
}
.menu .nav .search::after {
  background: #fff;
  content: "";
  height: 2px;
  left: 100%;
  position: absolute;
  transform: rotate(45deg) translate(7px, 8px);
  width: 6px;
}
.menu .logo {
  cursor: pointer;
  flex-shrink: 0;
  height: 90px;
  margin-left: 20px;
  margin-right: auto;
  transition: transform 0.2s ease;
  width: 100px;
}
.menu .logo:hover {
  transform: scale(1.05);
}
@media screen and (max-width: 540px) {
  .menu .nav {
    opacity: 0;
  }
}

svg {
  height: 100%;
  width: 100%;
}
svg path {
  fill: #fff;
}
svg rect {
  fill: #fff;
}

.text {
  font-family: "Montserrat", sans-serif;
}
.text--mask {
  font-size: 27.5vw;
  font-weight: 900;
}
.text--outline {
  fill: none;
  font-size: 15vw;
  font-weight: 900;
  stroke: #fff;
  stroke-width: 1;
}

.credit {
  color: white;
  position: fixed;
}
.credit a {
  color: #F4B499;
}
.credit--dribbble {
  bottom: 1em;
  left: 10px;
}
.credit--photo {
  bottom: 2.5em;
  left: 10px;
}
</style>

    <script id="rendered-js" >
// Anime.js for the scroll transform animation
// Rellax.js for the parallax effect

const maskText = anime({
  targets: '[data-text-mask]',
  autoplay: false,
  easing: 'cubicBezier(0.2, 0, 0.5, 1)',
  translateX: '-75vw' });


const outlineText = anime({
  targets: '[data-text-outline]',
  autoplay: false,
  easing: 'cubicBezier(0.2, 0, 0.5, 1)',
  translateX: '10vw' });


function getScrollPercent() {
  const scrollTop = window.scrollY;
  const docHeight = document.body.offsetHeight;
  const winHeight = window.innerHeight;
  const scrollPercent = scrollTop / (docHeight - winHeight) * 100;

  return scrollPercent;
}

document.addEventListener('scroll', () => {
  maskText.seek(getScrollPercent() / 100 * maskText.duration);
  outlineText.seek(getScrollPercent() / 100 * outlineText.duration);
});

var rellax = new Rellax('[data-rellax-speed]', {
  speed: -2,
  center: false,
  wrapper: null,
  round: true,
  vertical: true,
  horizontal: false });
//# sourceURL=pen.js
