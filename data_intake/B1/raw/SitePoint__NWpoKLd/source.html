  <title>CSS 3D Sandbox 🏖</title>

    <link rel="canonical" href="https://codepen.io/SitePoint/pen/NWpoKLd">
  
  <link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">

  
  
<style>
* {
  box-sizing: border-box;
}
:root {
  --font-size: 2.75;
}
body {
  min-height: 100vh;
  background: #e6e6e6;
}
.dimension-label {
  position: absolute;
  margin: 0;
  padding: 0;
  font-family: sans-serif;
  font-weight: bold;
  color: #666;
  font-size: calc(var(--font-size) * 1vmin);
}
.dimension-label--width {
  top: 100%;
  left: 50%;
  transform: translate(-50%);
  margin-top: 1rem;
}
.dimension-label--height {
  top: 50%;
  left: 0;
  transform: translate(-50%, -1rem) rotateX(-90deg) translate3d(0, 0, -1rem) rotate(-90deg) translate(0, 100%);
  transform-origin: 0 100%;
}
.dimension-label--depth {
  left: 100%;
  top: 50%;
  transform: translate(-50%, -50%) rotate(-90deg) translate(0, 50%);
  margin-left: 1rem;
}
.scene {
  perspective: calc(var(--perspective, 800) * 1px);
  transform-style: preserve-3d;
  height: 100vh;
  width: 100vw;
  display: flex;
  align-items: center;
  justify-content: center;
}
.plane {
  background: rgba(162,25,230,0.25);
  height: calc(var(--plane-height, 25) * 1vmin);
  width: calc(var(--plane-width, 25) * 1vmin);
  transform-style: preserve-3d;
  transform: rotateX(calc(var(--rotate-x, -24) * 1deg)) rotateY(calc(var(--rotate-y, -24) * 1deg)) rotateX(90deg);
}
.plane:after {
  content: 'Plane';
  font-size: calc(var(--font-size) * 1vmin);
  font-family: sans-serif;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-weight: bold;
  color: rgba(162,25,230,0.5);
}
.cuboid {
  --width: var(--cuboid-width, 15);
  --height: var(--cuboid-height, 10);
  --depth: var(--cuboid-depth, 4);
  height: calc(var(--depth) * 1vmin);
  width: calc(var(--width) * 1vmin);
  transform-style: preserve-3d;
  position: absolute;
  transform: translate3d(calc(var(--x, 4) * 1vmin), calc(var(--y, 5) * 1vmin), calc(var(--z, 0) * 1vmin)) rotateX(calc(var(--rotate-cuboid-x, 0) * 1deg)) rotateY(calc(var(--rotate-cuboid-y, 0) * 1deg)) rotateZ(calc(var(--rotate-cuboid-z, 0) * 1deg));
}
.cuboid > div:nth-of-type(1) {
  height: calc(var(--height) * 1vmin);
  width: 100%;
  transform-origin: 50% 50%;
  transform: rotateX(-90deg);
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotateX(-90deg) translate3d(0, 0, calc((var(--depth) / 2) * 1vmin));
}
.cuboid > div:nth-of-type(2) {
  height: calc(var(--height) * 1vmin);
  width: 100%;
  transform-origin: 50% 50%;
  transform: translate(-50%, -50%) rotateX(-90deg) rotateY(180deg) translate3d(0, 0, calc((var(--depth) / 2) * 1vmin));
  position: absolute;
  top: 50%;
  left: 50%;
}
.cuboid > div:nth-of-type(3) {
  height: calc(var(--height) * 1vmin);
  width: calc(var(--depth) * 1vmin);
  transform: translate(-50%, -50%) rotateX(-90deg) rotateY(90deg) translate3d(0, 0, calc((var(--width) / 2) * 1vmin));
  position: absolute;
  top: 50%;
  left: 50%;
}
.cuboid > div:nth-of-type(4) {
  height: calc(var(--height) * 1vmin);
  width: calc(var(--depth) * 1vmin);
  transform: translate(-50%, -50%) rotateX(-90deg) rotateY(-90deg) translate3d(0, 0, calc((var(--width) / 2) * 1vmin));
  position: absolute;
  top: 50%;
  left: 50%;
}
.cuboid > div:nth-of-type(5) {
  height: calc(var(--depth) * 1vmin);
  width: calc(var(--width) * 1vmin);
  transform: translate(-50%, -50%) translate3d(0, 0, calc((var(--height) / 2) * 1vmin));
  position: absolute;
  top: 50%;
  left: 50%;
}
.cuboid > div:nth-of-type(6) {
  height: calc(var(--depth) * 1vmin);
  width: calc(var(--width) * 1vmin);
  transform: translate(-50%, -50%) translate3d(0, 0, calc((var(--height) / 2) * -1vmin)) rotateX(180deg);
  position: absolute;
  top: 50%;
  left: 50%;
}
.demo-cuboid {
  background: rgba(162,25,230,0.25);
}
.demo-cuboid:after {
  content: "Center";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-weight: bold;
  font-family: sans-serif;
  font-size: calc(var(--font-size) * 1vmin);
  max-width: 100%;
  overflow: hidden;
  color: rgba(162,25,230,0.5);
}
.demo-cuboid div {
  background: rgba(25,161,230,0.15);
  border: 1px solid #404040;
}
</style>

  </head>

<body translate="no">
  <div class="scene">
  <div class="plane">
    <h1 class="dimension-label dimension-label--width">width</h1>
    <h1 class="dimension-label dimension-label--height">height</h1>
    <h1 class="dimension-label dimension-label--depth">depth</h1>
    <div class="cuboid demo-cuboid">
      <div class="cuboid__side"></div>
      <div class="cuboid__side"></div>
      <div class="cuboid__side"></div>
      <div class="cuboid__side"></div>
      <div class="cuboid__side"></div>
      <div class="cuboid__side"></div>
    </div>
  </div>
</div>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.7/dat.gui.min.js'></script>
    <script id="rendered-js" >
const {
  dat: { GUI } } =
window;

const CONTROLLER = new GUI();

const CONFIG = {
  perspective: 1000,
  'cuboid-height': 10,
  'cuboid-width': 10,
  'cuboid-depth': 10,
  x: 5,
  y: 5,
  z: 5,
  'rotate-x': -30,
  'rotate-y': -24,
  'plane-width': 20,
  'plane-height': 20,
  'rotate-cuboid-x': 0,
  'rotate-cuboid-y': 0,
  'rotate-cuboid-z': 0 };


const UPDATE = () => {
  Object.entries(CONFIG).forEach(([key, value]) => {
    document.documentElement.style.setProperty(`--${key}`, value);
  });
};
const SCENE_FOLDER = CONTROLLER.addFolder('Scene');
SCENE_FOLDER.add(CONFIG, 'perspective', 100, 2000, 1).
name('Perspective (px)').
onChange(UPDATE);
const CUBOID_FOLDER = CONTROLLER.addFolder('Cuboid');
CUBOID_FOLDER.add(CONFIG, 'cuboid-height', 1, 20, 0.1).
name('Height (vmin)').
onChange(UPDATE);
CUBOID_FOLDER.add(CONFIG, 'cuboid-width', 1, 20, 0.1).
name('Width (vmin)').
onChange(UPDATE);
CUBOID_FOLDER.add(CONFIG, 'cuboid-depth', 1, 20, 0.1).
name('Depth (vmin)').
onChange(UPDATE);
// You have a choice at this point. Use x||y on the plane
// Or, use standard transform with vmin.
CUBOID_FOLDER.add(CONFIG, 'x', 0, 40, 0.1).
name('X (vmin)').
onChange(UPDATE);
CUBOID_FOLDER.add(CONFIG, 'y', 0, 40, 0.1).
name('Y (vmin)').
onChange(UPDATE);
CUBOID_FOLDER.add(CONFIG, 'z', -25, 25, 0.1).
name('Z (vmin)').
onChange(UPDATE);
CUBOID_FOLDER.add(CONFIG, 'rotate-cuboid-x', 0, 360, 1).
name('Rotate X (deg)').
onChange(UPDATE);
CUBOID_FOLDER.add(CONFIG, 'rotate-cuboid-y', 0, 360, 1).
name('Rotate Y (deg)').
onChange(UPDATE);
CUBOID_FOLDER.add(CONFIG, 'rotate-cuboid-z', 0, 360, 1).
name('Rotate Z (deg)').
onChange(UPDATE);

const PLANE_FOLDER = CONTROLLER.addFolder('Plane');
PLANE_FOLDER.add(CONFIG, 'rotate-x', -50, 50, 1).
name('Rotate X (deg)').
onChange(UPDATE);
PLANE_FOLDER.add(CONFIG, 'rotate-y', -50, 50, 1).
name('Rotate Y (deg)').
onChange(UPDATE);
PLANE_FOLDER.add(CONFIG, 'plane-height', 1, 50, 1).
name('Height (vmin)').
onChange(UPDATE);
PLANE_FOLDER.add(CONFIG, 'plane-width', 1, 50, 1).
name('Width (vmin)').
onChange(UPDATE);

UPDATE();
//# sourceURL=pen.js
  </script>

  
</body>
