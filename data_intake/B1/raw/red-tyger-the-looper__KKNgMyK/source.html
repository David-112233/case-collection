<style>
:root {
  --skyhigh: rgb(53, 123, 199);
  --skylow: rgb(137, 184, 235);
  --hullcolor: rgb(0, 0, 0);
  --deckcolor: rgb(255, 255, 255);
  --trimcolor: rgb(255, 0, 0);
  --oceanbackground: rgb(80, 80, 223);
  --oceanmedwave: rgb(41, 41, 168);
  --oceanlargewave: rgb(17, 17, 78);
}
.canvasbox {
  height: 300px;
  width: 300px;
  background-image: linear-gradient(
    var(--skyhigh),
    rgb(53, 123, 199),
    var(--skylow),
    rgb(137, 184, 235)
  );
  border-radius: 10%;
  margin: auto;
  display: block;
  overflow: hidden;
  position: relative;
}
.smallwave1 {
  /*  box-shadow: (horiz-offset vert-offset blur spread color) Must set fill of the item
                casting the shadow to transparent to get the wave effect! */
  height: 10%;
  width: 10%;
  border-radius: 0% 00% 50% 50%;
  background-color: transparent;
  box-shadow: 0px 20px 0px 0px var(--oceanbackground, rgb(80, 80, 223));
  top: 51%;
  left: 0%;
}
.smallwave2 {
  height: 10%;
  width: 10%;
  border-radius: 0% 00% 50% 50%;
  background-color: transparent;
  box-shadow: 0px 20px 0px 0px var(--oceanbackground, rgb(80, 80, 223));
  top: 51%;
  left: 10%;
}
.smallwave3 {
  height: 10%;
  width: 10%;
  border-radius: 0% 00% 50% 50%;
  background-color: transparent;
  box-shadow: 0px 20px 0px 0px var(--oceanbackground, rgb(80, 80, 223));
  top: 51%;
  left: 20%;
}
.smallwave4 {
  height: 10%;
  width: 10%;
  border-radius: 0% 00% 50% 50%;
  background-color: transparent;
  box-shadow: 0px 20px 0px 0px var(--oceanbackground, rgb(80, 80, 223));
  top: 51%;
  left: 80%;
}
.smallwave5 {
  height: 10%;
  width: 10%;
  border-radius: 0% 00% 50% 50%;
  background-color: transparent;
  box-shadow: 0px 20px 0px 0px var(--oceanbackground, rgb(80, 80, 223));
  top: 51%;
  left: 90%;
}
.oceanback {
  height: 10%;
  width: 100%;
  background-color: var(--oceanbackground, rgb(80, 80, 223));
  top: 63%;
}
.smokestack1 {
  height: 12%;
  width: 8%;
  background-color: var(--hullcolor, rgb(0, 0, 0));
  top: 39%;
  left: 41%;
  transform: skew(-12deg);
}
.smokestack2 {
  height: 12%;
  width: 8%;
  background-color: var(--hullcolor, rgb(0, 0, 0));
  top: 39%;
  left: 51%;
  transform: skew(-12deg);
}
.stacktrim1 {
  height: 5%;
  width: 8%;
  background-color: var(--trimcolor, rgb(255, 0, 0));
  transform: skew(-12deg);
  top: 39%;
  left: 41.75%;
}
.stacktrim2 {
  height: 5%;
  width: 8%;
  background-color: var(--trimcolor, rgb(255, 0, 0));
  transform: skew(-12deg);
  top: 39%;
  left: 51.75%;
}
.shiphull {
  height: 16%;
  width: 50%;
  background-color: var(--hullcolor, rgb(0, 0, 0));
  border-radius: 0% 0% 30% 0%;
  top: 58.75%;
  left: 33%;
}
.shipbow {
  height: 0px;
  width: 0px;
  /* draw a triangle for the ship's bow */
  border-top: 55px solid var(--hullcolor, rgb(0, 0, 0));
  border-left: 60px solid transparent;
  border-right: 0px solid transparent;
  top: 56%;
  left: 13%;
}
.shipbow2 {
  height: 0px;
  width: 0px;
  border-left: 10px solid var(--hullcolor, rgb(0, 0, 0));
  border-bottom: 0px solid transparent;
  border-top: 10px solid transparent;
  top: 56%;
  left: 33%;
}
.hulltrim1 {
  height: 2%;
  width: 46%;
  background-color: var(--trimcolor, rgb(255, 0, 0));
  top: 63.5%;
  left: 37%;
}
.hulltrim2 {
  height: 4%;
  width: 15%;
  background-color: var(--trimcolor, rgb(255, 0, 0));
  transform: skew(12deg);
  transform: skew(46deg);
  top: 61.75%;
  left: 21.5%;
}
.maindeck {
  height: 0px;
  width: 90px;
  border-bottom: 25px solid var(--deckcolor, rgb(255, 255, 255));
  border-left: 20px solid transparent;
  border-right: 20px solid transparent;
  top: 50.5%;
  left: 25%;
}
.bridge {
  height: 2%;
  width: 6%;
  background-color: rgb(0, 0, 0);
  transform: skewX(-25deg);
  top: 52.5%;
  left: 28.85%;
}
.porthole1 {
  height: 2%;
  width: 2%;
  background-color: rgb(0, 0, 0);
  padding: 0%;
  border: solid rgb(0, 0, 0);
  border-radius: 50%;
  border-width: 1px;
  top: 53.5%;
  left: 42%;
}

.porthole3 {

  border-radius: 50%;
  border-width: 1px;
  top: 53.5%;

}
.mediumwave1 {
  height: 15%;

  border-radius: 0% 00% 50% 50%;
  background-color: transparent;
  box-shadow: 0px 20px 0px 0px var(--oceanmedwave, rgb(41, 41, 168));
  top: 54%;

}
.mediumwave2 {
  height: 15%;

  border-radius: 0% 00% 50% 50%;
  background-color: transparent;
  box-shadow: 0px 20px 0px 0px var(--oceanmedwave, rgb(41, 41, 168));

}

  height: 15%;

.mediumwave4 {

  box-shadow: 0px 20px 0px 0px var(--oceanmedwave, rgb(41, 41, 168));

}
.mediumwave5 {
  height: 15%;
  width: 20%;
  border-radius: 0% 00% 50% 50%;
  background-color: transparent;

.mediumwave6 {

.oceanmid {

.largewave2 {

.largewave3 {

.oceanfore {
  height: 20%;
  width: 100%;
  background-color: var(--oceanlargewave, rgb(17, 17, 78));
  top: 82%;
}
.canvasbox * {
  position: absolute;
}
</style>
