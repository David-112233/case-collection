  height: 1em;
  background: #82ffff;

}

}
.animatable.waiting {

.flex-center {

.logo-container {
  min-height: 100vh;
  perspective: 20vw;
  z-index: 2;
}

.logo {
  transform: translateZ(4vw);
  transform-style: preserve-3d;
  animation: logo-appear-animation 3s cubic-bezier(0.65, 0, 0.35, 1);
}
@media (min-width: 991px) {
  .logo {
    transform: rotateX(calc(var(--mouseY) * 2deg)) rotateY(calc(var(--mouseX) * 2deg)) translateZ(4vw);
  }
}
.logo .text {
  position: relative;
  color: white;
  font-size: 7vw;
  font-style: italic;
  line-height: 1em;
  transform: rotate(-5deg);
  transform-style: preserve-3d;
}
@media (min-width: 991px) {
  .logo .text {
    font-size: 12vh;
  }
}
.logo .text::before {
  content: "";
  display: block;
  background: #1e0aaa;
  background: radial-gradient(ellipse at 10% 10%, #f000be 0%, #1e0aaa 80%, #1e0aaa 100%);
  position: absolute;
  top: -10%;
  right: -30%;
  bottom: -10%;
  left: -20%;
  clip-path: polygon(50% 0, 10% 40%, 100% 100%);
  z-index: -1;
  animation: logo-background-animation 3s cubic-bezier(0.55, 0, 0.35, 1);
}
.logo .text .line {
  animation: logo-text-animation linear;
}
.logo .text .line-1, .logo .text .line-2 {
  font-size: 1.5em;

    <script id="rendered-js" >
const config = {
  selectors: {
    xPos: 'xPos',
    yPos: 'yPos',
    random1: 'random1',
    random2: 'random2' },

  data: {
    random1to5: Math.floor(Math.random() * 5) + 1,
    textCharAppearance: 70 // milliseconds
  } };


let log = {
  init() {
    let xPos = document.getElementById(config.selectors.xPos),
    yPos = document.getElementById(config.selectors.yPos),
    random1 = document.getElementById(config.selectors.random1),
    random2 = document.getElementById(config.selectors.random2);
  },
  log(element, data) {
    element.innerText = data;
  } };


let setRandom = {
  setRandomNumber1(interval) {
    setInterval(() => {
      let number = Math.random();
      document.body.style.setProperty("--random1", number);
      log.log(random1, number);
    }, interval);
  },

  setRandomNumber2(interval) {
    setInterval(() => {
      let number = Math.random();
      document.body.style.setProperty("--random2", number);
      log.log(random2, number);
    }, interval);
  },

  init() {
    // Populate css custom properties with random numbers
    this.setRandomNumber1(200);
    this.setRandomNumber2(config.data.random1to5 * 1000);
  } };


let mouseMove = {
  init() {
    document.addEventListener("mousemove", function (e) {
      let wh = window.innerHeight / 2,
      ww = window.innerWidth / 2,
      mouseXVal = (e.clientX - ww) / 100,
      mouseYVal = -((e.clientY - wh) / 100);

      document.body.style.setProperty("--mouseX", mouseXVal);
      document.body.style.setProperty("--mouseY", mouseYVal);

      log.log(xPos, mouseXVal);
      log.log(yPos, mouseYVal);
    });
  } };


let animateTexts = {
  animate(text) {
    text.classList.remove('waiting');
    text.classList.add('animating');
    // Check for text presence
    if (text.innerText !== '') {
      const baseText = text.innerText;
      const charCount = baseText.length;
      let counter = 0;
      text.innerText = '';

      let interval = setInterval(function () {
        text.innerText = baseText.slice(0, charCount - (charCount - counter));
        counter++;

        if (counter > charCount) {
          clearInterval(interval);
          text.classList.remove('animating');
          text.classList.add('animated');
        }
      }, config.data.textCharAppearance);
    }
  },

  init() {
    let texts = document.querySelectorAll('.animatable');

    for (let i = 0; i < texts.length; i++) {
      let text = texts[i];

      window.addEventListener('scroll', function () {
        let textPosition = text.offsetTop;

        if (window.scrollY > textPosition &&
        text.classList.contains('waiting') &&
        !text.classList.contains('animating') &&
        !text.classList.contains('animated')) {
          animateTexts.animate(text);
        }
      });
    }
  } };


let UATester = {
  UA: window.navigator.userAgent,

  init() {
    if (/firefox/gi.test(this.UA)) {document.querySelector('html').classList.add('firefox');
    }
  } };


document.addEventListener('DOMContentLoaded', event => {
  UATester.init();
  log.init();
  setRandom.init();
  mouseMove.init();
  animateTexts.init();
});
