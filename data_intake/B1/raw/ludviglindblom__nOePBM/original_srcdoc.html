  <title>CSS optical illusion</title>

    <link rel="canonical" href="https://codepen.io/ludviglindblom/pen/nOePBM">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/modernizr/2.8.3/modernizr.min.js" type="text/javascript"></script>


  <link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">

  
  
<style>
html {
  background: #999;
  padding: 0;
}

body {
  margin: 0;
  padding: 0;
}

a {
  font-family: sans-serif;
  font-size: 20px;
  font-weight: bold;
  line-height: 1;
  text-decoration: none;
  display: inline-block;
  padding: 10px;
  background: #000;
  color: #fff;
}
a:hover, a:focus {
  text-decoration: underline;
}

#track {
  background-color: #999;
  background-image: linear-gradient(90deg, #000 0%, #000 50%, #fff 50%, #fff 100%);
  background-size: 50px 50px;
  border: 1px solid #000;
  width: 675px;
  height: 225px;
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  margin: auto;
  padding: 0;
}
#track.proof {
  background-image: none;
}

.block {
  width: 100px;
  height: 40px;
  position: absolute;
  left: 0;
  animation: illusion 9s linear infinite alternate;
}
.block.light {
  background: #fff;
  top: 10px;
}
.block.dark {
  background: #000;
  bottom: 10px;
}

@keyframes illusion {
  from {
    left: 0;
  }
  to {
    left: calc(100% - 100px);
  }
}
</style>

  <script>
  window.console = window.console || function(t) {};
</script>

  <script src="https://public.codepenassets.com/js/prefixfree-1.0.7.min.js"></script>

  
</head>

<body translate="no">
  <a href='#'>Toggle</a>
<div id='track'>
  <div class='block light'></div>
  <div class='block dark'></div>
</div>
  <script src='//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script>
    <script id="rendered-js" >
document.querySelector("a").addEventListener("click", function (e) {
  e.preventDefault();
  document.querySelector("#track").classList.toggle("proof");
});
//# sourceURL=pen.js
  </script>

  
</body>
