  <title>Overlapping SVG shapes with image fill</title>

    <link rel="canonical" href="https://codepen.io/astrotim/pen/eYKMmR">
  
  
  
  
<style>
body {
  margin: 0;
  padding: 0;
}

.shape {
  position: relative;
  padding-bottom: 36.40%;
  height: 0;
  overflow:hidden;
  margin-top: -8%;
}

.shape svg {
  width: 100%;
  position: absolute;
}

.first {
  z-index: 3;
  margin-top: 0;
}

.second {
  z-index: 2;
}

.third {
  z-index: 1;
}

.second, .third {

}
</style>

  <script>
  window.console = window.console || function(t) {};
</script>

  
  
</head>

<body translate="no">
  <div class="shape first">
  <?xml version="1.0" encoding="utf-8"?>
  <svg version="1.1"
       baseProfile="full"
       xmlns="http://www.w3.org/2000/svg"
       xmlns:xlink="http://www.w3.org/1999/xlink"
       xmlns:ev="http://www.w3.org/2001/xml-events"
       viewBox="0 0 1280 853">
  <defs>
    <pattern id="bgimg1" patternUnits="userSpaceOnUse" width="1280" height="853">
      <image xlink:href="https://38.media.tumblr.com/5c0a918c9f6b05db6002fb50cc0eacb8/tumblr_naj3mgttxL1st5lhmo1_1280.jpg" x="0" y="-150" width="1280" height="853" />
    </pattern>
  </defs>
  <path fill="url(#bgimg1)" d="M1280,0v373.333l-640,93.333L0,373.333V0H1280z"/>
  </svg>  
</div>
<div class="shape second">

    </pattern>
  </defs>
  <path fill="url(#bgimg2)" d="M1280,0v373.333l-640,93.333L0,373.333V0H1280z"/>
