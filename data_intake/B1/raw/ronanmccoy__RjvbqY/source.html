  <title>Timeline Arrows - Flexbox version</title>

    <link rel="canonical" href="https://codepen.io/ronanmccoy/pen/RjvbqY">
  
  <link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">

  
  
<style>
/* Base style */
body { background-color: #cdcdcd; }

.container {
	width: 100%;
	margin: 30px auto;
}

/* Timeline styles */
.arrows {
	display: flex;
	flex-direction: row;
	flex-wrap: nowrap;
	align-items: stretch;
	
	width: 80%;
	margin: 0 auto;
	padding: 6px 0;
	position: relative;
	
	border: 1px dashed yellow;
}

.arrow {
	width: 33%;
	margin: 0;
	padding: 25px 10px;
	text-align: center;
	position: relative;
}

.arrow:after {
	border-top: 34px solid transparent;
	border-bottom: 34px solid transparent;
	content: "";
	height: 0;
	position: absolute;
	right: -17px;
	top: 0;
	width: 0;
	z-index: 2;
}

.arrow:last-child:after {
	border: none;
	right: 0;
}


/* Colour each section. */
.step1 {background-color: #E5461C;}

.step2 {background-color: #C4261E;}

.step3 {background-color: #681010;}


/* Colour the wedge (arrow) */
.arrow.step1:after { border-left: 17px solid #E5461C; }

.arrow.step2:after { border-left: 17px solid #C4261E; }


/* Typography */
.arrow span {
	color: #ffffff;
	position: relative;
}
</style>

  </head>

<body translate="no">
  <div class="container">
	<div class="arrows">
		<div class="arrow step1">
			<span>1. Stop</span>
		</div>
		<div class="arrow step2">
			<span>2. Look</span>
		</div>
		<div class="arrow step3">
			<span>3. Listen (and hopefully all is good).</span>
		</div>
	</div>
</div>
  
  
  
</body>
