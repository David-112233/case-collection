:root {
  --speed: 10s;
}

* {
  transform-style: preserve-3d;
}

body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  perspective: 100vmin;
  background: radial-gradient(circle at 50% 80%, #772f1a, #f2a65a);
}

.content {
  width: 80vmin;
  height: 80vmin;
  position: absolute;
  transform: rotateY(0deg) rotateX(0deg);
  transition: all 0.5s ease 0s;
  animation: start 4.5s ease 0.5s;
}

@keyframes start {
  20%, 25% {
    transform: rotateY(25deg) rotateX(5deg);
  }
  65%, 70% {
    transform: rotateY(-25deg) rotateX(-5deg);
  }
  85% {
    transform: rotateY(-5deg) rotateX(5deg);
  }
}
.cuboid {
  --width: 10;
  --height: 10;
  --depth: 10;
  --hue: 15;
  --sat: 25%;
  height: calc(var(--height) * 1vmin);
  width: calc(var(--width) * 1vmin);
  position: absolute;
  right: 0;
  top: 0;
}

.side {
  position: absolute;
  top: 50%;
  left: 50%;
  height: 100%;
  width: 100%;
  box-sizing: border-box;
  border-radius: 2px;
  border: 1px solid #0004;
  transition: all 1s ease 0s;
}

.side:nth-of-type(1) {
  transform: translate3d(-50%, -50%, calc(var(--depth) * 0.5vmin));
  background: hsl(var(--hue), var(--sat), 55%);
}

.side:nth-of-type(2) {
  transform: translate3d(-50%, -50%, calc(var(--depth) * -0.5vmin)) rotateY(180deg);
  background: hsl(var(--hue), var(--sat), 25%);
}

.side:nth-of-type(3) {
  width: calc(var(--depth) * 1vmin);
  transform: translate(-50%, -50%) rotateY(90deg) translate3d(0, 0, calc(var(--width) * 0.5vmin));
  background: hsl(var(--hue), var(--sat), 45%);
}

.side:nth-of-type(4) {
  width: calc(var(--depth) * 1vmin);
  transform: translate(-50%, -50%) rotateY(-90deg) translate3d(0, 0, calc(var(--width) * 0.5vmin));
  background: hsl(var(--hue), var(--sat), 35%);
}

.side:nth-of-type(5) {
  height: calc(var(--depth) * 1vmin);
  transform: translate(-50%, -50%) rotateX(90deg) translate3d(0, 0, calc(var(--height) * 0.5vmin));
  background: hsl(var(--hue), var(--sat), 40%);
}

.side:nth-of-type(6) {
  height: calc(var(--depth) * 1vmin);
  transform: translate(-50%, -50%) rotateX(-90deg) translate3d(0, 0, calc(var(--height) * 0.5vmin));
  background: hsl(var(--hue), var(--sat), 30%);
}

/*** BASE ***/
.base {
  width: 56vmin;
  height: 80vmin;
  left: 10vmin;
  position: absolute;
}

.base1 {
  --width: 56;
  --height: 80;
  --depth: 1;
  transform: translateZ(-3vmin);
}

.base2 {
  --width: 8;
  --height: 48;

.base3 {

.base4 {

.cuboid.base1 .side:nth-of-type(1) {

.fixed .cuboid {

  --height: 80;
  --depth: 5;
}

.fixed .cuboid + .cuboid {
  --height: 16;

.fixed .cuboid.f4 {

.fixed + .fixed {

}

  left: 56vmin;
}

/*** LOCKING ***/
.locking {
  position: absolute;

  animation-fill-mode: forwards;

.locking .cuboid {
