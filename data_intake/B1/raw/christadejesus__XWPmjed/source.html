<style>
@import url('https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap');

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  /* COLORS */
  --primary-dk: #324376; /* blue background */
  --primary-lt: #85BAA1; /* page lines */
  --accent-dk: #F76C5E; /* seal/button background & vertical page line */
  --accent-md: #D4BB8F; /* page hole */
  --accent-lt: #F5DD90; /* envelope */
  --neutral-dk: #333; /* message text */ 
  --neutral-lt: #fff; /* page background & 'open' text */
  
  /* FONTS */
  --font-sans: "Poppins", sans-serif;
  --font-display: "Courier Prime", serif; 
}
/* MAIN STYLES */ 
body {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  font-family: var(--font-display);
  font-size: 14px;
  background: var(--primary-dk);
}
p {
  line-height: 1.5;
}
.container {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 450px;
  width: 100%;
}
/* ENVELOPE BACK */
.envelope-back {
  position: absolute;
  bottom: 0;
  width: 425px;
  height: 400px;
}
.envelope-back-base {
  filter: drop-shadow(2px 10px 10px rgba(0,0,0,.5));
}
.envelope-flap-open {
  display: none;
  filter: drop-shadow(2px 10px 10px rgba(0,0,0,.5));
}
/* PAGE */
.page-container {
  height: 450px; 
  width: 425px;
  padding-top: 50px;
  overflow: hidden;
}
.page {
  position: relative;
  background: var(--neutral-lt);
  width: 300px;
  height: 388px;
  padding: 45px 20px 20px 40px;
  margin: 280px auto 0 auto;
  box-shadow: 2px 8px 24px rgba(0,0,0,.6);
  z-index: 10;
}
.page-show {
  margin: 0 auto;
  transition: ease all 1s;
}
.hole-container {
  position: absolute; 
  top: 0;
  left: 9px;
  height: 100%;
  width: 20px;
  border-right: 1px solid var(--accent-dk);
  z-index: 100;
}
.line-container {
  position: absolute;
  top: 0;
  bottom: 0;
  right: 0;
  left: 0;
}

/* ENVELOPE FRONT */
.envelope-front {
  position: absolute;
  bottom: 0;
  width: 375px;
  height: 200px;
  z-index: 1000;
}
.seal-container {
  position: absolute;
  bottom: 14px;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.envelope-seal {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: none;
  background: var(--accent-dk);
  color: var(--neutral-lt);
  font-family: var(--font-sans);
  font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
}
.seal-closed {
  background: transparent;
  color: var(--neutral-dk);
}
.envelope-front-base {
 filter: drop-shadow(0px 0px 10px rgba(0,0,0,.2));
}
.envelope-flap-closed {
  filter: drop-shadow(0px 0px 5px rgba(0,0,0,.2));
}
.hide {
  display: none; 
}
.show {
  display: block;
}
</style>

  </head>

<body translate="no">
  <!-- This div contains all visible elements -->
<div class="container">

        <line x1="0" y1="228" x2="300" y2="228" style="stroke-width: 1px; stroke: var(--primary-lt)"></line>
        <line x1="0" y1="249" x2="300" y2="249" style="stroke-width: 1px; stroke: var(--primary-lt)"></line>

        <line x1="0" y1="312" x2="300" y2="312" style="stroke-width: 1px; stroke: var(--primary-lt)"></line>
        <line x1="0" y1="333" x2="300" y2="333" style="stroke-width: 1px; stroke: var(--primary-lt)"></line>
        <line x1="0" y1="354" x2="300" y2="354" style="stroke-width: 1px; stroke: var(--primary-lt)"></line>
        <line x1="0" y1="373" x2="300" y2="373" style="stroke-width: 1px; stroke: var(--primary-lt)"></line>
      </svg>
    </div>
  </div>
  <!-- This div holds all top or front elements including the envelope base front, flap when closed, seal/button -->
  <div class="envelope-front">
    <div class="seal-container">
      <button class="envelope-seal" id="envelope-seal" onclick="toggleEnvelope()">open</button>
    </div>
    <svg width="375" height="200">
      <polygon class="envelope-front-base" points="0,0 187,150 375,0 375,200 0,200 0,0" style="fill: var(--accent-lt);"></polygon>
      <polygon class="envelope-flap-closed" id="envelope-flap-closed" points="0,0 375,0 187,150 0,0" style="fill: var(--accent-lt);"></polygon>
    </svg>
  </div>
</div>
  
    <script id="rendered-js" >
// Typing animation

const msg = 'Sometimes the hardest step forward is the first one, but every step after that gets a little easier. So keep going, one step at a time, until you reach your destination. ❤'; // The message being typed

let i = 0;
let delay = 50;

function typeWriter() {
  if (i < msg.length) {
    document.getElementById("message").innerHTML += msg.charAt(i);
    i++;
    setTimeout(typeWriter, delay);
  }
}
typeWriter(); //Calling the function here starts the animation without delay

// Envelope seal click event

const envelopeFlapClosed = document.getElementById("envelope-flap-closed");
const envelopeFlapOpen = document.getElementById("envelope-flap-open");
const page = document.getElementById("page");
const envelopeSeal = document.getElementById("envelope-seal");

function toggleEnvelope() {

  if (envelopeSeal.innerHTML === "open") {
    envelopeSeal.innerHTML = "close";
    envelopeSeal.classList.add("seal-closed");
    envelopeFlapClosed.classList.add("hide");
    envelopeFlapOpen.classList.add("show");
    page.classList.add("page-show");
  } else {
    envelopeSeal.innerHTML = "open";
    envelopeSeal.classList.remove("seal-closed");
    envelopeFlapClosed.classList.remove("hide");
    envelopeFlapOpen.classList.remove("show");
    page.classList.remove("page-show");
  }
}

  </script>
