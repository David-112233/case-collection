  { shade: "0, 0%", darken: "100%" }] };



function draw() {
  toggle = !toggle;
  console.log(toggle);
  document.querySelectorAll(".box").forEach(cell => {
    cell.style.setProperty("--size", Math.floor(Math.random() * 400) + 75);
    cell.style.setProperty("--rotate", Math.floor(Math.random() * 360));
    cell.style.setProperty(
    "--translate",
    Math.floor(Math.random() * 200) -
    100 +
    "%," + (
    Math.floor(Math.random() * 200) - 100) +
    "%");


    for (let i = 0; i < 3; i++) {if (window.CP.shouldStopExecution(0)) break;
      cell.style.setProperty("--scale-" + i, Math.floor(Math.random() * 6) + 1);
    }window.CP.exitedLoop(0);

    if (toggle) {
      let rand = Math.floor(Math.random() * colors.color.length);
      cell.style.setProperty("--color-2", colors.color[rand].shade);
      cell.style.setProperty("--dark-2", colors.color[rand].darken);
      cell.style.setProperty("--slide", "0");
    } else {
      let rand = Math.floor(Math.random() * colors.color.length);
      cell.style.setProperty("--color", colors.color[rand].shade);
      cell.style.setProperty("--dark", colors.color[rand].darken);
      cell.style.setProperty("--slide", "1");
    }
  });
}

draw();
draw();

document.body.addEventListener("click", function () {
  draw();
});

let mouse = { x: 0, y: 0 };
let body = document.body;
let width = window.innerWidth / 2;
let height = window.innerWidth / 2;

body.addEventListener("mousemove", ({ clientX, clientY }) => {
  mouse.x = (width - event.pageX) * -1 / width;
  mouse.y = (height - event.pageY) * 1 / height;
  body.style.setProperty("--mouseX", mouse.x);
  body.style.setProperty("--mouseY", mouse.y);
});
