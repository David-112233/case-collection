<style>
* {
  box-sizing: border-box;
}

html {
  font-size: 16px;
  font-family: "IBM Plex Mono", monospace;
  font-weight: 300;
  line-height: 1.25;
}

.site {
  background: radial-gradient(50% 50% at 50% 50%, rgba(123, 131, 126, 0.9) 0%, rgba(54, 75, 73, 0.9) 100%), #898989;
  background-repeat: no-repeat;
  color: #FFF;
  min-height: 100vh;
}

.site__header,
.site__nav ul {
  display: flex;
  justify-content: space-between;
}

.site__header {
  position: fixed;
  top: 0;
  right: 1.25rem;
  writing-mode: vertical-rl;
  height: 100%;
  padding: 1.25rem 0;
  z-index: 20;
}

.site__header > * {
  flex: 1 1 auto;
  padding-bottom: 0.625rem;
}

.site__nav {
  padding-bottom: 0;
}

.site__nav-list {
  list-style-type: none;
}

.site__nav-link {
  display: inline-block;
  text-decoration: none;
  color: #FFF;
  padding-bottom: 0.625rem;
}

.site__nav-list li:last-child .site__nav-link {
  padding-bottom: 0;
}

.block {
  display: block;
}

.main {
  margin-top: 2rem;
  width: 100%;
  margin: 5rem auto;
  max-width: 65rem;
}

.container {
  position: relative;
}

.heading {
  font-size: 2rem;
  text-transform: uppercase;
  margin-bottom: 2rem;
  z-index: 10;
}
@media screen and (min-width: 650px) {
  .heading {
    position: absolute;
    left: 0;
    top: 6rem;
  }
}

mark {
  color: #FFF;
  background-color: #000;
  line-height: 1.35;
  padding: 0.325rem;
}

img {
  display: block;
  width: 100%;
}

.grid-container {
  max-width: 65rem;
  margin: 0 auto;
  padding: 0 10%;
}

.grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  position: relative;
  grid-template-rows: repeat(12, 1fr);
}

.grid__item--bg {
  grid-column: 2/span 9;
  z-index: 0;
  grid-row: 1/-1;
}

.grid__item--portrait-half {
  grid-column: 6/span 6;
  z-index: 2;
  grid-row: 1/-1;
  /*   clip-path: polygon(5% 10%, 27% 3%, 94% 25%, 84% 98%, 39% 98%, 11% 98%, 4% 66%, 4% 34%); */
}

.grid__item--portrait-neck {
  /*   clip-path: polygon(5% 3%, 96% 4%, 95% 95%, 6% 95%, 20% 30%); */
  grid-column: 5/span 4;
  grid-row: 6/11;
  z-index: 3;
}

.grid__item--portrait-left {
  /*   clip-path: polygon(10% 19%, 93% 15%, 90% 88%, 13% 92%); */
  grid-column: 2/span 4;
  grid-row: 6/12;
  z-index: 4;
}

.grid__item--portrait-eye {
  /*   clip-path: polygon(4% 13%, 84% 12%, 86% 34%, 80% 45%, 80% 76%, 10% 79%); */
  grid-column: 4/span 2;
  grid-row: 3/5;
  z-index: 5;
  width: 82%;
  justify-self: end;
}

.grid__item--portrait-shirt {
  /*   clip-path: polygon(3% 2%, 50% 25%, 97% 8%, 97% 97%, 3% 98%); */
  grid-column: 1/span 2;
  grid-row: 11/-1;
  z-index: 6;
}

.grid__item--portrait-bg-1 {
  /*   clip-path: polygon(14% 13%, 84% 12%, 86% 34%, 90% 66%, 30% 76%, 10% 79%); */
  grid-column: 1/span 2;
  grid-row: 1/4;
  z-index: 8;
}

.grid__item--portrait-bg-2 {
  /*   clip-path: polygon(9% 4%, 80% 0%, 100% 100%, 0% 100%); */
  grid-column: 11/-1;
  grid-row: 2/7;
  z-index: 8;
}

.grid__item--portrait-bg-3 {
  /*   clip-path: polygon(9% 4%, 80% 0%, 100% 100%, 0% 100%); */
  grid-column: 1/span 3;
  grid-row: 4/7;
  z-index: 4;
}

.grid__item--portrait-bg-4 {
  /*   clip-path: polygon(5% 4%, 94% 3%, 97% 96%, 13% 96%); */
  grid-column: 10/12;
  grid-row: 1/6;
  z-index: 1;
}
</style>

  </head>

<body translate="no">
  <body class="site">
  <header class="site__header">
    <p>When: <span class="block">May 10-12</span></p>
    <p>Where: <span class="block">UCL London</span></p>
     <nav class="site__nav">
      <ul class="site__nav-list">
        <li><a class="site__nav-link" href="/">Tickets</a></li>
        <li><a class="site__nav-link"  href="/">About</a></li>
        <li><a class="site__nav-link"  href="/">Contact</a></li>
      </ul>
    </nav>
  </header>
  
  <main class="main">
    <div class="container">
        <h1 class="heading rellax" data-rellax-speed="-5">
          <mark>2020</mark>
          <br />
          <mark>golden makers</mark>
          <br />  
          <mark>Awards &amp; Ceremony</mark>
        </h1>
      
        <div class="grid-container" aria-hidden="true">
        <div class="grid">
          <div class="grid__item grid__item--bg">
          <img src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/110238/codrops-portrait-bg.jpg" alt="">
        </div>
        <div class="grid__item grid__item--portrait-half rellax" data-rellax-speed="3">
          <img src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/110238/codrops-portrait-half_copy.jpg" alt="">
        </div>
        <div class="grid__item grid__item--portrait-neck rellax" data-rellax-speed="-5">
          <img src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/110238/codrops-portrait-neck.jpg" alt="">
        </div>
        <div class="grid__item grid__item--portrait-left rellax" data-rellax-speed="4">
          <img src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/110238/codrops-portrait-shirt-left.jpg" alt="">
        </div>
        <div class="grid__item grid__item--portrait-eye rellax" data-rellax-speed="1">
          <img src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/110238/codrops-eye.jpg" alt="">
        </div>
        <div class="grid__item grid__item--portrait-shirt rellax" data-rellax-speed="4">
          <img src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/110238/codrops-portrait-shirt.jpg" alt="">
        </div>
        <div class="grid__item grid__item--portrait-bg-1 rellax" data-rellax-speed="-2">
          <img src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/110238/codrops-bg-1.png" alt="">
        </div>
        <div class="grid__item grid__item--portrait-bg-2 rellax" data-rellax-speed="3">
          <img src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/110238/codrops-bg-2.jpg" alt="">
        </div>
        <div class="grid__item grid__item--portrait-bg-3 rellax" data-rellax-speed="3">
          <img src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/110238/codrops-bg-1.png" alt="">
        </div>
        <div class="grid__item grid__item--portrait-bg-4 rellax" data-rellax-speed="-8">
          <img src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/110238/codrops-bg-2.jpg" alt="">
        </div>
      </div>
     </div>
    </div>
  </main>
</body>
