<html lang="en" >

<head>

  <title>Book 3D</title>

    <link rel="canonical" href="https://codepen.io/ThinkerBell1234/pen/MWvbRow">
  
  
  
  
<style>
body {
  perspective: 1000px;
  width: 50%;
  position: absolute;
  left: 60%;
  top:10%;
  background-color: #D1AAD1;
  transform: translate(-50%, -50%);
  overflow: hidden;
}
body .read{
  width: 70%;
  transform: rotateX(45deg) rotateZ(0deg) translate3d(-120px, 0px, 70px);
  transition: all .4s;
  transform-style: preserve-3d;
  animation: pop-up 5s linear;
}
@keyframes pop-up {
  0%{margin-top: 500px; transform-origin: center;transform: rotateX(90deg) rotateZ(0deg) translate3d(-120px, 0px, 70px);}
  50%{margin-top: 500px; transform-origin: center;transform: rotateX(90deg) rotateZ(0deg) translate3d(-120px, 0px, 70px);}
}
.book {
  position: absolute;
  height: 500px;
  width: 800px;
  box-shadow: -3px -5px 10px 10px black inset;
  background-image:  url(https://cdn.pixabay.com/photo/2015/12/03/08/50/paper-1074131_960_720.jpg);
  border: 20px solid #7A3A05;
}
.text1 {
  position: absolute;
  float: left;
  margin-left: 30px;
  margin-top: 20px;
  font-family: fantasy;
  font-size: 30px;
  text-transform: capitalize;
  text-shadow: 1px 1px 1px white,
               2px 2px 1px purple;
}
.text2 {
  position: absolute;
  float: left;
  margin-left: 450px;
  margin-top: 20px;
  font-family: fantasy;
  font-size: 30px;
  text-transform: capitalize;
  text-shadow: 1px 1px 1px white,
               2px 2px 1px purple;
}
.text3 {
  position: absolute;
  float: left;
  margin-left: 30px;
  margin-top: 80px;
  font-family: verdana;
  font-size: 15px;
  text-transform: capitalize;
  text-shadow: 1px 1px 1px white,
               2px 2px 1px purple;
}
.pop {
  position: absolute;
  margin-left: 150px;
  margin-top: 250px;
  height: 100px;
  width: 20px;
  z-index: 10;
  transform-origin: center bottom;
  background-color: black;
  animation-delay: 10s;
  animation: rise 5s linear;
}
@keyframes rise {
  0%{transform: rotateX(0deg);}
  50%{transform: rotateX(180deg);}
  100%{transform: rotateX(0deg);}
}
#scale1 {
  position: absolute;
  transform: scale(50%, 50%);
  margin-left: -175px;
  margin-top: -80px;
}
#scale2 {
  position: absolute;
  transform: scale(20%, 20%);
  margin-left: -200px;
  margin-top: 40px;
}
#scale3 {
  position: absolute;
  transform: scale(20%, 20%);
  margin-left: -120px;
  margin-top: 40px;
}
.busk {
  position: absolute;
	width: 350px; 
  height: 120px;
	background: #1CBF65;
	background: linear-gradient(top, #1CBF65 5%, #4DE357 100%);
	background: -webkit-linear-gradient(top, #1CBF65 5%, #4DE357 100%);
	background: -moz-linear-gradient(top, #1CBF65 5%, #4DE357 100%);
	background: -ms-linear-gradient(top, #1CBF65 5%, #4DE357 100%);
	background: -o-linear-gradient(top, #1CBF65 5%, #4DE357 100%);
	
	border-radius: 100px;
	-webkit-border-radius: 100px;
	-moz-border-radius: 100px;
	
	position: relative;
	/*margin: 120px auto 20px;*/
}
.busk:after, .busk:before {
	content: '';
	position: absolute;
	background: #1CBF65;
	z-index: -1
}
.busk:after {
	width: 100px; height: 100px;
	top: -50px; left: 50px;
	
	border-radius: 100px;
	-webkit-border-radius: 100px;
	-moz-border-radius: 100px;
}
.busk:before {
	width: 180px; height: 180px;
	top: -90px; right: 50px;
	
	border-radius: 200px;
	-webkit-border-radius: 200px;
	-moz-border-radius: 200px;
}
.papir {
  position: absolute;
  opacity: 1;
  margin-top: 20px;
  height: 500px;
  width: 400px;
  /*border: 2px solid black;*/
  transform-origin: center right;
  box-shadow: -3px -5px 10px 10px black inset;
  z-index: 10;
  background-image: url(https://cdn.pixabay.com/photo/2015/12/03/08/50/paper-1074131_960_720.jpg);
  animation-delay: 60s;
  animation: flip 10s linear;
}
@keyframes flip{
  0%{transform: rotateY(180deg);}
  50%{transform: rotateY(180deg);opacity: 1;}
  60%{opacity: 0.8;}
}
</style>

  </head>

<body translate="no">
  <div class="read">
  
  <div class="book">
    <div class="text1">This Is As Pop-up Book</div>
    <div class="text2">This is an adventure...</div>
    <div class="text3">This is a pop-up Tree...</div>
    <div class="pop">
      <div id="scale1" class="busk"></div>
      <div id="scale2" class="busk"></div>
      <div id="scale3" class="busk"></div>
    </div>
  </div>
  
  <div class="papir">
    <div class="text4"></div>
  </div>
  
</div>
  
  
  
</body>

</html>
