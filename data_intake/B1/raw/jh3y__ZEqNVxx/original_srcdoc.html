  <title>CSS Scroll Driven Animation Cover Flow [Infinite Edition 🚀] </title>

    <link rel="canonical" href="https://codepen.io/jh3y/pen/ZEqNVxx">

<style>
* {
  box-sizing: border-box;
}

h1 {
  position: fixed;
  color: white;
  top: 50%;
  left: 50%;
  translate: -50% -50%;
}

@supports (animation-timeline: view()) {
  h1 { display: none; }
}

body {
  display: grid;
  place-items: center;
  min-height: 100vh;
  background: black;
}

ul {
  width: 90vw;
  height: 100%;
  display: flex;
  list-style-type: none;
  padding: 1rem 0;
  overflow-x: auto;
  overflow-y: visible;
/*  gap: 1rem;*/
  -ms-scroll-snap-type: x mandatory;
      scroll-snap-type: x mandatory;
  contain: inline-size;
  align-items: center;
}

li {
  width: 15%;
  aspect-ratio: 1;
  background: red;
  display: grid;
  place-items: center;
  flex: 1 0 15cqw;
  position: relative;
  height: 15cqw;
  width: 15cqw;
  view-timeline: --cover;
  view-timeline-axis: inline;
  transform-style: preserve-3d;
  perspective: 100vmin;
  background: transparent;
}

:root:has(#z:checked) li {
  -webkit-animation: z both linear;
          animation: z both linear;
  animation-timeline: --cover;
  animation-range: cover;
}

li img {
  width: 100%;
  height: 100%;
  -o-object-fit: cover;
     object-fit: cover;
  background: hsl(10 80% 80%);
  -webkit-box-reflect: below 1vmin linear-gradient(transparent 0 50%, hsl(0 0% 100% / 0.75) 100%)
}

:root:has(#rotation:checked) li img {
  -webkit-animation: cover-flow both linear;
          animation: cover-flow both linear;
  animation-timeline: --cover;
  animation-range: cover;
}

.image-wrapper {
  height: 100%;
  width: 100%;
  aspect-ratio: 1;
  transform-origin: 100% 50%;
  transform-style: preserve-3d;
  perspective: 100vmin;
  position: absolute;
  top: 50%;
  left: 50%;
  translate: -50% -50%;
}

:root:has(#scaling:checked) .image-wrapper {
  -webkit-animation: shrink both linear;
          animation: shrink both linear;
  animation-timeline: --cover;
  animation-range: cover;
}

@-webkit-keyframes shrink {
  0% {
    scale: 0.75;
    opacity: 0;
    transform-origin: -150% 50%;
  }
  5% {
    opacity: 1;
  }
  10% {
    opacity: 1;
    scale: 1;
    transform-origin: 50% 50%;
  }
  40% {
    scale: 1;
    opacity: 1;
    transform: translate3d(0, 0, 0vmin);
  }
  50% {
    scale: 1.2;
    opacity: 1;
    transform: translate3d(0, 0, 15vmin);
  }
  60% {
    scale: 1;
    opacity: 1;
    transform: translate3d(0, 0, 0vmin);
  }
  90% {
    opacity: 1;
    transform-origin: 50% 50%;
    scale: 1;
  }
  95% {
    opacity: 1;
  }
  100% {
    scale: 0.75;
    opacity: 0;
    transform-origin: 250% 50%;
  }
}

@keyframes shrink {
  0% {
    scale: 0.75;
    opacity: 0;
    transform-origin: -150% 50%;
  }
  5% {
    opacity: 1;
  }
  10% {
    opacity: 1;
    scale: 1;
    transform-origin: 50% 50%;
  }
  40% {
    scale: 1;
    opacity: 1;
    transform: translate3d(0, 0, 0vmin);
  }
  50% {
    scale: 1.2;
    opacity: 1;
    transform: translate3d(0, 0, 15vmin);
  }
  60% {
    scale: 1;
    opacity: 1;
    transform: translate3d(0, 0, 0vmin);
  }
  90% {
    opacity: 1;
    transform-origin: 50% 50%;
    scale: 1;
  }
  95% {
    opacity: 1;
  }
  100% {
    scale: 0.75;
    opacity: 0;
    transform-origin: 250% 50%;
  }
}

@-webkit-keyframes z {
  0%, 100% {
    z-index: 1;
  }
  50% {
    z-index: 100;
  }
}

@keyframes z {
  0%, 100% {
    z-index: 1;
  }
  50% {
    z-index: 100;
  }
}

@-webkit-keyframes cover-flow {
  0% {
    z-index: 1;
    transform: translate(-80%, 0) rotateY(-33deg);
  }
  20% {
    scale: 1;
    transform: translate(0%, 0) rotateY(-33deg);
  }
  40% {
    transform: translate(15%, 0) rotateY(-20deg);
  }
  /* Half way */
  50% {
    scale: 1.2;
    transform: translate(0, 0) rotateY(0deg);
  }
  60% {
    transform: translate(-15%, 0) rotateY(20deg);
  }
  80% {
    scale: 1;
    transform: translate(0%, 0) rotateY(33deg);
  }
  100% {
    z-index: 1;
    transform: translate(80%, 0) rotateY(33deg);
  }
}

@keyframes cover-flow {
  0% {
    z-index: 1;
    transform: translate(-80%, 0) rotateY(-33deg);
  }
  20% {
    scale: 1;
    transform: translate(0%, 0) rotateY(-33deg);
  }
  40% {
    transform: translate(15%, 0) rotateY(-20deg);
  }
  /* Half way */
  50% {
    scale: 1.2;
    transform: translate(0, 0) rotateY(0deg);
  }
  60% {
    transform: translate(-15%, 0) rotateY(20deg);
  }
  80% {
    scale: 1;
    transform: translate(0%, 0) rotateY(33deg);
  }
  100% {
    z-index: 1;
    transform: translate(80%, 0) rotateY(33deg);
  }
}

/*li:nth-of-type(even) {
  background: hsl(210 80% 80%);
}*/

li:not([aria-hidden]) {
  scroll-snap-align: center;
}

.controls {
  color: white;
  font-weight: bold;
  position: fixed;
  top: 1rem;
  right: 1rem;
  display: grid;
  gap: 1rem;
  padding: 1rem;
  opacity: 0;
  transition: opacity 0.25s;
}

.controls:hover {
  opacity: 1;
}

.form-group {
  display: flex;
  gap: 1rem;
  align-items: center;
  width: 100%;
  justify-content: space-between;
}
</style>

    <label for="scaling">Animate Scaling</label>
    <input checked type="checkbox" id="scaling">
  </div>
  <div class="form-group">
    <label for="rotation">Animate Rotation</label>
    <input checked type="checkbox" id="rotation">
  </div>
  <div class="form-group">
    <label for="z">Animate z-index</label>
    <input checked type="checkbox" id="z">
  </div>
</div>

<ul></ul>

<h1>Open in Chrome Canary</h1>
  
    <script id="rendered-js" >
const CONTAINER = document.querySelector('ul');

const COVERS = [
"https://i.scdn.co/image/ab67616d00001e020ecc8c4fd215d9eb83cbfdb3",
"https://i.scdn.co/image/ab67616d00001e02d9194aa18fa4c9362b47464f",
"https://i.scdn.co/image/ab67616d00001e02a7ea08ab3914c5fb2084a8ac",
"https://i.scdn.co/image/ab67616d00001e0213ca80c3035333e5a6fcea59",
"https://i.scdn.co/image/ab67616d00001e02df04e6071763615d44643725",
"https://i.scdn.co/image/ab67616d00001e0239c7302c04f8d06f60e14403",
"https://i.scdn.co/image/ab67616d00001e021c0bcf8b536295438d26c70d",
"https://i.scdn.co/image/ab67616d00001e029bbd79106e510d13a9a5ec33",
"https://i.scdn.co/image/ab67616d00001e021d97ca7376f835055f828139",
"https://www.udiscovermusic.com/wp-content/uploads/2015/10/Kanye-West-Yeezus.jpg"];


const PADDING = 4;

// Add prepadding
for (let pre = 0; pre < PADDING; pre++) {if (window.CP.shouldStopExecution(0)) break;
  const COVER_INDEX = COVERS.length - (PADDING - 1) + pre;
  const ITEM = Object.assign(document.createElement('li'), {
    ariaHidden: true,
    innerHTML: `
      <div class="image-wrapper">
        <img src="${COVERS[COVER_INDEX - 1]}" alt="" />
      </div>
    ` });

  CONTAINER.appendChild(ITEM);
}
// Add items
window.CP.exitedLoop(0);for (let i = 0; i < COVERS.length; i++) {if (window.CP.shouldStopExecution(1)) break;
  const COVER_INDEX = i;
  const ITEM = Object.assign(document.createElement('li'), {
    innerHTML: `
      <div class="image-wrapper">
        <img src="${COVERS[COVER_INDEX]}" alt="" />
      </div>
    ` });

  CONTAINER.appendChild(ITEM);
}
// Add post padding
window.CP.exitedLoop(1);for (let post = 0; post < PADDING; post++) {if (window.CP.shouldStopExecution(2)) break;
  const COVER_INDEX = post;
  const ITEM = Object.assign(document.createElement('li'), {
    ariaHidden: true,
    innerHTML: `
      <div class="image-wrapper">
        <img src="${COVERS[COVER_INDEX]}" alt="" />
      </div>
    ` });

  CONTAINER.appendChild(ITEM);
}window.CP.exitedLoop(2);


const ITEMS = [...CONTAINER.children];

// Need to set the aria-hidden state on all items that are below and above
// This also engages the scroll-snap
ITEMS.forEach((ITEM, index) => {
  if (index <= 3 || index >= ITEMS.length - 4) ITEM.setAttribute('aria-hidden', true);
});

let scrollBounds;

const UPDATE = () => {
  if (CONTAINER.scrollLeft < scrollBounds.min) {
    CONTAINER.scrollLeft = scrollBounds.max;
  } else if (CONTAINER.scrollLeft > scrollBounds.max) {
    CONTAINER.scrollLeft = scrollBounds.min;
  }
};

const SET_SCROLL_BOUNDS = () => {
  scrollBounds = {};
  ITEMS[ITEMS.length - 1].scrollIntoView();
  scrollBounds.max = CONTAINER.scrollLeft + ITEMS[0].offsetWidth;
  ITEMS[0].scrollIntoView();
  scrollBounds.min = CONTAINER.scrollLeft - ITEMS[0].offsetWidth;
};

SET_SCROLL_BOUNDS();

CONTAINER.addEventListener('scroll', UPDATE);
//# sourceURL=pen.js
  </script>
