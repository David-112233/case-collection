  <title>Interactive classic tunnel illusion w/ CSS variables 🤩</title>

    <link rel="canonical" href="https://codepen.io/jh3y/pen/XZGMqV">

<style>
* {
  box-sizing: border-box;
}
:root {
  --xOrigin: 50;
  --yOrigin: 50;
}
body {
  background-color: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  width: 100vw;
}
.tunnel {
  cursor: pointer;
  height: 50vh;
  overflow: hidden;
  width: 50vh;
}
.tunnel__rings,
.tunnel__ring {
  height: 100%;
  width: 100%;
}
.tunnel__rings {
  position: relative;
  transform-style: preserve-3d;
}
.tunnel__ring {
  animation: scaleOut 2s infinite linear;
  left: 0;
  position: absolute;
  top: 0;
  transform: scale(0);
  transform-origin: calc(var(--xOrigin) * 1%) calc(var(--yOrigin) * 1%);
}
.tunnel__ring:nth-of-type(20) {
  animation-delay: 2.85s;
  background: #000;
}
.tunnel__ring:nth-of-type(19) {
  animation-delay: 2.7s;
  background: #0d0302;
}
.tunnel__ring:nth-of-type(18) {
  animation-delay: 2.55s;
  background: #1a0503;
}
.tunnel__ring:nth-of-type(17) {
  animation-delay: 2.4s;
  background: #270805;
}
.tunnel__ring:nth-of-type(16) {
  animation-delay: 2.25s;
  background: #340b06;
}
.tunnel__ring:nth-of-type(15) {
  animation-delay: 2.1s;
  background: #410d08;
}
.tunnel__ring:nth-of-type(14) {
  animation-delay: 1.95s;
  background: #4e100a;
}
.tunnel__ring:nth-of-type(13) {
  animation-delay: 1.8s;
  background: #5b130b;
}
.tunnel__ring:nth-of-type(12) {
  animation-delay: 1.65s;
  background: #68150d;
}
.tunnel__ring:nth-of-type(11) {
  animation-delay: 1.5s;
  background: #75180e;
}
.tunnel__ring:nth-of-type(10) {
  animation-delay: 1.35s;
  background: #821b10;
}
.tunnel__ring:nth-of-type(9) {
  animation-delay: 1.2s;
  background: #8f1d12;
}
.tunnel__ring:nth-of-type(8) {
  animation-delay: 1.05s;
  background: #9b2013;
}
.tunnel__ring:nth-of-type(7) {
  animation-delay: 0.9s;
  background: #a82315;
}
.tunnel__ring:nth-of-type(6) {
  animation-delay: 0.75s;
  background: #b52516;
}
.tunnel__ring:nth-of-type(5) {
  animation-delay: 0.6s;

}
.tunnel__ring:nth-of-type(4) {

}
.tunnel__ring:nth-of-type(3) {

.tunnel__ring:nth-of-type(2) {

}
.tunnel__ring:nth-of-type(1) {
  animation-delay: 0s;
  background: #e5402f;
}
@keyframes scaleOut {
  from {
    transform: scale(0) translate3d(0, 0, 0);
  }
  to {
    transform: scale(1.25) translate3d(0, 0, -100px);
  }
}
</style>

    <script id="rendered-js" >
const root = document.documentElement;
const tunnel = document.querySelector('.tunnel');

const updateTransformOrigin = e => {
  const {
    x,
    y } =
  e;
  const {
    height,
    width,
    x: elX,
    y: elY } =
  tunnel.getBoundingClientRect();
  const xOrigin = Math.floor((x - elX) / width * 100);
  const yOrigin = Math.floor((y - elY) / height * 100);
  root.style.setProperty('--xOrigin', xOrigin);
  root.style.setProperty('--yOrigin', yOrigin);
};

tunnel.addEventListener('mouseover', updateTransformOrigin);
//# sourceURL=pen.js
  </script>
