body {

  height: 100vh;
  background-color: #5b505b;
  overflow: hidden;
}
.highlight {
  position: absolute;
  width: 250px;
  height: 250px;
  border-radius: 50%;
  background: repeating-conic-gradient(rgba(255,255,255,0.15) 15%, transparent 20%, rgba(255,255,255,0.15) 30%, transparent 40%, rgba(255,255,255,0.15) 65%);
  mask: radial-gradient(transparent 20%, #000 25%);
  z-index: 5;
  scale: 1.5;
}
.rplayer {
  position: relative;
  display: grid;
  place-items: center;
  height: 450px;
  width: 450px;
  border-radius: 20px;
  background-image: linear-gradient(270deg, #010101, #212121);
  box-shadow: inset 2px 2px 3px rgba(255,255,255,0.325), inset -2px -2px 3px rgba(255,255,255,0.325), 0 0 15px rgba(0,0,0,0.85);
}
.rplayer .logo {
  height: 35px;
  width: 125px;
  position: absolute;
  color: #ddd;
  left: 43px;
  top: 20px;
  font-size: 18px;
  font-family: 'bungee';
}
.rplayer .logo:after {
  content: 'record players';
  font-size: 8px;
  position: absolute;
  left: 1px;
  bottom: 7px;
  width: 100%;
  word-wrap: none;
}
.rplayer .logo:before {
  content: 'D';
  position: absolute;
  font-size: 31px;
  left: -23px;
  top: -4px;
  transform: scaleX(-1);
}
.rplayer .power {
  width: 50px;
  height: 20px;

  font-size: 8px;
  color: #ddd;
  bottom: 15px;
  right: 45px;
  display: grid;
  place-items: center;
}
.rplayer .power:before {
  content: '';
  width: 5px;
  height: 5px;
  position: absolute;
  border-radius: 50%;
  background-color: var(--pwlight);
  left: 0;
  top: 7px;
}
.rplayer .power:after {
  content: '';

  height: 5px;
  position: absolute;
  border-radius: 50%;

  top: 7px;
}

.rplayer .power .pbutton:after {
  content: '';

  border-radius: 50%;

.rplayer .power .pbutton:before {

}
.rplayer .power p {
  position: absolute;
  text-transform: uppercase;
}

  width: 40px;

}

  <script src='https://cdnjs.cloudflare.com/ajax/libs/tone/15.1.2/Tone.js'></script>
    <script id="rendered-js" >
const pwr = document.querySelector('.pbutton');
const vol = document.querySelector('.knob');
const voln = document.querySelector('.spindiv');
const tb = document.querySelector('.tonebar');
const rec = document.querySelector('.record');
const powerlight = document.querySelector('.light');
const notch = document.querySelectorAll('.notch');
const clickme = document.querySelector('.clickme');

let playing = 0;
document.documentElement.style.setProperty('--pwlight', 'rgba(255,255,255,.5)');
pwr.addEventListener('click', () => {
  if (playing === 0) {
    tb.style.transform = 'rotate(17deg)';
    document.documentElement.style.setProperty('--pwlight', 'red');
    clickme.style.opacity = '0';
    playing = 1;
    playRockLoop();
  } else {
    tb.style.transform = 'rotate(0deg)';
    document.documentElement.style.setProperty('--pwlight', 'rgba(255,255,255,.5)');
    playing = 0;
    stopRockLoop();
    clickme.style.opacity = '1';
  }
});

notch.forEach((n, index) => {
  n.addEventListener('click', () => {
    let angle = index * 23;
    console.log(index);
    voln.style.transform = `rotate(${angle}deg)`;
  });
});


let rockLoop;
let startDelay = 1000; // 1 second delay

function playRockLoop() {
  // Create synths for bass, lead, pads, and melody
  const bassSynth = new Tone.PolySynth(Tone.Synth).toDestination();
  const leadSynth = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "square" },
    envelope: { attack: 0.01, decay: 0.2, sustain: 0.5, release: 0.1 } }).
  toDestination();
  const padSynth = new Tone.PolySynth(Tone.FMSynth, {
    harmonicity: 3.5,
    modulationIndex: 10,
    envelope: { attack: 0.5, release: 2, sustain: 1, decay: 0.5 } }).
  toDestination();
  const melodySynth = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 0.1, decay: 0.2, sustain: 0.4, release: 0.8 } }).
  toDestination();

  // Create drums
  const kick = new Tone.MembraneSynth({ pitchDecay: 0.05 }).toDestination();
  const snare = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.2, sustain: 0.1, release: 0.03 } }).toDestination();
  const hats = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.05, sustain: 0.1, release: 0.02 } }).toDestination();

  // Set the tempo and time signature
  Tone.Transport.bpm.value = 120;
  Tone.Transport.timeSignature = [4, 4];

  // Define the rock loop
  rockLoop = new Tone.Loop(time => {
    // Intro drum pattern
    const introPattern = [
    ["8n", "8n", "8n", "8n", "8n", "8n", "8n", "8n"], // Snare drum roll
    ["4n", null, "4n", null, "4n", null, "4n", "4n"] // Kick kick snare, kick kick, snare, kick kick kick
    ];

    for (let i = 0; i < introPattern[0].length; i++) {
      if (introPattern[0][i]) {
        snare.triggerAttackRelease(introPattern[0][i], time + i * 0.125);
      }
      if (introPattern[1][i]) {
        kick.triggerAttackRelease(introPattern[1][i], time + i * 0.125);
      }
      hats.triggerAttackRelease("16n", time + i * 0.125); // Add hi-hats
    }

    // Main loop
    kick.triggerAttackRelease("C2", "4n", time + 2);
    snare.triggerAttackRelease("8n", time + 2.5);
    hats.triggerAttackRelease("8n", time + 2);
    hats.triggerAttackRelease("8n", time + 2.25);
    hats.triggerAttackRelease("8n", time + 2.5);
    hats.triggerAttackRelease("8n", time + 2.75);

    // Bass line
    bassSynth.triggerAttackRelease("C2", "4n", time + 2);
    bassSynth.triggerAttackRelease("F2", "4n", time + 2.5);
    bassSynth.triggerAttackRelease("C2", "8n", time + 3);
    bassSynth.triggerAttackRelease("G2", "8n", time + 3.25);

    // Lead melody
    leadSynth.triggerAttackRelease("C4", "4n", time + 2);
    leadSynth.triggerAttackRelease("F3", "4n", time + 2.5);
    leadSynth.triggerAttackRelease("G3", "8n", time + 3);
    leadSynth.triggerAttackRelease("C4", "8n", time + 3.25);

    // Pad chords
    padSynth.triggerAttackRelease("C3", "4n", time + 2);
    padSynth.triggerAttackRelease("F3", "4n", time + 2.5);
    padSynth.triggerAttackRelease("G3", "8n", time + 3);
    padSynth.triggerAttackRelease("C4", "8n", time + 3.25);

    // Synth melody
    melodySynth.triggerAttackRelease("E4", "16n", time + 2);
    melodySynth.triggerAttackRelease("G4", "16n", time + 2.125);
    melodySynth.triggerAttackRelease("C5", "16n", time + 2.25);
    melodySynth.triggerAttackRelease("B4", "16n", time + 2.375);
    melodySynth.triggerAttackRelease("A4", "16n", time + 2.5);
    melodySynth.triggerAttackRelease("G4", "16n", time + 2.625);
    melodySynth.triggerAttackRelease("E4", "16n", time + 2.75);
    melodySynth.triggerAttackRelease("C4", "16n", time + 2.875);
    melodySynth.triggerAttackRelease("G3", "16n", time + 3);
    melodySynth.triggerAttackRelease("E4", "16n", time + 3.125);
    melodySynth.triggerAttackRelease("C4", "16n", time + 3.25);
    melodySynth.triggerAttackRelease("G4", "16n", time + 3.375);
    melodySynth.triggerAttackRelease("C5", "16n", time + 3.5);
    melodySynth.triggerAttackRelease("G4", "16n", time + 3.625);
    melodySynth.triggerAttackRelease("E4", "16n", time + 3.75);
    melodySynth.triggerAttackRelease("C4", "16n", time + 3.875);
  }, "4m").start("+.5");

  // Start the transport with the specified delay
  Tone.Transport.start(`+${startDelay / 1000}`);
}

function stopRockLoop() {
  // Stop the transport and cancel scheduled events
  Tone.Transport.stop();
  Tone.Transport.cancel();

  // Dispose the loop
  rockLoop.dispose();
}
