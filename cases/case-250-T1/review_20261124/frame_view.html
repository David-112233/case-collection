<!DOCTYPE html>
<!-- 自检辅助页：把 ../ground_truth.html 放进指定宽度的同源 iframe（?w=450），
     用来在最小只能开到 500px 宽的云端浏览器里查看 480px、225px 断点以下的版式。不属于 GT，不参与评分。 -->
<html lang="zh"><head><meta charset="UTF-8"><title>frame view</title>
<style>html,body{margin:0;background:#888}iframe{border:0;display:block;background:#fff}</style>
</head><body>
<iframe id="f" src="../ground_truth.html"></iframe>
<script>
const q = new URLSearchParams(location.search);
const f = document.getElementById('f');
f.style.width = (parseInt(q.get('w'), 10) || 450) + 'px';
f.style.height = (parseInt(q.get('h'), 10) || 1400) + 'px';
</script>
</body></html>
