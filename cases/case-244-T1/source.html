  <title>Interlocking Olymipic Rings</title>

    <link rel="canonical" href="https://codepen.io/kevinleclair1/pen/XJgQrr">
  
  
  
  
<style>
.wrapper {
				width: 735px;
				margin: 100px auto 0 auto;
				position: relative;
			}

			.ring {
				margin:5px;
				float:left;
				position: absolute;
				padding: 100px;
				border-radius: 50%;
			}
			.ring1 {
				border:15px solid #0085c7;
			}
			.ring2 {
				border:15px solid #f4c300;
				top: 100px;
				left: 100px;
			}
			.ring3 {
				border:15px solid #000000;
				left: 250px;
				z-index: -1;
			}
			.ring4 {
				border:15px solid #009f3d;
				top: 100px;
				left: 350px;
				z-index: 10;
			}
			.ring5 {
				border:15px solid #df0024;
				left: 500px;
			}

			.overlap {
				border: 15px solid transparent; 
			}
			.overlap1 {

				border-left:15px solid #df0024; 
				left: 500px;	
				z-index: 10;
}
			.overlap2 {
	
				border-right:15px solid #000000	; 
				left: 250px;
				z-index: 20;
}

			.overlap3 {
	
				border-bottom:15px solid black; 
				left: 250px;	
				z-index: 1;
}

				.overlap4 {
				  
				border-left:15px solid black; 
				left: 250px;	
				z-index:-1 ;
}

				.overlap5 {
				  
				border-right:15px solid #0085c7; 	
				z-index:1 ;
}
</style>


  
  
</head>

<body translate="no">
  <html lang="en-US">
	<head>
		<title>CSS z-index</title>
	</head>
	<body>
		<div class="wrapper">
			<div class="ring ring1"></div>
			<div class="ring ring2"></div>
			<div class="ring ring3"></div>
			<div class="ring ring4"></div>
			<div class="ring ring5"></div>	
			<div class="ring overlap overlap1"></div>	
			<div class="ring overlap overlap2"></div>
			<div class="ring overlap overlap3"></div>
			<div class="ring overlap overlap4"></div>
			<div class="ring overlap overlap5"></div>		
		</div>
	</body>
</html>
  
  
  
</body>

</html>
